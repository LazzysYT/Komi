name: Admin MFA enrollment tests
on:
  pull_request:
    paths:
      - 'komi-admin-mfa.js'
      - 'admin-security.html'
      - 'admin-security-entry.js'
      - 'app-main.js'
      - 'scripts/admin-mfa.test.cjs'
      - 'scripts/admin-mfa-browser.cjs'
      - 'vercel.json'
      - '.github/workflows/admin-mfa-tests.yml'
  push:
    branches: [main]
    paths:
      - 'komi-admin-mfa.js'
      - 'admin-security.html'
      - 'admin-security-entry.js'
      - 'app-main.js'
      - 'scripts/admin-mfa.test.cjs'
      - 'scripts/admin-mfa-browser.cjs'
      - 'vercel.json'
      - '.github/workflows/admin-mfa-tests.yml'
permissions:
  contents: read
jobs:
  offline-mfa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test scripts/admin-mfa.test.cjs
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node scripts/admin-mfa-browser.cjs
