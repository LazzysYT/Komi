name: Security guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check tracked files and security headers
        run: node scripts/security-check.cjs
