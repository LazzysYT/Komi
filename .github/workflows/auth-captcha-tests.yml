name: Auth abuse protection tests
on:
  pull_request:
    paths:
      - 'komi-auth-captcha.js'
      - 'scripts/auth-captcha.test.cjs'
      - 'app-main.js'
      - 'index.html'
      - 'vercel.json'
      - 'scripts/minify-static.cjs'
      - '.github/workflows/auth-captcha-tests.yml'
  push:
    branches: [main]
    paths:
      - 'komi-auth-captcha.js'
      - 'scripts/auth-captcha.test.cjs'
      - 'app-main.js'
      - 'index.html'
      - 'vercel.json'
      - 'scripts/minify-static.cjs'
permissions:
  contents: read
jobs:
  offline-auth-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test scripts/auth-captcha.test.cjs
