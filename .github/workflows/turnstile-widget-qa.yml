name: Isolated Turnstile widget QA
on:
  push:
    branches: [security/turnstile-widget-qa]
permissions:
  contents: read
jobs:
  widget-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node --check scripts/turnstile-widget-browser.cjs
      - run: node scripts/turnstile-widget-browser.cjs
