name: Profile extras QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'komi-profile-extras*'
      - 'docs/profile-extras-v1.sql'
      - 'assets/profile-medals/**'
      - 'assets/profile-cursors/**'
      - 'scripts/profile-extras*'
      - '.github/workflows/profile-extras-qa.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify isolated medal, wallet, and friend privacy operations
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/profile-extras-db-fixture.sql
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/profile-extras.test.cjs
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          node --test scripts/profile-extras-browser.test.cjs
