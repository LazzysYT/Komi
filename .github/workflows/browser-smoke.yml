name: Komi browser smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'watch-party.js'
      - 'anicoin.js'
      - 'anime-details.js'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/auth-isolation-e2e.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
      KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
      KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
      KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax before browser tests
        run: |
          node --check watch-party.js
          node --check anicoin.js
          node --check anime-details.js
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for (const [index, match] of scripts.entries()) {
            if (match[1].trim()) new vm.Script(match[1], { filename: 'index.html:inline:' + index });
          }
          console.log('Checked', scripts.length, 'inline script tags');
          NODE
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        env:
          KOMI_TEST_URL: http://127.0.0.1:8787/
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 &
          node scripts/browser-smoke.cjs
      - name: Run real two-account auth and RLS E2E (when secrets configured)
        if: ${{ env.KOMI_TEST_EMAIL_A != '' && env.KOMI_TEST_PASSWORD_A != '' && env.KOMI_TEST_EMAIL_B != '' && env.KOMI_TEST_PASSWORD_B != '' }}
        env:
          KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
          KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
          KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
          KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
        run: node scripts/auth-isolation-e2e.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komi-browser-smoke
          path: browser-test-results/
          if-no-files-found: ignore
