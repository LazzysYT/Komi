name: Komi browser smoke tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'scripts/**'
      - 'api/**'
      - 'vercel.json'
      - 'robots.txt'
      - 'supabase/migrations/**'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/auth-isolation-e2e.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
      KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
      KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
      KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          # Hosted Ubuntu runner already has Chromium runtime libraries. Avoid apt mirrors
          # here: DNS outages installing optional fonts would block all code tests.
          npx playwright install chromium
      - name: Run desktop and mobile browser checks
        env:
          KOMI_TEST_URL: http://127.0.0.1:8765
        run: |
          node scripts/check-syntax.cjs
          node --test scripts/player-core.test.cjs scripts/catalog-first-paint.test.cjs scripts/static-dom-audit.test.cjs scripts/friend-sidebar-security.test.cjs scripts/profile-markup-security.test.cjs scripts/presence-rpc.test.cjs scripts/account-reload-race.test.cjs scripts/status-persistence.test.cjs scripts/account-pagination.test.cjs scripts/party-join-guard.test.cjs scripts/saved-card-hydration.test.cjs scripts/seo-admin-regression.test.cjs scripts/auth-identity.test.cjs scripts/auth-signup-oauth.test.cjs scripts/search-suggestions-security.test.cjs scripts/cloud-folders-regression.test.cjs scripts/auth-session-isolation.test.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/komi-preview.log 2>&1 &
          node scripts/regression-browser.cjs
          node scripts/profile-collection-browser.cjs
          node scripts/saved-card-hydration-browser.cjs
          node scripts/auth-oauth-browser.cjs
          node scripts/search-suggestions-browser.cjs
          node scripts/cloud-folders-browser.cjs
          node scripts/profile-markup-security-browser.cjs
          node scripts/party-regression.cjs
          node scripts/browser-smoke.cjs
      - name: Smoke-test actual komianime.online as a signed-out visitor
        timeout-minutes: 4
        run: node scripts/live-domain-smoke.cjs
      - name: Run real two-account auth and RLS E2E (when secrets configured)
        # Real-account credentials are currently rejected by Supabase; run deliberately with valid test accounts.
        # Automated PR smoke remains mandatory and does not silently report this live-auth test as passed.
        if: ${{ github.event_name == 'workflow_dispatch' && env.KOMI_TEST_EMAIL_A != '' && env.KOMI_TEST_PASSWORD_A != '' && env.KOMI_TEST_EMAIL_B != '' && env.KOMI_TEST_PASSWORD_B != '' }}
        env:
          KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
          KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
          KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
          KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
        run: node scripts/auth-isolation-e2e.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komi-browser-smoke
          path: browser-test-results/
          if-no-files-found: ignore
