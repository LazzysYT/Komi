name: Komi browser smoke tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.mjs'
      - 'scripts/**'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/auth-isolation-e2e.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
      KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
      KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
      KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        env:
          KOMI_TEST_URL: http://127.0.0.1:8765
        run: |
          node scripts/check-syntax.cjs
          node --check admin-editor.mjs
          node --test scripts/qa-audit.test.cjs scripts/legacy-import.test.cjs scripts/release-gates.test.cjs scripts/status-persistence.test.cjs scripts/auth-identity.test.cjs scripts/avatar-upload.test.cjs scripts/custom-folders.test.cjs scripts/catalog-first-paint.test.cjs scripts/auth-e2e-target.test.cjs
          node --test scripts/player-core.test.cjs scripts/party-join-guard.test.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/komi-preview.log 2>&1 &
          node scripts/regression-browser.cjs
          node scripts/party-regression.cjs
          node scripts/browser-smoke.cjs
      - name: Smoke-test actual komianime.online as a signed-out visitor
        timeout-minutes: 4
        run: node scripts/live-domain-smoke.cjs
      - name: Run real two-account auth and RLS E2E (when secrets configured)
        # Manual only: verify the source branch/commit and the reviewed URL first.
        # Use disposable dedicated test accounts, not administrator/owner credentials.
        # Set the repository variable KOMI_TEST_URL to the exact verified Preview URL.
        # Automated PR smoke does not silently count this as passed.
        if: ${{ github.event_name == 'workflow_dispatch' && env.KOMI_TEST_EMAIL_A != '' && env.KOMI_TEST_PASSWORD_A != '' && env.KOMI_TEST_EMAIL_B != '' && env.KOMI_TEST_PASSWORD_B != '' }}
        env:
          KOMI_TEST_URL: ${{ vars.KOMI_TEST_URL }}
          KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
          KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
          KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
          KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
        run: node scripts/auth-isolation-e2e.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komi-browser-smoke
          path: browser-test-results/
          if-no-files-found: ignore
