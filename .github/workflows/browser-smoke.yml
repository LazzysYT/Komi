name: Komi browser smoke tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'scripts/**'
      - 'api/**'
      - 'vercel.json'
      - 'robots.txt'
      - 'supabase/migrations/**'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/auth-isolation-e2e.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
      KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
      KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
      KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          # Hosted Ubuntu runner already has Chromium runtime libraries. Avoid apt mirrors
          # here: DNS outages installing optional fonts would block all code tests.
          npx playwright install chromium
      - name: Run desktop and mobile browser checks
        env:
          KOMI_TEST_URL: http://127.0.0.1:8765
        run: |
          node scripts/build-css.cjs --check
          node scripts/check-syntax.cjs
          node --check scripts/auth-isolation-e2e.cjs
          node --check scripts/party-real-auth-e2e.cjs
          node --test scripts/*.test.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/komi-preview.log 2>&1 &
          failures=0
          for script in \
            scripts/v8-guest-browser.cjs \
            scripts/shop-v3-browser.cjs \
            scripts/regression-browser.cjs \
            scripts/home-first-paint-browser.cjs \
            scripts/resume-hydration-browser.cjs \
            scripts/profile-collection-browser.cjs \
            scripts/mobile-profile-browser.cjs \
            scripts/saved-card-hydration-browser.cjs \
            scripts/auth-oauth-browser.cjs \
            scripts/search-suggestions-browser.cjs \
            scripts/search-shortcut-browser.cjs \
            scripts/cloud-folders-browser.cjs \
            scripts/profile-markup-security-browser.cjs \
            scripts/party-regression.cjs \
            scripts/friend-party-browser.cjs \
            scripts/player-ux-browser.cjs \
            scripts/cloud-watched-browser.cjs \
            scripts/mobile-tab-bar-browser.cjs \
            scripts/mobile-bottom-sheets-browser.cjs \
            scripts/browser-smoke.cjs \
            scripts/static-anchors-browser.cjs \
            scripts/static-ui-events-browser.cjs \
            scripts/dynamic-ui-events-browser.cjs \
            scripts/csp-enforcement-browser.cjs; do
            echo "::group::Browser check $script"
            if node "$script"; then
              echo "PASSED $script"
            else
              echo "::error::FAILED $script"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          test "$failures" -eq 0
      - name: Verify minified build in Chromium
        if: ${{ !cancelled() }}
        env:
          KOMI_TEST_URL: http://127.0.0.1:8766
        run: |
          npx --yes --package=esbuild@0.25.12 --package=postcss@8.5.6 -- node scripts/minify-static.cjs
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/komi-minified.log 2>&1 &
          node scripts/v8-critical-browser.cjs
          node scripts/v8-guest-browser.cjs
          node scripts/shop-v3-browser.cjs
      - name: Smoke-test actual komianime.online as a signed-out visitor
        timeout-minutes: 4
        run: node scripts/live-domain-smoke.cjs
      - name: Check live public Supabase API exposes no private tables
        timeout-minutes: 3
        run: node scripts/live-anon-api-security.cjs
      - name: Require dedicated test accounts for manual Auth E2E
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          for key in KOMI_TEST_EMAIL_A KOMI_TEST_PASSWORD_A KOMI_TEST_EMAIL_B KOMI_TEST_PASSWORD_B; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret $key. Real two-account E2E was NOT executed."
              exit 1
            fi
          done
      - name: Run real two-account email auth and RLS E2E
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KOMI_TEST_URL: https://komianime.online/
        run: node scripts/auth-isolation-e2e.cjs
      - name: Run real two-account private Watch Party E2E
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KOMI_TEST_URL: https://komianime.online/
        run: node scripts/party-real-auth-e2e.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komi-browser-smoke
          path: browser-test-results/
          if-no-files-found: ignore
