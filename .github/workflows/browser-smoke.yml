name: Komi browser smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/auth-isolation-e2e.cjs'
      - 'scripts/player-regression.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
      KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
      KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
      KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run player and session regression checks
        run: node scripts/player-regression.cjs
      - name: Run desktop and mobile browser checks against this checkout
        env:
          KOMI_TEST_URL: http://127.0.0.1:8080
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/browser-smoke.cjs
      - name: Run real two-account auth and RLS E2E (when secrets configured)
        if: ${{ env.KOMI_TEST_EMAIL_A != '' && env.KOMI_TEST_PASSWORD_A != '' && env.KOMI_TEST_EMAIL_B != '' && env.KOMI_TEST_PASSWORD_B != '' }}
        env:
          KOMI_TEST_EMAIL_A: ${{ secrets.KOMI_TEST_EMAIL_A }}
          KOMI_TEST_PASSWORD_A: ${{ secrets.KOMI_TEST_PASSWORD_A }}
          KOMI_TEST_EMAIL_B: ${{ secrets.KOMI_TEST_EMAIL_B }}
          KOMI_TEST_PASSWORD_B: ${{ secrets.KOMI_TEST_PASSWORD_B }}
        run: node scripts/auth-isolation-e2e.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komi-browser-smoke
          path: browser-test-results/
          if-no-files-found: ignore
