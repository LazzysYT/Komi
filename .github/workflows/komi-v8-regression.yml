name: Komi V8 regression
on:
  pull_request:
    branches: [main, polish/navigation-player-20261124]
  push:
    branches: [fix/v8-stability-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify JavaScript and V8 regressions
        run: |
          node --version
          node --check app-main.js
          node --check komi-home-boot.js
          node --test tests/v8-stability.test.cjs
          node --test tests/navigation-player-v72.test.cjs
          node --test tests/hero-v811.test.cjs
          node --test scripts/hero-art.test.cjs
