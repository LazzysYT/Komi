name: Bounded upstream API tests
on:
  pull_request:
    paths:
      - 'api/_bounded-json.js'
      - 'api/anivibe.js'
      - 'api/import-shikimori.js'
      - 'scripts/anivibe.test.cjs'
      - 'scripts/bounded-upstream-json.test.cjs'
      - '.github/workflows/upstream-bounds-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'scripts/anivibe.test.cjs'
      - 'scripts/bounded-upstream-json.test.cjs'
      - '.github/workflows/upstream-bounds-tests.yml'
permissions:
  contents: read
jobs:
  offline-api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test scripts/anivibe.test.cjs scripts/bounded-upstream-json.test.cjs
