<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Короткие рисованные сцены с Канэки, Луффи и Коми Сёко в KomiAnime.">
  <title>Живые сцены — KomiAnime</title>
  <link rel="canonical" href="https://komianime.online/collection-scenes.html">
  <link rel="stylesheet" href="/komi-collection-scenes.css?v=20261128-collection-live-scenes">
  <script defer src="/komi-collection-scenes.js?v=20261128-collection-live-scenes"></script>
</head>
<body>
  <header class="masthead"><div class="shell"><a class="brand" href="/" aria-label="KomiAnime — главная">KomiAnime</a><a class="back-link" href="/collection">К коллекции</a></div></header>
  <main class="shell">
    <div class="toolbar">
      <h1>Живые сцены</h1>
      <div class="gallery-controls">
        <label class="label-toggle"><input id="hide-labels" type="checkbox" autocomplete="off">Скрыть подписи</label>
        <label class="label-toggle"><input id="animate-cards" type="checkbox" autocomplete="off" checked>Анимация карточек</label>
      </div>
    </div>
    <ul class="grid" id="grid"></ul>
    <noscript><p>Включите JavaScript, чтобы открыть галерею.</p></noscript>
  </main>
  <dialog aria-labelledby="detail-name" aria-describedby="detail-series">
    <header class="detail-header">
      <div><h2 class="detail-name" id="detail-name"></h2><p class="detail-series" id="detail-series"></p><span class="detail-rarity"></span></div>
      <button type="button" class="close" aria-label="Закрыть" autofocus>×</button>
    </header>
    <div class="scene-view">
      <canvas class="scene-frame" width="576" height="768" role="img"></canvas>
      <p class="scene-status" role="status" hidden></p>
    </div>
    <div class="scene-controls" aria-label="Управление сценой" role="group">
      <button type="button" id="skip" disabled>Пропустить</button>
      <button type="button" id="replay" disabled>Повторить</button>
      <button type="button" id="sound" aria-pressed="false" disabled>Звук выкл.</button>
    </div>
  </dialog>
  <template id="card-template">
    <li><button class="card" type="button" aria-haspopup="dialog">
      <span class="art"><img class="portrait" alt=""><canvas class="portrait-loop" width="384" height="512" aria-hidden="true"></canvas></span>
      <span class="rarity"></span>
      <span class="caption"><span class="character"></span><span class="series"></span></span>
    </button></li>
  </template>
</body>
</html>
