                    <input type="number" class="form-control ep-season" value="1" min="1" style="width:50px;" title="Сезон">
                    <input type="text" class="form-control ep-title" value="Эпизод 1" style="flex:1; min-width:70px;">
                    <input type="text" class="form-control ep-source-name" value="Kodik" style="width:80px;">
                    <input type="text" class="form-control ep-url" placeholder="iframe код или mp4..." style="flex:2; min-width:140px;" required>
                </div>
            `;

            if (editId) {
                const anime = animeList.find(a => a.id === editId);
                if (anime) {
                    document.getElementById('editAnimeId').value = anime.id;
                    document.getElementById('animeTitle').value = anime.title;
                    document.getElementById('animePoster').value = anime.poster;
                    document.getElementById('animeShikiRating').value = anime.shikiRating || '';
                    document.getElementById('animeScreenshots').value = (anime.screenshots || []).join(', ');
                    document.getElementById('animeTrailer').value = anime.trailer || '';
                    document.getElementById('animeYear').value = anime.year || '2026';
                    document.getElementById('animeType').value = anime.type || 'Сериал';
                    document.getElementById('animeDesc').value = anime.desc || '';
                    renderGenresCheckboxes(anime.genres || [anime.genre]);

                    if (anime.episodes && anime.episodes.length > 0) {
                        let epsHtml = '';
                        anime.episodes.forEach(ep => {
                            const sourcesObj = ep.sources || { 'Default': ep.url || '' };
                            Object.entries(sourcesObj).forEach(([srcName, srcVal]) => {
                                const safeSrcVal = srcVal.replace(/"/g, '&quot;');
                                epsHtml += `
                                    <div style="display:flex; gap:5px; margin-bottom:5px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:6px; border-radius:6px;">
                                        <input type="number" class="form-control ep-season" value="${ep.season || 1}" min="1" style="width:50px;">
                                        <input type="text" class="form-control ep-title" value="${ep.title}" style="flex:1; min-width:70px;">
                                        <input type="text" class="form-control ep-source-name" value="${srcName}" style="width:80px;">
                                        <input type="text" class="form-control ep-url" value="${safeSrcVal}" style="flex:2; min-width:140px;" required>
                                    </div>
                                `;
                            });
                        });
                        document.getElementById('episodesList').innerHTML = epsHtml;
                    }
                }
            }
            modal.classList.add('active');
        }

        function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
        
        function addEpisodeField() {
            const div = document.createElement('div');
            div.style.cssText = "display:flex; gap:5px; margin-top:5px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:6px; border-radius:6px;";
            div.innerHTML = `
                <input type="number" class="form-control ep-season" value="1" min="1" style="width:50px;">
                <input type="text" class="form-control ep-title" value="Эпизод" style="flex:1; min-width:70px;">
                <input type="text" class="form-control ep-source-name" value="Kodik" style="width:80px;">
                <input type="text" class="form-control ep-url" placeholder="iframe код или mp4..." style="flex:2; min-width:140px;" required>
            `;
            document.getElementById('episodesList').appendChild(div);
        }

        async function saveAnimeForm(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnimeId').value;
            const title = document.getElementById('animeTitle').value;
            const poster = document.getElementById('animePoster').value;
            const shikiRating = document.getElementById('animeShikiRating').value.trim() || '8.5';
            const screenshotsInput = document.getElementById('animeScreenshots').value.trim();
            const trailer = document.getElementById('animeTrailer').value;
            const year = document.getElementById('animeYear').value || '2026';
            const type = document.getElementById('animeType').value || 'Сериал';
            const desc = document.getElementById('animeDesc').value;

            let screenshots = screenshotsInput ? screenshotsInput.split(',').map(s => s.trim()).filter(Boolean) : [poster, poster, poster, poster];
            if (screenshots.length === 0) screenshots = [poster];

            const selectedGenres = [];
            document.querySelectorAll('.genre-checkbox:checked').forEach(cb => selectedGenres.push(cb.value));
            const genres = selectedGenres.length > 0 ? selectedGenres : ['Экшен'];

            const episodesMap = {};
            const seasonsInputs = document.querySelectorAll('.ep-season');
            const titles = document.querySelectorAll('.ep-title');
            const sourceNames = document.querySelectorAll('.ep-source-name');
            const urls = document.querySelectorAll('.ep-url');
            
            for(let i=0; i<titles.length; i++) {
                const season = parseInt(seasonsInputs[i].value) || 1;
                const epTitle = titles[i].value;
                const srcName = sourceNames[i].value.trim() || 'Плеер 1';
                let rawUrl = urls[i].value.trim();

                const mapKey = `${season}_${epTitle}`;
                if (!episodesMap[mapKey]) {
                    episodesMap[mapKey] = { season, title: epTitle, sources: {} };
                }
                episodesMap[mapKey].sources[srcName] = rawUrl;
            }

            const episodes = Object.values(episodesMap);

            if (editId) {
                const anime = animeList.find(a => a.id === editId);
                if (anime) Object.assign(anime, { title, poster, shikiRating, screenshots, trailer, genres, genre: genres[0], year, type, desc, episodes });
            } else {
                animeList.push({ id: 'anime_' + Date.now(), title, poster, shikiRating, screenshots, trailer, genres, genre: genres[0], year, type, desc, episodes, ratings: {} });
            }

            await saveAnimeToCloud();
            closeAddModal();
        }

        function showGoogleAuthInfo() {
            alert('Вход через Google пока не подключён к аккаунтам Komi. Для безопасного запуска нужно настроить Google OAuth в Supabase и связать Google ID с профилями сайта. Сейчас используйте обычный вход.');
        }

        function openAuthModal(mode = 'login') {
            switchAuthTab(mode);
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }

        function switchAuthTab(mode) {
            const loginBtn = document.getElementById('tabLoginBtn');
            const regBtn = document.getElementById('tabRegisterBtn');
            const loginForm = document.getElementById('loginFormContainer');
            const regForm = document.getElementById('registerFormContainer');

            if (mode === 'login') {
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
            } else {
                regBtn.classList.add('active');
                loginBtn.classList.remove('active');
                regForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value;
            if (!username || !passwordInput) return;

            const passwordHash = await hashPassword(passwordInput);
            if (registeredUsers[username] && registeredUsers[username] === passwordHash) {
                currentUser = { username };
                saveData();
                closeAuthModal();
                render();
            } else {
                alert('Неверный логин или пароль!');
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const passwordInput = document.getElementById('regPassword').value;
            if (!username || !passwordInput) return;

            if (registeredUsers[username]) {
                alert('Пользователь уже существует!');
                return;
            }

            const passwordHash = await hashPassword(passwordInput);
            registeredUsers[username] = passwordHash;
            currentUser = { username };

            const nowStr = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            userProfiles[username] = { 
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`, 
                status: 'Новичок ⭐', 
                regDate: nowStr 
            };

            await saveProfilesToCloud();
            saveData();
            closeAuthModal();
            render();
            alert('Регистрация успешна!');
        }

        function toggleFavorite(id, category) {
            if (!currentUser) { openAuthModal('login'); return; }
            if (!userFavorites[currentUser.username]) userFavorites[currentUser.username] = {};
            if (userFavorites[currentUser.username][id] === category) {
                delete userFavorites[currentUser.username][id];
            } else {
                userFavorites[currentUser.username][id] = category;
            }
            saveData();
            openWatchModal(id);
        }

        function addToCustomFolder(id, folderName) {
            if (!currentUser) { openAuthModal('login'); return; }
            if (!userCustomFolders[currentUser.username]) userCustomFolders[currentUser.username] = {};
            if (!userCustomFolders[currentUser.username][folderName]) userCustomFolders[currentUser.username][folderName] = [];
            
            const list = userCustomFolders[currentUser.username][folderName];
            const idx = list.indexOf(id);
            if (idx > -1) {
                list.splice(idx, 1);
            } else {
                list.push(id);
            }
            saveData();
            openWatchModal(id);
        }

        function setAnimeStatus(animeId, status) {
            if (!currentUser) { openAuthModal('login'); return; }
            if (!userAnimeStatuses[currentUser.username]) userAnimeStatuses[currentUser.username] = {};
            if (userAnimeStatuses[currentUser.username][animeId] === status) {
                delete userAnimeStatuses[currentUser.username][animeId];
            } else {
                userAnimeStatuses[currentUser.username][animeId] = status;
            }
            saveData();
            openWatchModal(animeId);
        }

        function closeWatchModal() {
            const videoEl = document.getElementById('animeVideoPlayer');
            if (videoEl) {
                videoEl.pause();
                videoEl.currentTime = 0;
            }
            document.getElementById('watchModal').classList.remove('active');
        }

        function changePlayerSource(animeId, season, epIdx, sourceName) {
            activePlayerSource = sourceName;
            openWatchModal(animeId, season, epIdx);
        }

        async function openWatchModal(id, selectedSeason = null, selectedEpIdx = 0) {
            siteStats.views++;
            saveData();
            
            if (_supabase) {
                try {
                    const { data } = await _supabase.from('animes').select('*').in('id', [2, 4]);
                    if (data) {
                        data.forEach(row => {
                            if (row.id === 2) animeComments = JSON.parse(row.content || '{}');
                            if (row.id === 4) userProfiles = { ...userProfiles, ...JSON.parse(row.content || '{}') };
                        });
                    }
                } catch(e) {}
            }

            const anime = animeList.find(a => a.id === id);
            if (!anime || !anime.episodes || anime.episodes.length === 0) return;

            const seasonsMap = {};
            anime.episodes.forEach((ep, idx) => {
                const s = ep.season || 1;
                if (!seasonsMap[s]) seasonsMap[s] = [];
                seasonsMap[s].push({ ...ep, originalIdx: idx });
            });

            const seasonNumbers = Object.keys(seasonsMap).map(Number).sort((a,b) => a - b);
            const activeSeason = selectedSeason !== null && seasonsMap[selectedSeason] ? selectedSeason : seasonNumbers[0];
            const currentSeasonEpisodes = seasonsMap[activeSeason];
            const currentEp = currentSeasonEpisodes[selectedEpIdx] || currentSeasonEpisodes[0];

            const sources = currentEp.sources || { 'Default': currentEp.url || '' };
            const sourceNames = Object.keys(sources);
            if (!sourceNames.includes(activePlayerSource)) {
                activePlayerSource = sourceNames[0];
            }
            const activeUrl = sources[activePlayerSource] || '';

            let playerHtml = '';
            if (activeUrl.trim().startsWith('<iframe')) {
                playerHtml = `<div class="player-box">${activeUrl}</div>`;
            } else {
                playerHtml = `
                    <div class="player-box">
                        <video id="animeVideoPlayer" controls preload="metadata" crossorigin="anonymous" playsinline ontimeupdate="saveProgress('${anime.id}', this)" onended="playNextEp('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0})">
                            <source src="${activeUrl}" type="video/mp4">
                        </video>
                    </div>
                `;
            }

            const comments = animeComments[anime.id] || [];
            const userHistoryKey = currentUser ? `${currentUser.username}_${anime.id}` : null;
            const savedTime = userHistoryKey ? (userWatchHistory[userHistoryKey] || 0) : 0;
            const userFavCategory = currentUser ? ((userFavorites[currentUser.username] || {})[anime.id] || '') : '';
            const shikiRating = anime.shikiRating || '8.5';
            const myCurrentStatus = currentUser && userAnimeStatuses[currentUser.username] ? (userAnimeStatuses[currentUser.username][anime.id] || '') : '';
            
            const customFolders = currentUser ? (userCustomFolders[currentUser.username] || {}) : {};
            const screenshots = (anime.screenshots && anime.screenshots.length > 0) ? anime.screenshots : [anime.poster, anime.poster, anime.poster, anime.poster];

            document.getElementById('watchModalContent').innerHTML = `
                <button class="modal-close" onclick="playSound(); closeWatchModal()">&times;</button>
                <div class="watch-cinema-layout">
                    <div class="crunchy-hero-section">
                        <img src="${anime.poster}" class="crunchy-hero-poster" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'">
                        <div class="crunchy-hero-info">
                            <span style="font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;">Просмотр</span>
                            <h1>${anime.title}</h1>
                            <p style="color:var(--text-muted); font-size:11px; line-height:1.4;">${anime.desc || ''}</p>
                            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:2px;">
                                <span style="color:#fbbf24; font-weight:700; font-size:11px;">⭐ ${shikiRating} Shikimori</span>
                                <span style="background:var(--bg-input); padding:2px 6px; border-radius:5px; font-size:10px; border:1px solid var(--border);">${(anime.genres||[]).join(', ')}</span>
                                <span style="background:var(--bg-input); padding:2px 6px; border-radius:5px; font-size:10px; border:1px solid var(--border);">${anime.year || '2026'}</span>
                                <button class="btn-secondary" style="padding:3px 8px; font-size:10px;" onclick="playSound(); toggleFavorite('${anime.id}', 'Любимые')">⭐ ${userFavCategory ? 'В избранном' : 'В избранное'}</button>
                                <button class="btn-glow-secondary" style="padding:3px 8px; font-size:10px;" onclick="playSound(); createWatchPartyFromAnime('${anime.id}')">🎉 Party</button>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:6px 10px; border-radius:8px;">
                        <span style="font-size:11px; color:var(--text-muted);">Статус:</span>
                        ${['Просмотрено', 'В планах', 'Смотрю', 'Отложено', 'Брошено'].map(st => `
                            <button class="season-tab-btn ${myCurrentStatus === st ? 'active' : ''}" onclick="playSound(); setAnimeStatus('${anime.id}', '${st}')">${st}</button>
                        `).join('')}
                    </div>

                    ${Object.keys(customFolders).length > 0 ? `
                        <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:6px 10px; border-radius:8px;">
                            <span style="font-size:11px; color:var(--text-muted);">Папки:</span>
                            ${Object.keys(customFolders).map(fname => {
                                const inFolder = (customFolders[fname] || []).includes(anime.id);
                                return `<button class="season-tab-btn ${inFolder ? 'active' : ''}" onclick="playSound(); addToCustomFolder('${anime.id}', '${fname}')">📁 ${fname} ${inFolder ? '✓' : ''}</button>`;
                            }).join('')}
                        </div>
                    ` : ''}

                    <div class="players-switcher-bar">
                        <span style="font-size:11px; color:var(--text-muted); font-weight:700;">Плеер:</span>
                        ${sourceNames.map(srcName => `
                            <button class="player-switch-btn ${srcName === activePlayerSource ? 'active' : ''}" onclick="playSound(); changePlayerSource('${anime.id}', ${activeSeason}, ${selectedEpIdx}, '${srcName}')">
                                🎬 ${srcName}
                            </button>
                        `).join('')}
                    </div>

                    <div class="player-wrapper">
                        ${playerHtml}
                    </div>

                    <div class="anime-screenshots-section">
                        <h3 style="font-size:11px; color:var(--text-main); margin-bottom:4px;">🖼️ Кадры</h3>
                        <div class="screenshots-grid">
                            ${screenshots.map(sc => `<img src="${sc}" class="screenshot-thumb" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'" onclick="playSound(); window.open('${sc}', '_blank')">`).join('')}
                        </div>
                    </div>

                    <div class="crunchy-episodes-section">
                        <div class="season-tabs">
                            ${seasonNumbers.map(s => `
                                <button class="season-tab-btn ${s === activeSeason ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${s}, 0)">
                                    Сезон ${s}
                                </button>
                            `).join('')}
                        </div>

                        <h3 style="font-size:12px; font-weight:700; margin-bottom:8px;">Эпизоды (${currentSeasonEpisodes.length})</h3>
                        <div class="episodes-grid-crunchy">
                            ${currentSeasonEpisodes.map((ep, i) => `
                                <div class="ep-crunchy-card ${i === (selectedEpIdx || 0) ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${i})">
                                    <div class="ep-crunchy-thumb" style="background-image: url('${anime.poster}'); background-size: cover; background-position: center;">
                                        <div class="ep-crunchy-play-overlay">
                                            <div class="ep-crunchy-play-icon">▶</div>
                                        </div>
                                    </div>
                                    <div class="ep-crunchy-info">
                                        <div class="ep-crunchy-titles">
                                            <div class="ep-crunchy-title">${ep.title || ('Эпизод ' + (i+1))}</div>
                                            <div class="ep-crunchy-desc">Эпизод ${i+1}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('watchModal').classList.add('active');
        }

        function saveProgress(animeId, video) {
            if (!currentUser) return;
            const key = `${currentUser.username}_${animeId}`;
            userWatchHistory[key] = video.currentTime;
            saveData();
        }

        loadDataFromCloud();
    </script>
</body>
</html>
