<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komi Anime Hub — Netflix Style</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234788FF'/><text x='50% ' y='55%' font-size='60' font-weight='800' fill='white' font-family='sans-serif' dominant-baseline='middle' text-anchor='middle'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #0B0D12;
            --bg-card: #151821;
            --bg-input: #252A36;
            --primary: #4788FF;
            --primary-hover: #3570e6;
            --accent: #8cb4ff;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #2A303F;
            --glow: rgba(71, 136, 255, 0.35);
        }

        /* Тонкий скроллбар */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-hover); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        header {
            background: rgba(11, 13, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 30px;
            gap: 15px;
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-box {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px; color: white;
        }
        .logo-text {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .online-counter {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399; padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .online-dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; box-shadow: 0 0 6px #34d399; }

        .search-container { position: relative; flex: 0 1 300px; }
        .search-bar input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 14px 10px 38px; color: white; font-size: 13px; outline: none;
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--glow); }
        .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); fill: var(--text-muted); width: 16px; height: 16px; }

        .search-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 10px; margin-top: 4px; display: none; z-index: 200;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); max-height: 220px; overflow-y: auto;
        }
        .search-dropdown.active { display: block; animation: fadeInUp 0.2s ease; }
        .search-dropdown-item { padding: 8px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .search-dropdown-item:hover { background: var(--primary); color: white; }

        .nav-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 8px;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: var(--primary); border-color: var(--accent); }

        .action-icon-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: white;
            padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .action-icon-btn:hover { border-color: var(--primary); background: var(--bg-input); }

        .user-pill {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .user-avatar-small { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        .app-layout {
            display: grid; grid-template-columns: 1fr 280px; gap: 20px;
            max-width: 1550px; margin: 0 auto; padding: 25px 30px; flex: 1; width: 100%;
        }

        .right-sidebar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 16px; height: fit-content; position: sticky; top: 80px; display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar-section h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .sidebar-users-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
        .sidebar-user-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 6px 10px;
            border-radius: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .sidebar-user-item:hover { border-color: var(--primary); transform: translateX(3px); }
        .sidebar-user-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }

        main { width: 100%; animation: fadeInUp 0.3s ease; }

        /* Главный баннер */
        .hero-banner {
            border-radius: 20px; overflow: hidden; background-size: cover; background-position: center;
            border: 1px solid var(--border); padding: 40px; display: flex; flex-direction: column;
            justify-content: center; min-height: 380px; margin-bottom: 30px; position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .hero-banner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(11,13,18,0.95) 40%, rgba(11,13,18,0.6) 75%, transparent 100%),
                        radial-gradient(circle at top right, rgba(71, 136, 255, 0.2), transparent 50%);
            z-index: 1;
        }
        .hero-banner > * { position: relative; z-index: 2; }
        .hero-banner h1 {
            font-size: 38px; font-weight: 800; max-width: 600px; margin-bottom: 12px; line-height: 1.15;
            background: linear-gradient(to right, #FFFFFF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-banner p { color: var(--text-muted); font-size: 14px; max-width: 500px; margin-bottom: 20px; line-height: 1.4; }
        .hero-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; flex-wrap: wrap; }
        .hero-meta span { background: rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 6px; color: white; border: 1px solid var(--border); }

        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 10px 22px; border-radius: 10px;
            font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px var(--glow);
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 30px; }
        .section-title { font-size: 20px; font-weight: 700; }

        /* Карточки аниме (стиль Netflix) */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
        .anime-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
            cursor: pointer; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex; flex-direction: column; position: relative;
        }
        .anime-card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--primary); box-shadow: 0 12px 30px var(--glow); }
        .anime-rating-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--border);
            color: #fbbf24; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; z-index: 2; backdrop-filter: blur(4px);
        }
        .anime-poster { width: 100%; height: 300px; object-fit: cover; background: var(--bg-input); transition: transform 0.4s ease; }
        .anime-card:hover .anime-poster { transform: scale(1.05); }
        .anime-info { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; background: var(--bg-card); z-index: 2; }
        .anime-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .anime-meta-card { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 14px; border: 1px dashed var(--border); }

        /* Профиль */
        .profile-container { max-width: 1200px; margin: 0 auto; width: 100%; animation: fadeInUp 0.3s ease; }
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 22px;
            display: grid; grid-template-columns: 180px 1fr; gap: 24px; margin-bottom: 20px;
        }
        .profile-avatar-box { width: 180px; height: 230px; border-radius: 12px; object-fit: cover; border: 2px solid var(--primary); background: var(--bg-input); }
        .profile-info-grid { display: flex; flex-direction: column; gap: 10px; }
        .profile-name-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .profile-name-row h2 { font-size: 22px; font-weight: 800; color: var(--accent); }
        
        .profile-stats-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            display: flex; overflow: hidden; margin-bottom: 20px;
        }
        .profile-stat-tab {
            flex: 1; padding: 12px 8px; text-align: center; cursor: pointer; border-right: 1px solid var(--border);
            background: var(--bg-card); font-size: 12px; font-weight: 700; color: var(--text-muted); display: flex; flex-direction: column; gap: 3px;
        }
        .profile-stat-tab:last-child { border-right: none; }
        .profile-stat-tab:hover { background: var(--bg-input); color: white; }
        .profile-stat-tab.active { background: var(--primary); color: white; }
        .profile-stat-tab .num { font-size: 15px; font-weight: 800; }

        .profile-layout-grid { display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
        .profile-main-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
        .profile-sidebar-menu { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
        .profile-menu-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: white;
        }
        .profile-menu-item:hover { border-color: var(--primary); }

        .profile-anime-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .profile-anime-table th, .profile-anime-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
        .profile-anime-table th { color: var(--text-muted); font-weight: 600; }
        .profile-anime-table tr:hover { background: rgba(255,255,255,0.02); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #0D0F16; border: 1px solid var(--border); border-radius: 20px;
            width: 95%; max-width: 1280px; padding: 24px; max-height: 94vh; overflow-y: auto;
            position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.9); animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.06);
            border: 1px solid var(--border); color: white; width: 34px; height: 34px; border-radius: 50%;
            cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .modal-close:hover { background: rgba(255,255,255,0.12); border-color: var(--primary); transform: rotate(90deg); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: white; font-size: 13px; outline: none; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--glow); }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .btn-secondary { background: var(--bg-input); color: white; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-secondary:hover { background: var(--border); border-color: var(--primary); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        .catalog-filters-box {
            background: var(--bg-card); border: 1px solid var(--border); padding: 16px; border-radius: 14px;
            margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
        }

        /* Улучшенное окно просмотра в стиле Netflix */
        .watch-cinema-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
        .watch-cinema-layout.theater { grid-template-columns: 1fr; }
        .watch-cinema-layout.theater .watch-sidebar { display: none; }
        .watch-main-col { display: flex; flex-direction: column; gap: 14px; }
        
        .player-wrapper { position: relative; width: 100%; }
        .player-box { background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        
        .skip-intro-btn {
            position: absolute; bottom: 20px; right: 20px; background: rgba(11, 13, 18, 0.85); backdrop-filter: blur(8px);
            border: 1px solid var(--border); color: white; padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; z-index: 20; display: none;
        }
        .skip-intro-btn:hover { background: var(--primary); border-color: var(--primary); }

        /* Горизонтальная прокручиваемая галерея кадров */
        .screenshots-scroll-container {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin;
        }
        .screenshot-thumb-item {
            flex: 0 0 160px; height: 95px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .screenshot-thumb-item:hover { transform: scale(1.04); border-color: var(--primary); box-shadow: 0 0 12px var(--glow); }

        .watch-sidebar { background: #151821; border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        
        /* Список эпизодов и компактные кнопки */
        .episodes-list-grid { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding-right: 4px; }
        .ep-card-side {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px;
            color: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600;
        }
        .ep-card-side:hover, .ep-card-side.active { background: var(--primary); border-color: var(--accent); color: white; }

        .comments-section { background: rgba(255,255,255,0.01); border: 1px solid var(--border); padding: 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
        .comment-author { font-weight: 700; font-size: 12px; color: var(--accent); cursor: pointer; }
        .comment-reactions { display: flex; gap: 5px; margin-top: 3px; }
        .reaction-btn { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; color: white; display: flex; align-items: center; gap: 3px; }
        .reaction-btn:hover { border-color: var(--primary); }
        .reaction-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .spoiler-text { background: #1a1e29; color: #1a1e29; border-radius: 4px; cursor: pointer; padding: 2px 4px; user-select: none; }
        .spoiler-text.revealed { background: #252a36; color: #fff; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        .admin-table th { color: var(--text-muted); font-weight: 600; }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; padding: 15px; }
            .right-sidebar { position: static; margin-top: 15px; }
            .watch-cinema-layout { grid-template-columns: 1fr; }
            .profile-header-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
            .profile-layout-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            header { padding: 10px 14px; flex-direction: column; align-items: stretch; gap: 8px; }
            .logo-area { justify-content: space-between; }
            .search-container { flex: 1; max-width: 100%; }
            .nav-actions { justify-content: center; }
            .hero-banner { padding: 20px; min-height: 280px; }
            .hero-banner h1 { font-size: 24px; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .anime-poster { height: 220px; }
            .modal-content { padding: 14px 10px; width: 100%; max-height: 96vh; border-radius: 14px; }
        }
    </style>
</head>
<body class="theme-default">

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-container" onclick="navigate('home')">
                <div class="logo-box">K</div>
                <div class="logo-text">Komi Anime</div>
            </div>
            <div class="online-counter">
                <div class="online-dot"></div>
                <span id="onlineCountText">Онлайн: 1</span>
            </div>
        </div>
        
        <div class="search-container">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Поиск аниме..." oninput="handleSearchInput(this.value)" onfocus="showSearchDropdown()">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <div class="nav-actions">
            <button class="nav-btn" id="navHomeBtn" onclick="navigate('home')">Главная</button>
            <button class="nav-btn" id="navCatalogBtn" onclick="navigate('catalog')">Каталог</button>
            <button class="action-icon-btn" onclick="randomAnime()">🎲 Мне повезет</button>
            
            <button class="action-icon-btn" id="adminPanelBtn" onclick="openAdminPanel()" style="background: var(--primary); border-color: var(--primary); display: none;">⚙️ Админка</button>
            <button class="action-icon-btn" id="addAnimeBtn" onclick="openAddModal()" style="background: var(--primary); border-color: var(--primary); display: none;">+ Добавить</button>

            <div id="userHeaderArea"></div>
        </div>
    </header>

    <div class="app-layout">
        <main id="mainContainer"></main>
        
        <aside class="right-sidebar">
            <div class="sidebar-section">
                <h3>👥 Мои друзья</h3>
                <div class="sidebar-users-list" id="sidebarFriendsList">
                    <span style="color:var(--text-muted); font-size:11px;">Войдите, чтобы видеть друзей</span>
                </div>
            </div>
            <div class="sidebar-section" style="border-top: 1px solid var(--border); padding-top: 12px;">
                <h3>🟢 На сайте онлайн</h3>
                <div class="sidebar-users-list" id="sidebarOnlineList">
                    <span style="color:var(--text-muted); font-size:11px;">Загрузка...</span>
                </div>
            </div>

                    { season: 1, title: 'Эпизод 2', duration: '24:00', voices: 'AnimeVost', quality: '1080p', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' },

                ],

        ];

        let animeList = [];

        let userFriends = JSON.parse(localStorage.getItem('komi_friends')) || {};

        let searchHistory = JSON.parse(localStorage.getItem('komi_search_history')) || ['Спорт', 'Экшен'];
        let siteStats = JSON.parse(localStorage.getItem('komi_stats')) || { visits: 1420, views: 8900 };

        let currentView = 'home';
        let profileTargetUser = null;
        let profileActiveTab = 'Смотрю';

        let catalogFilterYear = 'Все';
        let catalogFilterType = 'Все';
        let catalogSort = 'popular';
        const mySessionId = 'user_' + Math.random().toString(36).substring(2, 9);
        let onlineTimerRunning = false;

        function saveData() {
            localStorage.setItem('komi_current_user', JSON.stringify(currentUser));
            localStorage.setItem('komi_users_db', JSON.stringify(registeredUsers));
            localStorage.setItem('komi_profiles', JSON.stringify(userProfiles));
            localStorage.setItem('komi_favorites', JSON.stringify(userFavorites));
            localStorage.setItem('komi_history', JSON.stringify(userWatchHistory));
            localStorage.setItem('komi_search_history', JSON.stringify(searchHistory));
            localStorage.setItem('komi_stats', JSON.stringify(siteStats));
            localStorage.setItem('komi_friends', JSON.stringify(userFriends));
            localStorage.setItem('komi_friend_requests', JSON.stringify(friendRequests));
            localStorage.setItem('komi_anime_statuses', JSON.stringify(userAnimeStatuses));
            saveStatusesToCloud();
        }

        async function loadDataFromCloud() {
            try {
                const { data } = await _supabase.from('animes').select('*');
                if (data && data.length > 0) {
                    for(let row of data) {
                        if (row.id === 1) animeList = JSON.parse(row.content || '[]');
                        if (row.id === 2) animeComments = JSON.parse(row.content || '{}');
                        if (row.id === 3) {
                            const cloudStatuses = JSON.parse(row.content || '{}');
                            userAnimeStatuses = { ...userAnimeStatuses, ...cloudStatuses };
                        }
                    }
                }
                if (animeList.length === 0) {
                    animeList = defaultAnime;
                    await _supabase.from('animes').upsert({ id: 1, content: JSON.stringify(animeList) });
                }
            } catch(err) {
                animeList = defaultAnime;
            }
            render();
        }

        async function saveAnimeToCloud() {
            await _supabase.from('animes').upsert({ id: 1, content: JSON.stringify(animeList) });
            render();
        }

        async function saveCommentsToCloud() {
            await _supabase.from('animes').upsert({ id: 2, content: JSON.stringify(animeComments) });
        }

        async function saveStatusesToCloud() {
            try {
                await _supabase.from('animes').upsert({ id: 3, content: JSON.stringify(userAnimeStatuses) });
            } catch(e) {}
        }

        async function updateOnlinePresence() {
            if (onlineTimerRunning) return;
            onlineTimerRunning = true;
            try {
                const now = Date.now();
                const userNameGuest = currentUser ? currentUser.username : ('Гость_' + mySessionId.slice(0,4));
                await _supabase.from('online_users').upsert({ session_id: mySessionId, username: userNameGuest, last_seen: now });
                const expireTime = now - 20000;
                await _supabase.from('online_users').delete().lt('last_seen', expireTime);

                const { data } = await _supabase.from('online_users').select('*');
                if (data) {
                    const count = data.length || 1;
                    const el = document.getElementById('onlineCountText');
                    if (el) el.innerText = `Онлайн: ${count}`;
                    renderSidebarLists(data);
                }
            } catch(e) {
                const el = document.getElementById('onlineCountText');
                if (el) el.innerText = `Онлайн: 1`;
                renderSidebarLists([{ username: currentUser ? currentUser.username : 'Гость' }]);
            }
            setTimeout(() => { onlineTimerRunning = false; }, 6000);
        }
        setInterval(updateOnlinePresence, 6000);
        updateOnlinePresence();

        function renderSidebarLists(onlineRows) {
            const onlineContainer = document.getElementById('sidebarOnlineList');
            const friendsContainer = document.getElementById('sidebarFriendsList');

            if (onlineRows && onlineRows.length > 0) {
                onlineContainer.innerHTML = onlineRows.map(u => {
                    const p = userProfiles[u.username] || {};
                    const avatar = p.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop';

                        <div class="sidebar-user-item" onclick="openProfile('${u.username}')">

                            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${u.username}</span>
                        </div>
                    `;
                }).join('');

                onlineContainer.innerHTML = `<span style="color:var(--text-muted); font-size:11px;">Никого нет онлайн</span>`;

                    friendsContainer.innerHTML = myFriends.map(f => {

            } else {

            }
        }

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function navigate(view) {
            currentView = view;
            render();
            renderHeaderUser();
        }

        function openProfile(username) {
            currentView = 'profile';
            profileTargetUser = username;
            render();
            renderHeaderUser();
        }

            const area = document.getElementById('userHeaderArea');
            const adminBtn = document.getElementById('adminPanelBtn');

            const isAdmin = currentUser && currentUser.username.toLowerCase() === 'admin';

            saveData();
            navigate('home');

        function render() {
            renderHeaderUser();
            const container = document.getElementById('mainContainer');
            
            if (currentView === 'home') {
                const featured = animeList.length > 0 ? animeList[0] : null;
                const recommended = animeList.slice(0, 4);

                container.innerHTML = `
                    ${featured ? `

                        <button class="btn-primary" onclick="openWatchModal('${featured.id}')">
                            ▶ Смотреть сейчас
                        </button>
                    </div>
                    ` : ''}

                    <div class="section-header"><h2 class="section-title">✨ Рекомендуем посмотреть</h2></div>
                    <div class="anime-grid">
                        ${recommended.length === 0 ? `<div class="empty-state"><h3>Нет доступных аниме</h3></div>` : recommended.map(a => renderCard(a)).join('')}

            } else if (currentView === 'catalog') {
                const genres = ['Все', ...availableGenresList];
                const years = ['Все', '2026', '2025', '2024', '2022'];

                let filtered = animeList.filter(a => {
                    const gList = a.genres || [a.genre];

                    if (catalogFilterYear !== 'Все' && a.year !== catalogFilterYear) return false;
                    if (catalogFilterType !== 'Все' && a.type !== catalogFilterType) return false;
                    return true;
                });

                if (catalogSort === 'rating') filtered.sort((a,b) => calculateAverageRating(b) - calculateAverageRating(a));

        function renderProfileView(container) {

                                ${!isMe && currentUser ? `
                                    ${amIFriend ? `<button class="btn-danger" style="padding:5px 10px; font-size:11px;" onclick="removeFriend('${username}')">Удалить из друзей</button>` :

        function renderCard(anime) {
            const avg = calculateAverageRating(anime);
            const gText = (anime.genres || [anime.genre || '']).join(', ');
            return `
                <div class="anime-card" onclick="openWatchModal('${anime.id}')">
                    <div class="anime-rating-badge">⭐ ${avg}</div>
                    <img src="${anime.poster}" class="anime-poster" onerror="this.src='https://images.unsplash.com/photo-1518609878373-06d740f60d8b?q=80&w=600&auto=format&fit=crop'">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-meta-card"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;">${gText}</span><span>${anime.episodes.length} сер.</span></div>
                    </div>
                </div>
            `;
        }

        function calculateAverageRating(anime) {
            if (!anime.ratings || Object.keys(anime.ratings).length === 0) return '8.5';
            const values = Object.values(anime.ratings);
            return (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1);
        }

        async function autoFillFromAPI() {
            const query = document.getElementById('apiSearchTitle').value.trim();
            if (!query) { alert('Введите название для поиска!'); return; }
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=1`);
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    const anime = data.data[0];
                    document.getElementById('animeTitle').value = anime.title || '';
                    document.getElementById('animePoster').value = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
                    document.getElementById('animeYear').value = anime.year || '2026';
                    document.getElementById('animeType').value = anime.type || 'Сериал';
                    document.getElementById('animeDesc').value = anime.synopsis || '';
                    alert('Данные загружены!');
                } else {
                    alert('Ничего не найдено.');
                }
            } catch(e) {
                alert('Ошибка при запросе к API.');
            }
        }

        async function saveAnimeForm(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnimeId').value;
            const title = document.getElementById('animeTitle').value;
            const poster = document.getElementById('animePoster').value;
            const year = document.getElementById('animeYear').value || '2026';
            const type = document.getElementById('animeType').value || 'Сериал';
            const desc = document.getElementById('animeDesc').value;

            const selectedGenres = [];
            document.querySelectorAll('.genre-checkbox:checked').forEach(cb => selectedGenres.push(cb.value));
            const genres = selectedGenres.length > 0 ? selectedGenres : ['Спорт'];

            const episodes = [];
            const seasonsInputs = document.querySelectorAll('.ep-season');
            const titles = document.querySelectorAll('.ep-title');
            const voicesInputs = document.querySelectorAll('.ep-voices');
            const qualities = document.querySelectorAll('.ep-quality');
            const urls = document.querySelectorAll('.ep-url');
            
            for(let i=0; i<titles.length; i++) {
                episodes.push({ 
                    season: parseInt(seasonsInputs[i].value) || 1, 
                    title: titles[i].value, 
                    voices: voicesInputs[i].value,
                    quality: qualities[i].value,
                    url: urls[i].value,
                    duration: '24:00'
                });
            }

            if (editId) {
                const anime = animeList.find(a => a.id === editId);
                if (anime) Object.assign(anime, { title, poster, genres, genre: genres[0], year, type, desc, episodes });
            } else {
                animeList.push({ id: 'anime_' + Date.now(), title, poster, genres, genre: genres[0], year, type, desc, episodes, ratings: {}, screenshots: [poster, poster, poster, poster] });
            }

            await saveAnimeToCloud();
            closeAddModal();
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const passwordInput = document.getElementById('authPassword').value;
            if (!username || !passwordInput) return;

            const passwordHash = await hashPassword(passwordInput);

            if (registeredUsers[username]) {
                if (registeredUsers[username] === passwordHash) {
                    currentUser = { username };
                    saveData();
                    closeAuthModal();
                    render();
                } else {
                    alert('Неверный пароль!');
                }
            } else {
                registeredUsers[username] = passwordHash;
                currentUser = { username };
                if (!userProfiles[username]) {
                    userProfiles[username] = { avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop', status: 'Новичок ⭐' };
                }
                saveData();
                closeAuthModal();
                render();
            }
        }

        function toggleFavorite(id, category) {
            if (!currentUser) { openAuthModal(); return; }
            if (!userFavorites[currentUser.username]) userFavorites[currentUser.username] = {};
            if (userFavorites[currentUser.username][id] === category) {
                delete userFavorites[currentUser.username][id];
            } else {
                userFavorites[currentUser.username][id] = category;
            }
            saveData();
            openWatchModal(id);
        }

        function setAnimeStatus(animeId, status) {
            if (!currentUser) { openAuthModal(); return; }
            if (!userAnimeStatuses[currentUser.username]) userAnimeStatuses[currentUser.username] = {};
            if (userAnimeStatuses[currentUser.username][animeId] === status) {
                delete userAnimeStatuses[currentUser.username][animeId];
            } else {
                userAnimeStatuses[currentUser.username][animeId] = status;
            }
            saveData();
            openWatchModal(animeId);
        }

        function sendFriendRequest(targetUsername) {
            if (!currentUser) { openAuthModal(); return; }
            if (currentUser.username === targetUsername) return;

            if (!friendRequests[targetUsername]) friendRequests[targetUsername] = [];
            if (!friendRequests[targetUsername].includes(currentUser.username)) {
                friendRequests[targetUsername].push(currentUser.username);
                saveData();
                alert('Заявка отправлена!');
            }
            openProfile(targetUsername);
        }

        function acceptFriendRequest(senderUsername) {
            if (!currentUser) return;
            const myName = currentUser.username;
            if (friendRequests[myName]) {
                friendRequests[myName] = friendRequests[myName].filter(u => u !== senderUsername);
            }
            if (!userFriends[myName]) userFriends[myName] = [];
            if (!userFriends[myName].includes(senderUsername)) userFriends[myName].push(senderUsername);

            if (!userFriends[senderUsername]) userFriends[senderUsername] = [];
            if (!userFriends[senderUsername].includes(myName)) userFriends[senderUsername].push(myName);

            saveData();
            openProfile(myName);
        }

        function removeFriend(friendUsername) {
            if (!currentUser) return;
            const myName = currentUser.username;
            if (userFriends[myName]) userFriends[myName] = userFriends[myName].filter(u => u !== friendUsername);
            if (userFriends[friendUsername]) userFriends[friendUsername] = userFriends[friendUsername].filter(u => u !== myName);
            saveData();
            openProfile(friendUsername);
        }

                                <div style="display:flex; gap:8px;">
                                    <input type="text" id="commentInput" class="form-control" placeholder="Ваш комментарий...">
                                    <button class="btn-primary" onclick="addComment('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')">Отправить</button>
                                </div>
                                <label style="font-size:11px; color:var(--text-muted); cursor:pointer;"><input type="checkbox" id="isSpoiler"> Спойлер</label>
                            </div>
                            <div id="commentsListContainer" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                                ${comments.map((c, cIdx) => `
                                    <div class="comment-item">
                                        <div class="comment-author" onclick="openProfile('${c.username}')">👤 ${c.username}</div>
                                        <div class="comment-text" style="font-size:12px;">${c.spoiler ? `<span class="spoiler-text" onclick="this.classList.toggle('revealed')">⚠️ Спойлер <span style="color:transparent">${c.text}</span></span>` : c.text}</div>
                                        <div class="comment-reactions">
                                            ${['🔥', '❤️', '😂'].map(emoji => {
                                                const count = (c.reactions && c.reactions[emoji]) ? c.reactions[emoji].length : 0;
                                                return `<button class="reaction-btn" onclick="reactComment('${anime.id}', ${cIdx}, '${emoji}')"><span>${emoji}</span> <span>${count}</span></button>`;
                                            }).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Компактная боковая панель серий -->
                    <div class="watch-sidebar">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="font-size:14px;">Сезоны</h3>
                            <select class="form-control" style="width:110px; padding:4px; font-size:11px;" onchange="openWatchModal('${anime.id}', parseInt(this.value), 0, '${activeVoice}', '${activeQuality}')">
                                ${seasonNumbers.map(s => `<option value="${s}" ${s===activeSeason?'selected':''}>Сезон ${s}</option>`).join('')}
                            </select>
                        </div>

                        <!-- Поиск по номеру эпизода -->
                        <input type="text" class="form-control" style="font-size:11px; padding:6px;" placeholder="Поиск эпизода..." oninput="filterSidebarEpisodes(this.value)">

                        <h3 style="font-size:13px; margin-top:4px;">Эпизоды (${finalEpList.length})</h3>
                        <div class="episodes-list-grid" id="sidebarEpisodesListContainer">
                            ${finalEpList.map((ep, i) => {
                                const isWatched = currentUser && userAnimeStatuses[currentUser.username] && userAnimeStatuses[currentUser.username][`${anime.id}_ep_${activeSeason}_${i}`];
                                return `
                                    <div class="ep-card-side ${i === (selectedEpIdx || 0) ? 'active' : ''}" onclick="openWatchModal('${anime.id}', ${activeSeason}, ${i}, '${activeVoice}', '${activeQuality}')" title="${ep.title} (${ep.duration})">
                                        <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
                                            <input type="checkbox" ${isWatched ? 'checked' : ''} onclick="event.stopPropagation(); toggleEpisodeWatched('${anime.id}', ${activeSeason}, ${i})" style="cursor:pointer;">
                                            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ep.title || ('Эпизод ' + (i+1))}</span>
                                        </div>
                                        <span style="font-size:10px; opacity:0.7;">${ep.duration || '24:00'}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('watchModal').classList.add('active');

            const v = document.getElementById('animeVideoPlayer');
            if (v && savedTime > 0) {
                v.currentTime = savedTime;
                v.play().catch(() => {});
            }
        }

        function filterSidebarEpisodes(query) {
            const container = document.getElementById('sidebarEpisodesListContainer');
            if (!container) return;
            const cards = container.getElementsByClassName('ep-card-side');
            for (let card of cards) {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query.toLowerCase()) ? 'flex' : 'none';
            }
        }

        function toggleEpisodeWatched(animeId, season, epIdx) {
            if (!currentUser) { openAuthModal(); return; }
            const key = `${currentUser.username}_${animeId}_ep_${season}_${epIdx}`;
            if (!userAnimeStatuses[currentUser.username]) userAnimeStatuses[currentUser.username] = {};
            if (userAnimeStatuses[currentUser.username][key]) {
                delete userAnimeStatuses[currentUser.username][key];
            } else {
                userAnimeStatuses[currentUser.username][key] = true;
            }
            saveData();
        }

        function changePlaybackRate(rate) {
            currentPlaybackRate = parseFloat(rate);
            const v = document.getElementById('animeVideoPlayer');
            if (v) v.playbackRate = currentPlaybackRate;
        }

        function toggleTheaterMode(id, season, epIdx, voice, quality) {
            isTheaterMode = !isTheaterMode;
            openWatchModal(id, season, epIdx, voice, quality);
        }

        function skipIntro() {
            const v = document.getElementById('animeVideoPlayer');
            if (v) v.currentTime += 85;
        }

        function saveProgress(id, video) {
            if (!currentUser) return;
            const key = `${currentUser.username}_${id}`;
            userWatchHistory[key] = video.currentTime;
            saveData();
        }

        function playNextEp(id, season, currentIdx, voice, quality) {
            openWatchModal(id, season, currentIdx + 1, voice, quality);
        }

        async function addComment(id, season, epIdx, voice, quality) {
            if (!currentUser) { openAuthModal(); return; }
            const text = document.getElementById('commentInput').value.trim();
            const spoiler = document.getElementById('isSpoiler').checked;
            if (!text) return;
            
            if (!animeComments[id]) animeComments[id] = [];
            animeComments[id].unshift({ username: currentUser.username, text, spoiler, reactions: {} });
            
            await saveCommentsToCloud();
            openWatchModal(id, season, epIdx, voice, quality);
        }

        async function reactComment(id, cIdx, emoji) {
            if (!currentUser) { openAuthModal(); return; }
            const username = currentUser.username;
            if (!animeComments[id] || !animeComments[id][cIdx]) return;

            const comment = animeComments[id][cIdx];
            if (!comment.reactions) comment.reactions = {};
            if (!comment.reactions[emoji]) comment.reactions[emoji] = [];

            const userIndex = comment.reactions[emoji].indexOf(username);
            if (userIndex > -1) {
                comment.reactions[emoji].splice(userIndex, 1);
            } else {
                comment.reactions[emoji].push(username);
            }

            await saveCommentsToCloud();
            openWatchModal(id);
        }

        // Горячие клавиши для плеера (Пробел - пауза, Стрелки - перемотка)
        document.addEventListener('keydown', (e) => {
            const v = document.getElementById('animeVideoPlayer');
            if (!v) return;
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                v.paused ? v.play() : v.pause();
            } else if (e.code === 'ArrowRight') {
                v.currentTime += 10;
            } else if (e.code === 'ArrowLeft') {
                v.currentTime -= 10;
            }
        });

        loadDataFromCloud();
    </script>
</body>
</html>
