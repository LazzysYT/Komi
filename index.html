<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komi Anime Hub — каталог аниме, серии и списки просмотра</title>
    <meta name="description" content="Komi Anime Hub — каталог аниме с поиском, информацией о сериях, личными списками просмотра и сообществом.">
    <meta name="theme-color" content="#09090D">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="Komi Anime Hub">
    <meta property="og:title" content="Komi Anime Hub — каталог аниме">
    <meta property="og:description" content="Находи аниме, следи за сериями и веди свой список просмотра.">
    <meta property="og:url" content="https://komi-six.vercel.app/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://komi-six.vercel.app/">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FF454F'/><text x='50%' y='55%' font-size='60' font-weight='800' fill='white' font-family='sans-serif' dominant-baseline='middle' text-anchor='middle'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #09090D;
            --bg-card: #14141B;
            --bg-card-hover: #1C1C26;
            --bg-input: #1C1C26;
            --primary: #FF454F;
            --primary-hover: #E03E46;
            --accent: #FF454F;
            --text-main: #F5F5F7;
            --text-muted: #92929F;
            --border: #282832;
            --success: #36D399;
            --glow: rgba(255, 69, 79, 0.3);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-hover); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.6); opacity: 1; }
            100% { transform: translateY(-380px) scale(1.5); opacity: 0; }
        }

        /* Шапка сайта */
        header {
            background: rgba(9, 9, 13, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
        }

        .header-inner {
            max-width: 1400px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-area { display: flex; align-items: center; gap: 14px; }
        .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-box {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary), #FF737B);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; color: white;
            box-shadow: 0 0 16px var(--glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .logo-box:hover { transform: scale(1.06); box-shadow: 0 0 22px var(--glow); }
        .logo-text {
            font-size: 18px; font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, var(--text-muted));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.4px;
        }

        .online-counter {
            background: rgba(54, 211, 153, 0.08);
            border: 1px solid rgba(54, 211, 153, 0.25);
            color: var(--success); padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .online-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

        .search-container { position: relative; flex: 0 1 300px; }
        .search-bar input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 12px 8px 36px; color: white; font-size: 12px; outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--glow); }
        .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); fill: var(--text-muted); width: 14px; height: 14px; }

        .search-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 10px; margin-top: 6px; display: none; z-index: 200;
            box-shadow: 0 20px 40px rgba(0,0,0,0.85); max-height: 280px; overflow-y: auto;
        }
        .search-dropdown.active { display: block; animation: fadeInUp 0.15s ease; }
        .search-dropdown-item { padding: 9px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; transition: background 0.15s ease; }
        .search-dropdown-item:hover { background: var(--bg-card-hover); color: white; }

        .nav-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            font-weight: 600; font-size: 12px; cursor: pointer; padding: 6px 12px; border-radius: 8px;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.04); border-color: var(--border); }

        .action-icon-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; position: relative;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .action-icon-btn:hover { border-color: var(--text-muted); background: var(--bg-card-hover); }

        .notification-badge {
            position: absolute; top: -4px; right: -4px; background: var(--primary); color: white;
            font-size: 9px; font-weight: 800; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px var(--glow);
        }

        .notification-dropdown {
            position: absolute; top: 120%; right: 0; width: 300px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: none; flex-direction: column; z-index: 300; overflow: hidden;
        }
        .notification-dropdown.active { display: flex; animation: fadeInUp 0.15s ease; }
        .notif-header { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .notif-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; }
        .notif-item { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
        .notif-item:hover { background: var(--bg-card-hover); color: white; }

        .user-pill {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .user-pill:hover { border-color: var(--text-muted); }
        .user-avatar-small { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        /* Контейнер контента */
        .app-layout {
            max-width: 1400px; margin: 0 auto; padding: 28px 24px; flex: 1; width: 100%;
            display: flex; flex-direction: column; gap: 36px;
        }

        /* Баннер и блок друзей */
        .top-hero-section-grid {
            display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: stretch;
        }

        .hero-slider-container {
            position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7); background: var(--bg-card); height: 440px; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .hero-slide {
            display: none; background-size: cover; background-position: center; padding: 40px 48px;
            height: 100%; width: 100%; flex-direction: column; justify-content: center; position: absolute; inset: 0;
        }
        .hero-slide.active { display: flex; animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .hero-slide::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, #09090D 35%, rgba(9, 9, 13, 0.8) 65%, rgba(9, 9, 13, 0.3) 100%),
                        radial-gradient(circle at top right, rgba(255, 69, 79, 0.15), transparent 60%);
            z-index: 1;
        }
        .hero-slide > * { position: relative; z-index: 2; }
        .hero-slide h1 { font-size: 38px; font-weight: 800; max-width: 520px; margin-bottom: 10px; line-height: 1.1; color: #FFFFFF; letter-spacing: -0.5px; }
        .hero-slide p { color: var(--text-muted); font-size: 12px; max-width: 440px; margin-bottom: 20px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-meta { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; flex-wrap: wrap; }
        .hero-meta span { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 6px; color: var(--text-main); border: 1px solid var(--border); }
        .hero-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .btn-glow {
            background: var(--primary); color: white; border: none; padding: 9px 20px; border-radius: 10px;
            font-weight: 700; font-size: 12px; cursor: pointer; box-shadow: 0 4px 18px var(--glow);
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 22px var(--glow); }

        .btn-glow-secondary {
            background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 9px 20px; border-radius: 10px;
            font-weight: 700; font-size: 12px; cursor: pointer; backdrop-filter: blur(10px);
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
        }
        .btn-glow-secondary:hover { border-color: var(--text-muted); background: var(--bg-card-hover); transform: translateY(-1px); }

        .hero-slider-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20, 20, 27, 0.7);
            border: 1px solid var(--border); color: white; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 14px; backdrop-filter: blur(8px);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .hero-slider-arrow:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-50%) scale(1.05); }
        .hero-arrow-prev { left: 16px; }
        .hero-arrow-next { right: 16px; }
        
        .hero-dots { position: absolute; bottom: 16px; right: 36px; display: flex; gap: 5px; z-index: 10; }
        .hero-dot { width: 16px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: width 0.3s ease, background 0.3s ease; }
        .hero-dot.active { width: 36px; background: var(--primary); box-shadow: 0 0 10px var(--glow); }

        .friends-sidebar-panel {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .friends-sidebar-panel h3 { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-friends-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 2px; flex: 1; }
        .sidebar-friend-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 10px;
            border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px; font-weight: 600;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .sidebar-friend-item:hover { background: var(--bg-card-hover); border-color: var(--primary); transform: translateX(2px); }
        .sidebar-friend-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--primary); border: 1px solid var(--border); }

        main { width: 100%; display: flex; flex-direction: column; gap: 36px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .section-see-all { font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; background: transparent; border: none; transition: color 0.2s ease; }
        .section-see-all:hover { color: var(--primary); }

        /* Сетка карточек аниме (2:3) */
        .anime-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 16px; 
            width: 100%; 
        }
        @media (max-width: 1600px) { .anime-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 1350px) { .anime-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .anime-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 850px) { .anime-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 580px) { .anime-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        .anime-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex; flex-direction: column; position: relative; width: 100%;
        }
        .anime-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 12px 30px var(--glow); }
        
        .anime-rating-badge {
            position: absolute; top: 8px; left: 8px; background: rgba(9, 9, 13, 0.75); border: 1px solid var(--border);
            color: #fbbf24; padding: 3px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; z-index: 2; backdrop-filter: blur(6px);
        }
        
        .anime-poster-box { position: relative; width: 100%; aspect-ratio: 2 / 3; overflow: hidden; background: var(--bg-input); }
        .anime-poster { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .anime-card:hover .anime-poster { transform: scale(1.06); }
        
        .anime-quick-view {
            position: absolute; inset: 0; background: rgba(9, 9, 13, 0.6); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; z-index: 3;
        }
        .anime-card:hover .anime-quick-view { opacity: 1; }
        
        .anime-info { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; background: var(--bg-card); z-index: 2; }
        .anime-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .anime-meta-card { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 12px; border: 1px dashed var(--border); }

        /* Профиль */
        .profile-container { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 24px;
            display: grid; grid-template-columns: 150px 1fr; gap: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        .profile-header-card::after {
            content: ''; position: absolute; top: 0; right: 0; width: 180px; height: 180px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%); pointer-events: none; opacity: 0.6;
        }
        .profile-avatar-box {
            width: 150px; height: 190px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border); background: var(--bg-input);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .profile-avatar-box:hover { transform: scale(1.02); border-color: var(--primary); }
        .profile-info-grid { display: flex; flex-direction: column; gap: 10px; z-index: 2; }
        .profile-name-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .profile-name-row h2 { font-size: 22px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; letter-spacing: -0.4px; }
        
        .profile-badges-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .profile-badge-item {
            background: rgba(255, 69, 79, 0.08); border: 1px solid rgba(255, 69, 79, 0.2); color: var(--primary);
            padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px;
        }
        .profile-badge-level {
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); color: var(--text-main);
            padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
        }
        .profile-reg-date { color: var(--text-muted); font-size: 11px; font-weight: 500; opacity: 0.8; }

        .profile-settings-box {
            background: var(--bg-input); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 2px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .profile-settings-box h4 { font-size: 11px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }

        .profile-stats-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
        }
        @media(max-width: 1100px) { .profile-stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media(max-width: 700px) { .profile-stats-grid { grid-template-columns: repeat(2, 1fr); } }

        .profile-stat-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px;
            display: flex; flex-direction: column; gap: 5px; cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .profile-stat-card:hover { background: var(--bg-card-hover); border-color: var(--text-muted); transform: translateY(-2px); }
        .profile-stat-card.active {
            background: linear-gradient(135deg, rgba(255, 69, 79, 0.12), var(--bg-card));
            border-color: var(--primary); box-shadow: 0 6px 20px var(--glow);
        }
        .profile-stat-card .stat-icon { font-size: 16px; }
        .profile-stat-card .stat-num { font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.4px; }
        .profile-stat-card .stat-label { font-size: 10px; font-weight: 600; color: var(--text-muted); }
        .profile-stat-card.active .stat-label { color: var(--primary); }

        .profile-layout-grid { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }
        .profile-main-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .profile-sidebar-menu { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        
        .profile-menu-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: white;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .profile-menu-item:hover { border-color: var(--primary); background: var(--bg-card-hover); }

        .profile-wall-section { margin-top: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .wall-message-item { background: var(--bg-input); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 5px; }
        .wall-message-author { font-size: 11px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .wall-message-author img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
        .wall-message-text { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #0D0D12; border: 1px solid var(--border); border-radius: 16px;
            width: 95%; max-width: 1100px; padding: 22px; max-height: 90vh; overflow-y: auto;
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.9); animation: modalScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-close {
            position: absolute; top: 14px; right: 14px; background: var(--bg-card);
            border: 1px solid var(--border); color: white; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; z-index: 10;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .modal-close:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: white; font-size: 11px; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--glow); }
        textarea.form-control { resize: vertical; min-height: 70px; }

        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 11px; transition: background 0.15s ease, border-color 0.15s ease; }
        .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }
        .btn-danger { background: rgba(255, 69, 79, 0.08); color: #FF454F; border: 1px solid rgba(255, 69, 79, 0.2); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: background 0.15s ease; }
        .btn-danger:hover { background: rgba(255, 69, 79, 0.15); }

        .catalog-filters-box {
            background: var(--bg-card); border: 1px solid var(--border); padding: 14px; border-radius: 12px;
            margin-bottom: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;
        }

        .watch-cinema-layout { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        .crunchy-hero-section {
            display: flex; gap: 16px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 14px; padding: 18px; align-items: center;
        }
        .crunchy-hero-poster { width: 120px; height: 160px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
        .crunchy-hero-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .crunchy-hero-info h1 { font-size: 20px; font-weight: 800; color: white; }
        
        .party-room-grid { display: grid; grid-template-columns: 1fr 280px; gap: 14px; align-items: start; }
        .party-main-screen { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .party-video-container { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        .party-video-container video, .party-video-container iframe { width: 100%; height: 100%; border: none; object-fit: contain; }

        .flying-emoji-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
        .flying-emoji { position: absolute; bottom: 20px; font-size: 24px; animation: floatUp 2s ease-out forwards; }

        .party-sidebar-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; height: 400px; }
        .party-members-list { display: flex; flex-direction: column; gap: 5px; max-height: 100px; overflow-y: auto; }
        .party-member-badge { background: var(--bg-input); border: 1px solid var(--border); padding: 3px 6px; border-radius: 5px; font-size: 10px; display: flex; align-items: center; gap: 5px; font-weight: 600; }
        
        .party-chat-box { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; max-height: 150px; }
        .party-chat-msg { font-size: 10px; display: flex; flex-direction: column; gap: 2px; }
        .party-chat-author { font-weight: 700; color: var(--text-main); }

        .party-reactions-bar { display: flex; gap: 5px; justify-content: center; background: var(--bg-input); padding: 5px; border-radius: 6px; border: 1px solid var(--border); }
        .party-react-btn { background: transparent; border: none; font-size: 15px; cursor: pointer; padding: 2px 5px; border-radius: 5px; transition: transform 0.15s ease; }
        .party-react-btn:hover { background: var(--bg-card-hover); transform: scale(1.15); }

        .player-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .player-box { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.8); position: relative; }
        .player-box iframe, .player-box video { width: 100%; height: 100%; border: none; object-fit: contain; }

        .players-switcher-bar {
            display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
            background: var(--bg-card); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px;
        }
        .player-switch-btn {
            background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
            padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .player-switch-btn:hover { border-color: var(--text-muted); color: white; }
        .player-switch-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 8px var(--glow); }

        .anime-screenshots-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
        .screenshots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 5px; }
        .screenshot-thumb { width: 100%; height: 70px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; }
        .screenshot-thumb:hover { transform: scale(1.02); border-color: var(--text-muted); }

        .crunchy-episodes-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
        .season-tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
        .season-tab-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: color 0.15s ease, background 0.15s ease; }
        .season-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 8px var(--glow); }

        .episodes-grid-crunchy { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
        .ep-crunchy-card {
            background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
            cursor: pointer; display: flex; flex-direction: column; position: relative; transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .ep-crunchy-card:hover, .ep-crunchy-card.active { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 12px var(--glow); }
        .ep-crunchy-thumb { width: 100%; height: 95px; object-fit: cover; background: #000; position: relative; }
        .ep-crunchy-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
        .ep-crunchy-card:hover .ep-crunchy-play-overlay { opacity: 1; }
        .ep-crunchy-play-icon { width: 28px; height: 28px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; box-shadow: 0 0 8px var(--glow); }
        .ep-crunchy-info { padding: 6px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .ep-crunchy-titles { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .ep-crunchy-title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .ep-crunchy-desc { font-size: 10px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .admin-table th, .admin-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 11px; }
        .admin-table th { color: var(--text-muted); font-weight: 600; }

        @media (max-width: 1024px) {
            .top-hero-section-grid { grid-template-columns: 1fr; }

        /* KOMI OBSIDIAN — visual-only redesign based on the supplied reference.
           No JavaScript, catalog, Supabase, account, or player changes. */

/* KOMI DISCOVERY 2026 — calm, original red/black browsing layout */
:root {
    --bg-base:#07080b;
    --bg-card:#111216;
    --bg-card-hover:#1b1c23;
    --bg-input:#17181d;
    --border:#2a2b32;
    --text-muted:#aaaab5;
    --primary:#f03d50;
    --primary-hover:#ff5264;
}
body {
    background:radial-gradient(ellipse 75% 34% at 45% -8%,rgba(143,26,48,.16),transparent 76%),#07080b;
}
header {
    background:rgba(9,10,13,.84)!important;
    border-bottom:1px solid rgba(255,255,255,.06)!important;
    backdrop-filter:blur(22px) saturate(1.25)!important;
    -webkit-backdrop-filter:blur(22px) saturate(1.25);
    box-shadow:none!important;
}
.app-layout {
    max-width:1760px!important;
    padding-top:28px!important;
    padding-bottom:65px!important;
}
main#mainContainer {gap:30px}
button, select, input {font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible {
    outline:2px solid #f54d61!important;
    outline-offset:3px;
}
.section-header {align-items:center;gap:16px;flex-wrap:wrap}
.section-title {font-size:clamp(19px,1.5vw,24px)!important;letter-spacing:-.55px;line-height:1.25}
.section-see-all {font-size:12px;font-weight:700;color:#bdbdc4;padding:7px 0;white-space:nowrap}
.section-see-all:hover {color:#ff6475}
.top-hero-section-grid {display:block!important}
.hero-slider-container {
    height:clamp(320px,32vw,465px)!important;
    border-radius:28px!important;
    border:1px solid #333039!important;
    background:#101016;
    box-shadow:0 18px 55px #0007!important;
}
.hero-slide {
    padding:clamp(25px,4.5vw,72px)!important;
    background-size:cover;
    background-position:center 38%;
}
.hero-slide::before {
    background:linear-gradient(90deg,#07080c 0%,rgba(7,8,12,.95) 24%,rgba(7,8,12,.75) 49%,rgba(7,8,12,.2) 82%),
               linear-gradient(0deg,#07080c88,transparent 50%)!important;
}
.hero-slide h1 {max-width:680px!important;font-size:clamp(28px,3.25vw,53px)!important;line-height:1.08}
.hero-slide p {max-width:580px!important;font-size:13px!important;line-height:1.7!important;-webkit-line-clamp:3}
.hero-meta span {font-size:11px;border-radius:999px!important;background:#17171ab8!important}
.hero-buttons .btn-glow,.hero-buttons .btn-glow-secondary {min-height:42px;border-radius:13px;padding:11px 20px}
.hero-dot {height:5px!important;border-radius:999px!important}
.komi-spotlight-heading {display:flex;flex-wrap:wrap;justify-content:space-between;gap:15px;align-items:flex-end}
.komi-spotlight-eyebrow {text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:2.4px;color:#f26372}
.komi-spotlight-heading h1 {font-size:clamp(24px,2.5vw,34px);letter-spacing:-1px;margin-top:7px;font-weight:800}
.komi-spotlight-heading p {font-size:13px;line-height:1.55;color:#aaaab5;margin-top:8px;max-width:590px}
.komi-spotlight-metrics {display:flex;gap:8px;flex-wrap:wrap}
.komi-spotlight-metrics span {background:#151519;border:1px solid #303037;border-radius:15px;padding:9px 12px;color:#b6b6c1;font-size:11px}
.komi-spotlight-metrics strong {font-size:14px;color:#f4f4f8;padding-right:5px}
.komi-fastnav {display:flex;gap:9px;flex-wrap:wrap;padding:3px 0 0}
.komi-fastnav button,.komi-catalog-chip,.komi-catalog-clear {
    border:1px solid #303038;
    border-radius:12px;
    background:#17171b;
    color:#d7d7dd;
    padding:11px 16px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .2s,background .2s,transform .2s;
}
.komi-fastnav button:hover,.komi-catalog-chip:hover,.komi-catalog-clear:hover {
    background:#24191e;border-color:#a42f43;transform:translateY(-1px);
}
.komi-fastnav .is-prominent {background:#f03d50;color:white;border-color:#f03d50}
.komi-fastnav .is-prominent:hover {background:#d82d43;border-color:#d82d43}
.komi-feature-section {
    margin:0!important;
    padding:0!important;
    background:transparent!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
}
.komi-feature-section .section-header {margin-bottom:15px}
.komi-feature-section .section-title {font-size:clamp(19px,1.5vw,23px)!important}
.anime-grid {gap:17px!important}
.anime-card {
    background:#111216!important;
    border:1px solid #282a30!important;
    border-radius:19px!important;
    box-shadow:0 5px 22px rgba(0,0,0,.18)!important;
    contain:layout paint;
}
.anime-card:hover {
    border-color:#af3948!important;
    box-shadow:0 12px 30px rgba(0,0,0,.43),0 0 0 1px #b52d4352!important;
    transform:translateY(-3px);
}
.anime-card .anime-poster {transition:transform .28s ease}
.anime-card:hover .anime-poster {transform:scale(1.035)}
.anime-info {padding:13px 12px 14px!important;background:#111216!important}
.anime-title {font-size:12px!important;line-height:1.45!important}
.anime-meta-card {font-size:10px;gap:8px}
.komi-card-meta {display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 5px}
.komi-card-meta span {font-size:10px;padding:3px 7px;border-radius:7px;background:#1f2026;border:1px solid #2b2d34;color:#b7b8c1}
.komi-card-meta .komi-new-ep {color:#ff9ea8;border-color:#67303c;background:#301a22}
.anime-rating-badge {z-index:3}
.komi-release-row {border-radius:15px!important;background:#141418!important;border:1px solid #2d2b30!important;padding:14px!important;min-height:60px}
.komi-release-row:hover {border-color:#824152!important;background:#221a21!important}
.komi-release-list {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.komi-progress-grid {gap:12px}
.komi-progress-card {border-radius:17px!important;background:#151519!important;border:1px solid #303037!important}
.komi-catalog-header {display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.komi-catalog-header h1 {font-size:clamp(24px,2.5vw,34px);letter-spacing:-.9px}
.komi-catalog-header p {font-size:12px;color:#a6a6b1;margin-top:7px}
.komi-catalog-search {position:relative;margin-bottom:14px}
.komi-catalog-search input {
    display:block;width:100%;padding:15px 20px 15px 46px!important;
    background:#121317;border:1px solid #303137;border-radius:17px;
    color:#fff;font-size:14px;outline:none;
}
.komi-catalog-search input:focus {border-color:#cb4358;box-shadow:0 0 0 3px #f03d5017}
.komi-catalog-search svg {position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:#9798a2;stroke-width:1.8;fill:none;pointer-events:none}
.komi-catalog-chips {display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}
.komi-catalog-chip {padding:8px 13px;border-radius:999px}
.komi-catalog-chip.active {background:#3a1b25;border-color:#d13b54;color:white}
.komi-catalog-clear {padding:9px 15px;border-radius:12px;font-size:11px}
.catalog-filters-box {
    border:1px solid #292b31!important;
    background:rgba(20,21,26,.78)!important;
    padding:16px!important;
    border-radius:19px!important;
    gap:12px!important;
    margin-bottom:18px!important;
}
.catalog-filters-box .form-control {border-radius:11px!important;padding:11px!important;font-size:12px!important;background:#101116!important}
.catalog-filters-box label {font-size:11px!important;color:#b3b4bc!important;margin-bottom:7px!important}
.komi-catalog-status {display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 18px;color:#9e9fa8;font-size:12px}
.komi-catalog-count {font-weight:700;color:#d6d6db}
.komi-catalog-empty {grid-column:1/-1;min-height:180px;display:grid;place-items:center;align-content:center;gap:9px;border:1px dashed #3e3039;background:#111116;border-radius:20px;text-align:center;padding:24px;color:#c9c9cf}
.komi-catalog-empty p {font-size:12px;color:#9999a5}
#watchModal .player-wrapper {border-radius:20px!important}
#watchModal .players-switcher-bar {background:rgba(18,18,23,.85)!important}
#watchModal .crunchy-episodes-section {background:rgba(20,20,26,.86)!important}
@media(max-width:1050px) {
    .komi-release-list {grid-template-columns:1fr}
    .hero-slider-container {height:405px!important}
    .komi-spotlight-metrics {width:100%}
}
@media(max-width:680px) {
    .app-layout {padding:18px 12px 88px!important}
    main#mainContainer {gap:23px}
    .komi-spotlight-heading h1 {font-size:25px}
    .komi-spotlight-metrics span {padding:7px 9px}
    .komi-fastnav {display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .komi-fastnav button {padding:11px 8px;font-size:11px}
    .hero-slider-container {height:380px!important;border-radius:21px!important}
    .hero-slide {padding:24px!important;justify-content:center!important}
    .hero-slide h1 {font-size:26px!important}
    .hero-slide p {font-size:11px!important;-webkit-line-clamp:2}
    .hero-meta span {padding:4px 7px!important}
    .hero-slider-arrow {width:31px;height:31px}
    .hero-arrow-prev {left:6px}.hero-arrow-next {right:6px}
    .hero-dots {right:16px;bottom:10px}
    .anime-grid {gap:11px!important}
    .anime-info {padding:10px!important}
    .komi-release-row {grid-template-columns:70px minmax(0,1fr) 52px;gap:6px;padding:10px!important}
    .komi-catalog-header {align-items:flex-start}
    .catalog-filters-box {grid-template-columns:1fr 1fr!important;gap:9px!important;padding:12px!important}
    .komi-catalog-search input {padding:13px 12px 13px 42px!important}
    .komi-catalog-chip {padding:8px 11px}
}
@media(prefers-reduced-motion:reduce) {
    .anime-card,.anime-card .anime-poster,.komi-fastnav button {transition:none!important}
}


/* Small usability improvements: focused search, sticky-anchor offsets and readable card controls */

    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    border:0;
    border-bottom:1px solid #29292f;
    border-radius:0;
    color:#ededf2;
    background:#101115;
    padding:11px 13px;
    font:inherit;
    cursor:pointer;
}
.search-dropdown button.search-dropdown-item:hover,
.search-dropdown button.search-dropdown-item:focus-visible {
    background:#22171d;
}
#komiCalendarSection {scroll-margin-top:100px}
.anime-card:focus-visible {outline:2px solid #f54d61;outline-offset:3px}
@media(max-width:680px) {

async function loadDataFromCloud(attempt = 0) {
    catalogInitialLoadFailed = false;
    try {
        if (!_supabase) throw new Error('Supabase не подключён');

        const settingsPromise = _supabase
            .from('animes').select('id,content').in('id', [2, 3, 4, 5, 7]);
        const catalog = [];
        let lastId = 0;
        while (true) {
            const pageSize = catalog.length ? 500 : 48;
            const { data: rows, error } = await _supabase
                .from('komi_catalog_cards').select('shikimori_id,data,updated_at')
                .gt('shikimori_id', lastId)
                .order('shikimori_id', { ascending: true })
                .limit(pageSize);
            if (error) throw error;
            if (!rows || rows.length === 0) break;
            for (const row of rows) {
                const anime = row.data;
                if (!anime || typeof anime !== 'object') continue;
                catalog.push({
                    ...anime,
                    id: String(row.shikimori_id),
                    shikimoriId: Number(row.shikimori_id),
                    title: anime.title || anime.originalTitle || 'Без названия',
                    poster: anime.poster || '',
                    shikiRating: anime.shikiRating || 0,
                    genres: Array.isArray(anime.genres) ? anime.genres : [],
                    episodeCount: Math.max(0, Number(anime.episodeCount) || 0),
                    komiCardUpdatedAt: row.updated_at,
                    // Full episode sources are fetched only when opening a title.
                    episodes: []
                });
            }
            lastId = rows[rows.length - 1].shikimori_id;
            // Keep the first usable batch available even if a later request fails.
            if (!catalogInitialLoadComplete && catalog.length && catalog.length <= 48) {
                animeList = catalog.slice();
                render();
            }
            if (rows.length < pageSize) break;
        }
        const { data: settings, error: settingsError } = await settingsPromise;
        if (settingsError) console.warn('Ошибка настроек:', settingsError.message);
        for (const row of settings || []) {
            let value;
            try { value = JSON.parse(row.content || 'null'); } catch { continue; }
            if (row.id === 2) animeComments = value || {};
            if (row.id === 3 && !currentUser?.authUserId) userAnimeStatuses = { ...userAnimeStatuses, ...(value || {}) };
            if (row.id === 4) {
                const existing = currentUser?.authUserId ? userProfiles[currentUser.username] : null;
                userProfiles = { ...userProfiles, ...(value || {}) };
                if (existing) userProfiles[currentUser.username] = existing;
            }
            if (row.id === 4 && currentUser && !currentUser.authUserId) {
                const name = currentUser.username;
                const avatar = localStorage.getItem('komi_avatar_' + name);
                if (avatar && (!userProfiles[name]?.avatar || userProfiles[name].avatar.startsWith('https://api.dicebear.com/'))) userProfiles[name] = { ...(userProfiles[name] || {}), avatar };
            }
            if (row.id === 5) userNotifications = value || {};
            if (row.id === 7) userFriends = { ...userFriends, ...(value || {}) };
        }

        animeList = catalog;
        catalogInitialLoadComplete = true;
        console.log(`Komi Anime Hub: загружено ${animeList.length} аниме из anime_catalog`);
    } catch (err) {
        console.error('Ошибка загрузки каталога:', err);
        // Preserve already displayed records while retrying.
        if (attempt < 3) {
            setTimeout(() => loadDataFromCloud(attempt + 1), 2000 * 2 ** attempt);
        } else {
            catalogInitialLoadFailed = true;
        }
    }
    render();
    updateNotificationsUI();
}

        let presenceRequestInFlight = false;
        async function updateOnlinePresence() {
            if (!_supabase || document.hidden || presenceRequestInFlight) return;
            presenceRequestInFlight = true;
            const controller = new AbortController();
            const timer = setTimeout(() => {
                controller.abort();
                const el = document.getElementById('onlineCountText');
                if (el) el.textContent = 'Онлайн: недоступен';
            }, 3000);
            try {
                const now = Date.now();
                const currentName = currentUser ? currentUser.username : ('Гость_' + myUniqueKey.slice(0,4));
                
                await _supabase.from('online_users').upsert({ 
                    session_id: myUniqueKey, 
                    username: currentName, 
                    last_seen: now 
                }, { onConflict: 'session_id' }).abortSignal(controller.signal);

                const expireTime = now - 10000;
                await _supabase.from('online_users').delete().lt('last_seen', expireTime).abortSignal(controller.signal);

                const presenceUser = currentUser?.username;
                const { data: cloudSyncData } = presenceUser
                    ? await _supabase.from('animes').select('id,content').in('id', [5, 7]).abortSignal(controller.signal)
                    : {};
                if (cloudSyncData && currentUser?.username === presenceUser) {
                    cloudSyncData.forEach(row => {
                        if (row.id === 5) userNotifications = JSON.parse(row.content || '{}');
                        if (row.id === 7) {
                            const cloudFriends = JSON.parse(row.content || '{}');
                            userFriends = { ...userFriends, ...cloudFriends };
                        }
                    });
                    updateNotificationsUI();
                }

                const { data, error } = await _supabase.from('online_users').select('*').abortSignal(controller.signal);
                if (error || controller.signal.aborted) throw error || Error('Presence timed out');
                if (data) {
                    const uniqueUsersMap = new Map();
                    data.forEach(item => uniqueUsersMap.set(item.username, item));
                    globalAllOnlineUsersList = Array.from(uniqueUsersMap.values());

                    const count = globalAllOnlineUsersList.length;
                    const el = document.getElementById('onlineCountText');
                    if (el) el.innerText = `Онлайн: ${count}`;
                }
            } catch(e) {
                const el = document.getElementById('onlineCountText');
                if (el) el.innerText = `Онлайн: недоступен`;
            } finally {
                clearTimeout(timer);
                presenceRequestInFlight = false;
            }
        }

        setInterval(updateOnlinePresence, 8000);
        document.addEventListener('visibilitychange', updateOnlinePresence);
        updateOnlinePresence();

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }


        function komiCatalogType(anime) {
            const kind=String(anime?.type || anime?.kind || '').toLowerCase();
            if (['movie','film','фильм'].includes(kind)) return 'Фильм';
            if (kind==='ova') return 'OVA';
            if (kind==='ona') return 'ONA';
            if (kind==='special') return 'Special';
            return 'Сериал';
        }
        let catalogCollection = 'all';
        const komiCollections = {all:'Все аниме', recent:'Свежие серии', short:'На один вечер', movies:'Фильмы', best:'Высокая оценка'};
        function komiInCollection(anime, collection) {
            const episodes = Number(anime.episodeCount) || (Array.isArray(anime.episodes) ? anime.episodes.length : 0);
            if (collection === 'recent') return Number.isFinite(Date.parse(anime.lastEpisodeAddedAt));
            if (collection === 'short') return komiCatalogType(anime) === 'Сериал' && episodes > 0 && episodes <= 13 && Number(anime.shikiRating) >= 7;
            if (collection === 'movies') return komiCatalogType(anime) === 'Фильм';
            if (collection === 'best') return Number(anime.shikiRating) >= 8;
            return true;
        }

        function komiCatalogFiltered() {
            const q=catalogSearchQuery.trim().toLocaleLowerCase('ru-RU');
            const filtered=animeList.filter(a=>{
                if (!komiInCollection(a,catalogCollection)) return false;
                const genres=Array.isArray(a.genres)?a.genres:[a.genre].filter(Boolean);
                if(catalogFilterGenre!=='Все'&&!genres.includes(catalogFilterGenre))return false;
                if(catalogFilterYear!=='Все'&&komiAnimeYear(a)!==String(catalogFilterYear))return false;
                if(catalogFilterType!=='Все'&&komiCatalogType(a)!==catalogFilterType)return false;
                if(q&&![a.title,a.originalTitle,a.english,a.japanese,...(Array.isArray(a.synonyms)?a.synonyms:[]),...genres].some(v=>String(v||'').toLocaleLowerCase('ru-RU').includes(q)))return false;
                return true;
            });
            if(catalogSort==='popular')filtered.sort((a,b)=>
                Number(komiAnimeYear(b))-Number(komiAnimeYear(a))||
                (Number(b.shikiRating)||0)-(Number(a.shikiRating)||0));
            else if(catalogSort==='updated')filtered.sort((a,b)=>(Date.parse(b.lastEpisodeAddedAt)||0)-(Date.parse(a.lastEpisodeAddedAt)||0));
            else if(catalogSort==='rating')filtered.sort((a,b)=>(Number(b.shikiRating)||0)-(Number(a.shikiRating)||0));
            else if(catalogSort==='alphabet')filtered.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ru'));
            else if(catalogSort==='year')filtered.sort((a,b)=>Number(komiAnimeYear(b))-Number(komiAnimeYear(a))||Number(b.shikimoriId||b.id)-Number(a.shikimoriId||a.id));
            return filtered;
        }

            }

            const myFriends = friendsFor(username);
            const isMe = currentUser && currentUser.username === username;
            const amIFriend = currentUser && friendsFor(currentUser.username).includes(username);

            const userStatuses = userAnimeStatuses[username] || {};
            const statsCounts = { 'Просмотрено': 0, 'В планах': 0, 'Смотрю': 0, 'Отложено': 0, 'Брошено': 0, 'Любимые': 0 };
            
            const customFolders = userCustomFolders[username] || {};
            const customFolderNames = Object.keys(customFolders);

            const listForTab = [];
            Object.entries(userStatuses).forEach(([aId, st]) => {
                if (statsCounts[st] !== undefined) statsCounts[st]++;
                if (st === profileActiveTab) {
                    const anObj = animeList.find(x => String(x.id) === String(aId));

                const favs = userFavorites[username] || {};
                Object.keys(favs).forEach(aId => {
                    const anObj = animeList.find(x => String(x.id) === String(aId));
                    if (anObj && !listForTab.some(x => String(x.id) === String(aId))) listForTab.push(anObj);
                });
                statsCounts['Любимые'] = listForTab.length;
            } else if (customFolderNames.includes(profileActiveTab)) {
                const folderAnimeIds = customFolders[profileActiveTab] || [];
                folderAnimeIds.forEach(aId => {
                    const anObj = animeList.find(x => String(x.id) === String(aId));
                    if (anObj) listForTab.push(anObj);
                });
            }

            const genreTotals = {};

                const item = animeList.find(x => String(x.id) === String(aId));
                if (!item) return;
                const genres = Array.isArray(item.genres) ? item.genres : [item.genre];
                genres.filter(Boolean).forEach(g => { genreTotals[g] = (genreTotals[g] || 0) + 1; });
            });
            const topGenres = Object.entries(genreTotals).sort((a,b) => b[1] - a[1]).slice(0,5);
            const watchedCount = statsCounts['Просмотрено'] || 0;
            const calculatedLevel = komiAchievements(username).level;

                commList.forEach(c => {

        let avatarDraft = null;

        function handleAvatarFileUpload(event) {
            const file = event.target.files[0];
            const owner = currentUser?.authUserId || currentUser?.username;
            avatarDraft = null;
            if (!file || !owner) return;
            if (!file.type.startsWith('image/')) {
                komiStatusFeedback('Выберите изображение.');
                return;
            }
            const image = new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Не удалось прочитать файл.'));
                reader.onload = () => {
                    const preview = new Image();
                    preview.onerror = () => reject(new Error('Не удалось открыть изображение.'));
                    preview.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            const scale = Math.min(1, 320 / Math.max(preview.width, preview.height));
                            canvas.width = Math.max(1, Math.round(preview.width * scale));
                            canvas.height = Math.max(1, Math.round(preview.height * scale));
                            canvas.getContext('2d').drawImage(preview, 0, 0, canvas.width, canvas.height);
                            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Не удалось подготовить изображение.')), 'image/jpeg', .78);
                        } catch (error) { reject(error); }
                    };
                    preview.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
            const draft = avatarDraft = { owner, image };
            image.then(() => {
                if (avatarDraft === draft) komiStatusFeedback('Фото выбрано. Нажмите «Сохранить».');
            }, error => {
                if (avatarDraft !== draft) return;
                avatarDraft = null;
                komiStatusFeedback(error.message);
            });
        }

        async function uploadAvatarToStorage(blob, owner) {
            const filename = owner + '/' + crypto.randomUUID() + '.jpg';
            const storage = _supabase.storage.from('avatars');
            const { error } = await storage.upload(filename, blob, {
                contentType: 'image/jpeg', upsert: false, cacheControl: '3600'
            });
            if (error) throw new Error('Не удалось загрузить аватар. ' + error.message);
            return storage.getPublicUrl(filename).data.publicUrl;
        }

        async function updateUserProfile(button) {
            if (!currentUser || profileSavePending) return;
            const { username, authUserId } = currentUser;
            if (!authUserId || !_supabase) {
                komiStatusFeedback('Войдите в аккаунт Komi через Google или email для сохранения профиля.');
                return;
            }
            const displayName = document.getElementById('newDisplayName')?.value.trim() || '';
            const status = (document.getElementById('newStatusText')?.value || '').trim().slice(0, 100);
            if (displayName && displayName.length < 2) {
                komiStatusFeedback('Имя должно содержать хотя бы 2 символа.');
                return;
            }
            const draft = avatarDraft?.owner === authUserId ? avatarDraft : null;
            profileSavePending = true;
            if (button) button.disabled = true;
            try {
                const fields = { display_name: displayName.slice(0, 40), bio: status };
                if (draft) {
                    const blob = await draft.image;
                    if (currentUser?.authUserId !== authUserId) return;
                    draft.url ||= await uploadAvatarToStorage(blob, authUserId);
                    fields.avatar_url = draft.url;
                }
                if (currentUser?.authUserId !== authUserId) return;
                const columns = 'display_name,avatar_url,bio,created_at';
                const profiles = _supabase.from('komi_profiles');
                let { data: saved, error } = await profiles.update(fields)
                    .eq('user_id', authUserId).select(columns).maybeSingle();
                if (error) throw error;
                if (!saved && currentUser?.authUserId === authUserId) {
                    ({ data: saved, error } = await _supabase.from('komi_profiles')
                        .insert({ user_id: authUserId, username: komiSafeAccountUsername(username, authUserId), ...fields }).select(columns).single());
                    if (error) throw error;
                }
                if (!saved || currentUser?.authUserId !== authUserId) return;
                applySavedKomiProfile(username, saved);
                if (avatarDraft === draft) avatarDraft = null;
                saveData();
                render();
                komiStatusFeedback('Профиль сохранён.');
            } catch (error) {
                if (currentUser?.authUserId === authUserId) komiStatusFeedback('Не удалось сохранить профиль. ' + error.message);
            } finally {
                profileSavePending = false;
                if (button) button.disabled = false;
            }
        }

            saveData();

        function cleanAnimeDescription(value) {
            return escapeFriendHtml(String(value || '')
                .replace(/\[(?:character|anime|manga|person|user|url|b|i|s|spoiler|quote|code|size|color|center|left|right|poster|image|video|audio|youtube|html)[^\]]*\]/gi, ' ')
                .replace(/\[\/(?:character|anime|manga|person|user|url|b|i|s|spoiler|quote|code|size|color|center|left|right|poster|image|video|audio|youtube|html)\]/gi, ' ')
                .replace(/<[^>]*>/g, ' ')
                .replace(/(?:https?:\/\/|www\.)\S+/gi, ' ')
                .replace(/&(?:#?x?[\w]+);/gi, ' ')
                .replace(/[\u0000-\u001f\s]+/g, ' ').trim());
        }
        function renderCard(anime) {
            const year=komiAnimeYear(anime);
            const type=komiCatalogType(anime);
            const score=Number(anime.shikiRating);
            const rating=Number.isFinite(score)&&score>0?score.toFixed(1):'—';
            const genres=Array.isArray(anime.genres)?anime.genres:[anime.genre].filter(Boolean);
            const genreText=escapeFriendHtml(genres.slice(0,2).join(', '));
            const name=escapeFriendHtml(anime.title||anime.originalTitle||'Без названия');
            const id=String(anime.id);
            const poster=escapeFriendHtml(komiSafeUrl(anime.poster) || komiSafeUrl(anime.banner) || '/anime-artwork.svg');
            const episodeCount=Number(anime.episodeCount)||(Array.isArray(anime.episodes)?anime.episodes.length:0);
            const lastAdded=Date.parse(anime.lastEpisodeAddedAt);
            const fresh=Number.isFinite(lastAdded)&&Date.now()>=lastAdded&&Date.now()-lastAdded<72*3600000;
            return '<div class="anime-card" role="button" tabindex="0" aria-label="Открыть аниме '+name+'" '+
                'onclick="playSound();openWatchModal(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openWatchModal(\''+id+'\')}">'+
                '<div class="anime-rating-badge">★ '+rating+'</div>'+

                    '<img src="'+poster+'" alt="Постер: '+name+'" class="anime-poster" loading="lazy" decoding="async" referrerpolicy="no-referrer"'+(poster?'':' style="display:none"')+' onerror="this.onerror=null;this.src=\'/anime-artwork.svg\'">'+
                    '<div class="anime-poster-fallback" style="display:'+(poster?'none':'flex')+';position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:12px;text-align:center;background:linear-gradient(145deg,#1e1e26,#101015);color:#92929F"><span style="font-size:30px;font-weight:800;color:#f03d50">K</span><span style="font-size:11px;line-height:1.4">Постер недоступен</span></div>'+
                    '<div class="anime-quick-view"><span class="btn-glow" style="padding:7px 12px;font-size:11px">▷ Смотреть</span></div>'+

        let komiRouletteRun = 0;
        function randomAnimeWithAnimation() {
            if (animeList.length === 0) return;
            playSound();
            const modal = document.getElementById('randomRouletteModal');
            const imgEl = document.getElementById('rouletteImage');
            const titleEl = document.getElementById('rouletteTitle');
            modal.classList.add('active');

            const run = ++komiRouletteRun;
            let counter = 0;
            const maxSteps = 12;
            const candidates = animeList.filter(item => item.poster && /^https?:\/\//i.test(item.poster));
            if (!candidates.length) { modal.classList.remove('active'); return; }
            const fallback = '/anime-artwork.svg';
            let lastId = null;
            function showPoster(item) {
                titleEl.textContent = item.title || 'Аниме';
                imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = fallback; };
                // Avoid showing the previous poster while the next image downloads.
                imgEl.style.opacity = '0';
                imgEl.onload = () => { if (run === komiRouletteRun) imgEl.style.opacity = '1'; };
                imgEl.src = item.poster;
            }
            function pick() {
                const options = candidates.filter(item => item.id !== lastId);
                const item = (options.length ? options : candidates)[Math.floor(Math.random() * (options.length || candidates.length))];
                lastId = item.id;
                return item;
            }
            let currentInterval = 50;

            function spinStep() {
                if (run !== komiRouletteRun) return;
                const randomItem = pick();
                showPoster(randomItem);
                counter++;

                if (counter < maxSteps) {
                    currentInterval += 10; 
                    setTimeout(spinStep, currentInterval);
                } else {
                    const finalItem = pick();
                    showPoster(finalItem);
                    setTimeout(() => {
                        if (run !== komiRouletteRun) return;
                        modal.classList.remove('active');
                        openWatchModal(finalItem.id);
                    }, 400);
                }
            }
            spinStep();
        }

        let protectedFriendRequests = [];
        let protectedFriendList = { owner: null, idsByName: new Map() };

        function friendsFor(username) {
            const legacy = userFriends[username] || [];
            if (username !== currentUser?.username || protectedFriendList.owner !== currentUser?.authUserId) return legacy;
            return [...new Set([...legacy, ...protectedFriendList.idsByName.keys()])];
        }
        async function loadProtectedFriends() {
            const uid = currentUser?.authUserId;
            if (!uid || !_supabase) return;
            const [requests, friendships] = await Promise.all([
                _supabase.from('komi_friend_requests').select('id,sender_id').eq('receiver_id', uid).eq('status', 'pending'),
                _supabase.from('komi_friendships').select('user_a,user_b')
            ]);
            if (requests.error || friendships.error) throw requests.error || friendships.error;
            const friendIds = friendships.data.map(row => row.user_a === uid ? row.user_b : row.user_a);
            const ids = [...new Set([...friendIds, ...requests.data.map(row => row.sender_id)])];
            const profiles = ids.length
                ? await _supabase.from('komi_profiles').select('user_id,username').in('user_id', ids)
                : { data: [] };
            if (profiles.error) throw profiles.error;
            if (currentUser?.authUserId !== uid) return;
            const names = new Map(profiles.data.map(row => [row.user_id, row.username]));
            protectedFriendList = {
                owner: uid,
                idsByName: new Map(friendIds.filter(id => names.has(id)).map(id => [names.get(id), id]))
            };
            protectedFriendRequests = requests.data.map(row => ({
                owner: uid, id: row.id, name: names.get(row.sender_id) || 'Пользователь'
            }));
            updateNotificationsUI();
            renderFriendsDrawer();
        }

        async function sendFriendRequest(targetUsername) {
            if (!currentUser?.authUserId) { alert('Для заявок в друзья войдите через email или Google. Старые аккаунты пока не привязаны к защищённой системе.'); return; }
            if (!currentUser) { openAuthModal('login'); return; }
            if (currentUser.username === targetUsername) return;
            if (currentUser.authUserId) {
                const sender = currentUser.authUserId;
                try {
                    const { data: target, error: lookupError } = await _supabase.from('komi_profiles')
                        .select('user_id').eq('username', targetUsername).maybeSingle();
                    if (lookupError) throw lookupError;
                    if (!target) throw new Error('Этот старый профиль ещё не привязан к новому аккаунту.');
                    if (currentUser?.authUserId !== sender) return;
                    if (target.user_id === sender || friendsFor(currentUser.username).includes(targetUsername)) return;
                    const { error } = await _supabase.from('komi_friend_requests')
                        .insert({ sender_id: sender, receiver_id: target.user_id });
                    if (error) throw error;
                    alert('Заявка отправлена.');
                } catch (error) {
                    alert('Не удалось отправить заявку: ' + error.message);
                }
                return;
            }
            if (!userProfiles[targetUsername]) { alert('Пользователь не найден'); return; }
            if (friendsFor(currentUser.username).includes(targetUsername)) { alert('Вы уже друзья'); return; }
            if ((userNotifications[targetUsername] || []).some(n=>n.friendRequestFrom===currentUser.username)) { alert('Заявка уже отправлена'); return; }
            addNotification(targetUsername, `${currentUser.username} хочет добавить вас в друзья.`, null, currentUser.username);
            alert(`Запрос отправлен пользователю ${targetUsername}!`);
            renderFriendsDrawer();
        }

        async function acceptFriendRequest(senderName, notifIndex) {
            if (!currentUser) return;
            const myName = currentUser.username;

            const pendingRequest=(userNotifications[myName]||[]).find(n=>n.friendRequestFrom===senderName);
            if (!pendingRequest || !userProfiles[senderName]) { alert('Заявка больше не актуальна.'); updateNotificationsUI(); return; }
            if (!userFriends[myName]) userFriends[myName] = [];
            if (!userFriends[myName].includes(senderName)) userFriends[myName].push(senderName);

            if (!userFriends[senderName]) userFriends[senderName] = [];
            if (!userFriends[senderName].includes(myName)) userFriends[senderName].push(myName);

            await saveFriendsToCloud();

            if (userNotifications[myName]) {
                userNotifications[myName]=userNotifications[myName].filter(n=>n!==pendingRequest);
                await saveNotificationsToCloud();
            }

            addNotification(senderName, `${myName} принял(а) ваш запрос в друзья!`);
            alert(`Теперь вы друзья с ${senderName}!`);
            render();
            renderFriendsDrawer();
        }

        async function declineFriendRequest(notifIndex) {
            if (!currentUser) return;
            const myName = currentUser.username;

            if (userNotifications[myName]) {
                const notice=userNotifications[myName][notifIndex];
                if (!notice?.friendRequestFrom) return;
                userNotifications[myName]=userNotifications[myName].filter(n=>n.friendRequestFrom!==notice.friendRequestFrom);
                await saveNotificationsToCloud();
                updateNotificationsUI();
            }
            alert('Запрос отклонен.');
        }

        async function removeFriend(friendUsername) {
            if (!confirm(`Удалить ${friendUsername} из друзей?`)) return;
            if (!currentUser) return;
            const myName = currentUser.username;
            const uid = currentUser.authUserId;
            const friendId = uid && protectedFriendList.owner === uid && protectedFriendList.idsByName.get(friendUsername);
            if (friendId) {
                try {
                    const { error } = await _supabase.rpc('komi_remove_friend', { p_friend_id: friendId });
                    if (error) throw error;
                    if (currentUser?.authUserId !== uid) return;
                    await loadProtectedFriends();
                } catch (error) {
                    alert('Не удалось удалить друга: ' + error.message);
                    return;
                }
                if (!(userFriends[myName] || []).includes(friendUsername)) {
                    openProfile(friendUsername);
                    return;
                }
            }
            if (userFriends[myName]) userFriends[myName] = userFriends[myName].filter(u => u !== friendUsername);
            if (userFriends[friendUsername]) userFriends[friendUsername] = userFriends[friendUsername].filter(u => u !== myName);
            await saveFriendsToCloud();
            openProfile(friendUsername);
            renderFriendsDrawer();
        }

        let komiApiSearchController;
        async function searchAnimeFromAPI() {
            komiApiSearchController?.abort();
            const controller = komiApiSearchController = new AbortController();
            const query = document.getElementById('apiSearchTitle').value.trim();
            const results = document.getElementById('apiSearchResultsList');
            results.style.display = 'block';
            results.textContent = query ? 'Поиск в базе Shikimori…' : 'Введите название аниме.';
            if (!query) return;
            const timer = setTimeout(() => controller.abort(), 15000);
            try {
                const target = 'https://shikimori.me/api/animes?search='+encodeURIComponent(query)+'&limit=6';
                const response = await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(target), {signal:controller.signal});
                if (!response.ok) throw Error('HTTP '+response.status);
                const rows = await response.json();
                if (!Array.isArray(rows)) throw Error('Некорректный ответ каталога');
                if (komiApiSearchController !== controller || !results.isConnected || document.getElementById('apiSearchTitle').value.trim() !== query) return;
                results.replaceChildren();
                if (!rows.length) results.textContent = 'Ничего не найдено.';
                for (const anime of rows) {
                    const button = document.createElement('button');
                    button.type = 'button'; button.className = 'search-dropdown-item';
                    button.textContent = (anime.russian || anime.name || 'Без названия')+' · '+(anime.aired_on?.slice(0,4) || 'Год не указан');
                    button.onclick = () => {
                        const poster = anime.image?.original ? new URL(anime.image.original,'https://shikimori.me').href : '';
                        fillFormWithAnimeData({title:anime.russian || anime.name, poster, score:anime.score || 0,
                            year:anime.aired_on?.slice(0,4) || '', type:anime.kind === 'movie' ? 'Фильм' : 'Сериал',
                            synopsis:anime.description || '', genres:[], images:poster ? [poster] : []});
                    };
                    results.append(button);
                }
            } catch (error) {
                if (komiApiSearchController === controller && results.isConnected)
                    results.textContent = 'Не удалось выполнить поиск. Проверьте соединение и повторите.';
            } finally { clearTimeout(timer); }
        }
