<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komi Anime Hub — Премиум платформа</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FF454F'/><text x='50%' y='55%' font-size='60' font-weight='800' fill='white' font-family='sans-serif' dominant-baseline='middle' text-anchor='middle'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #09090D;
            --bg-card: #14141B;
            --bg-card-hover: #1C1C26;
            --bg-input: #1C1C26;
            --primary: #FF454F;
            --primary-hover: #E03E46;
            --accent: #FF454F;
            --text-main: #F5F5F7;
            --text-muted: #92929F;
            --border: #282832;
            --success: #36D399;
            --glow: rgba(255, 69, 79, 0.3);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-hover); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.6); opacity: 1; }
            100% { transform: translateY(-380px) scale(1.5); opacity: 0; }
        }

        /* Шапка сайта */
        header {
            background: rgba(9, 9, 13, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
        }

        .header-inner {
            max-width: 1400px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-area { display: flex; align-items: center; gap: 14px; }
        .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-box {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary), #FF737B);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; color: white;
            box-shadow: 0 0 16px var(--glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .logo-box:hover { transform: scale(1.06); box-shadow: 0 0 22px var(--glow); }
        .logo-text {
            font-size: 18px; font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, var(--text-muted));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.4px;
        }

        .online-counter {
            background: rgba(54, 211, 153, 0.08);
            border: 1px solid rgba(54, 211, 153, 0.25);
            color: var(--success); padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .online-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

        .search-container { position: relative; flex: 0 1 300px; }
        .search-bar input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 12px 8px 36px; color: white; font-size: 12px; outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--glow); }
        .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); fill: var(--text-muted); width: 14px; height: 14px; }

        .search-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 10px; margin-top: 6px; display: none; z-index: 200;
            box-shadow: 0 20px 40px rgba(0,0,0,0.85); max-height: 280px; overflow-y: auto;
        }
        .search-dropdown.active { display: block; animation: fadeInUp 0.15s ease; }
        .search-dropdown-item { padding: 9px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; transition: background 0.15s ease; }
        .search-dropdown-item:hover { background: var(--bg-card-hover); color: white; }

        .nav-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            font-weight: 600; font-size: 12px; cursor: pointer; padding: 6px 12px; border-radius: 8px;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.04); border-color: var(--border); }

        .action-icon-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; position: relative;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .action-icon-btn:hover { border-color: var(--text-muted); background: var(--bg-card-hover); }

        .notification-badge {
            position: absolute; top: -4px; right: -4px; background: var(--primary); color: white;
            font-size: 9px; font-weight: 800; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px var(--glow);
        }

        .notification-dropdown {
            position: absolute; top: 120%; right: 0; width: 300px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: none; flex-direction: column; z-index: 300; overflow: hidden;
        }
        .notification-dropdown.active { display: flex; animation: fadeInUp 0.15s ease; }
        .notif-header { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .notif-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; }
        .notif-item { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
        .notif-item:hover { background: var(--bg-card-hover); color: white; }

        .user-pill {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .user-pill:hover { border-color: var(--text-muted); }
        .user-avatar-small { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        /* Контейнер контента */
        .app-layout {
            max-width: 1400px; margin: 0 auto; padding: 28px 24px; flex: 1; width: 100%;
            display: flex; flex-direction: column; gap: 36px;
        }

        /* Баннер и блок друзей */
        .top-hero-section-grid {
            display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: stretch;
        }

        .hero-slider-container {
            position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7); background: var(--bg-card); height: 440px; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .hero-slide {
            display: none; background-size: cover; background-position: center; padding: 40px 48px;
            height: 100%; width: 100%; flex-direction: column; justify-content: center; position: absolute; inset: 0;
        }
        .hero-slide.active { display: flex; animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .hero-slide::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, #09090D 35%, rgba(9, 9, 13, 0.8) 65%, rgba(9, 9, 13, 0.3) 100%),
                        radial-gradient(circle at top right, rgba(255, 69, 79, 0.15), transparent 60%);
            z-index: 1;
        }
        .hero-slide > * { position: relative; z-index: 2; }
        .hero-slide h1 { font-size: 38px; font-weight: 800; max-width: 520px; margin-bottom: 10px; line-height: 1.1; color: #FFFFFF; letter-spacing: -0.5px; }
        .hero-slide p { color: var(--text-muted); font-size: 12px; max-width: 440px; margin-bottom: 20px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-meta { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; flex-wrap: wrap; }
        .hero-meta span { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 6px; color: var(--text-main); border: 1px solid var(--border); }
        .hero-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .btn-glow {
            background: var(--primary); color: white; border: none; padding: 9px 20px; border-radius: 10px;
            font-weight: 700; font-size: 12px; cursor: pointer; box-shadow: 0 4px 18px var(--glow);
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 22px var(--glow); }

        .btn-glow-secondary {
            background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 9px 20px; border-radius: 10px;
            font-weight: 700; font-size: 12px; cursor: pointer; backdrop-filter: blur(10px);
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
        }
        .btn-glow-secondary:hover { border-color: var(--text-muted); background: var(--bg-card-hover); transform: translateY(-1px); }

        .hero-slider-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20, 20, 27, 0.7);
            border: 1px solid var(--border); color: white; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 14px; backdrop-filter: blur(8px);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .hero-slider-arrow:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-50%) scale(1.05); }
        .hero-arrow-prev { left: 16px; }
        .hero-arrow-next { right: 16px; }
        
        .hero-dots { position: absolute; bottom: 16px; right: 36px; display: flex; gap: 5px; z-index: 10; }
        .hero-dot { width: 16px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: width 0.3s ease, background 0.3s ease; }
        .hero-dot.active { width: 36px; background: var(--primary); box-shadow: 0 0 10px var(--glow); }

        .friends-sidebar-panel {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .friends-sidebar-panel h3 { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-friends-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 2px; flex: 1; }
        .sidebar-friend-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 10px;
            border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px; font-weight: 600;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .sidebar-friend-item:hover { background: var(--bg-card-hover); border-color: var(--primary); transform: translateX(2px); }
        .sidebar-friend-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--primary); border: 1px solid var(--border); }

        main { width: 100%; display: flex; flex-direction: column; gap: 36px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .section-see-all { font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; background: transparent; border: none; transition: color 0.2s ease; }
        .section-see-all:hover { color: var(--primary); }

        /* Сетка карточек аниме (2:3) */
        .anime-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 16px; 
            width: 100%; 
        }
        @media (max-width: 1600px) { .anime-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 1350px) { .anime-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) { .anime-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 850px) { .anime-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 580px) { .anime-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        .anime-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex; flex-direction: column; position: relative; width: 100%;
        }
        .anime-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 12px 30px var(--glow); }
        
        .anime-rating-badge {
            position: absolute; top: 8px; left: 8px; background: rgba(9, 9, 13, 0.75); border: 1px solid var(--border);
            color: #fbbf24; padding: 3px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; z-index: 2; backdrop-filter: blur(6px);
        }
        
        .anime-poster-box { position: relative; width: 100%; aspect-ratio: 2 / 3; overflow: hidden; background: var(--bg-input); }
        .anime-poster { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .anime-card:hover .anime-poster { transform: scale(1.06); }
        
        .anime-quick-view {
            position: absolute; inset: 0; background: rgba(9, 9, 13, 0.6); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; z-index: 3;
        }
        .anime-card:hover .anime-quick-view { opacity: 1; }
        
        .anime-info { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; background: var(--bg-card); z-index: 2; }
        .anime-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .anime-meta-card { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 12px; border: 1px dashed var(--border); }

        /* Профиль */
        .profile-container { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 24px;
            display: grid; grid-template-columns: 150px 1fr; gap: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        .profile-header-card::after {
            content: ''; position: absolute; top: 0; right: 0; width: 180px; height: 180px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%); pointer-events: none; opacity: 0.6;
        }
        .profile-avatar-box {
            width: 150px; height: 190px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border); background: var(--bg-input);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .profile-avatar-box:hover { transform: scale(1.02); border-color: var(--primary); }
        .profile-info-grid { display: flex; flex-direction: column; gap: 10px; z-index: 2; }
        .profile-name-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .profile-name-row h2 { font-size: 22px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; letter-spacing: -0.4px; }
        
        .profile-badges-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .profile-badge-item {
            background: rgba(255, 69, 79, 0.08); border: 1px solid rgba(255, 69, 79, 0.2); color: var(--primary);
            padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px;
        }
        .profile-badge-level {
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); color: var(--text-main);
            padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
        }
        .profile-reg-date { color: var(--text-muted); font-size: 11px; font-weight: 500; opacity: 0.8; }

        .profile-settings-box {
            background: var(--bg-input); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 2px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .profile-settings-box h4 { font-size: 11px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }

        .profile-stats-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
        }
        @media(max-width: 1100px) { .profile-stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media(max-width: 700px) { .profile-stats-grid { grid-template-columns: repeat(2, 1fr); } }

        .profile-stat-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px;
            display: flex; flex-direction: column; gap: 5px; cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .profile-stat-card:hover { background: var(--bg-card-hover); border-color: var(--text-muted); transform: translateY(-2px); }
        .profile-stat-card.active {
            background: linear-gradient(135deg, rgba(255, 69, 79, 0.12), var(--bg-card));
            border-color: var(--primary); box-shadow: 0 6px 20px var(--glow);
        }
        .profile-stat-card .stat-icon { font-size: 16px; }
        .profile-stat-card .stat-num { font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.4px; }
        .profile-stat-card .stat-label { font-size: 10px; font-weight: 600; color: var(--text-muted); }
        .profile-stat-card.active .stat-label { color: var(--primary); }

        .profile-layout-grid { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }
        .profile-main-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .profile-sidebar-menu { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        
        .profile-menu-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: white;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .profile-menu-item:hover { border-color: var(--primary); background: var(--bg-card-hover); }

        .profile-wall-section { margin-top: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .wall-message-item { background: var(--bg-input); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 5px; }
        .wall-message-author { font-size: 11px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .wall-message-author img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
        .wall-message-text { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #0D0D12; border: 1px solid var(--border); border-radius: 16px;
            width: 95%; max-width: 1100px; padding: 22px; max-height: 90vh; overflow-y: auto;
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.9); animation: modalScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-close {
            position: absolute; top: 14px; right: 14px; background: var(--bg-card);

        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: white; font-size: 11px; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }

        textarea.form-control { resize: vertical; min-height: 70px; }

        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 11px; transition: background 0.15s ease, border-color 0.15s ease; }
        .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }
        .btn-danger { background: rgba(255, 69, 79, 0.08); color: #FF454F; border: 1px solid rgba(255, 69, 79, 0.2); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: background 0.15s ease; }

        .catalog-filters-box {

            margin-bottom: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;
        }

        .watch-cinema-layout { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        .crunchy-hero-section {

        }

        .crunchy-hero-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }

        .party-room-grid { display: grid; grid-template-columns: 1fr 280px; gap: 14px; align-items: start; }
        .party-main-screen { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .party-video-container { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        .party-video-container video, .party-video-container iframe { width: 100%; height: 100%; border: none; object-fit: contain; }

        .flying-emoji-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }

        .party-sidebar-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; height: 400px; }
        .party-members-list { display: flex; flex-direction: column; gap: 5px; max-height: 100px; overflow-y: auto; }
        .party-member-badge { background: var(--bg-input); border: 1px solid var(--border); padding: 3px 6px; border-radius: 5px; font-size: 10px; display: flex; align-items: center; gap: 5px; font-weight: 600; }
        
        .party-chat-box { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; max-height: 150px; }
        .party-chat-msg { font-size: 10px; display: flex; flex-direction: column; gap: 2px; }
        .party-chat-author { font-weight: 700; color: var(--text-main); }

        .party-reactions-bar { display: flex; gap: 5px; justify-content: center; background: var(--bg-input); padding: 5px; border-radius: 6px; border: 1px solid var(--border); }
        .party-react-btn { background: transparent; border: none; font-size: 15px; cursor: pointer; padding: 2px 5px; border-radius: 5px; transition: transform 0.15s ease; }
        .party-react-btn:hover { background: var(--bg-card-hover); transform: scale(1.15); }

        .player-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .player-box { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.8); position: relative; }
        .player-box iframe, .player-box video { width: 100%; height: 100%; border: none; object-fit: contain; }

        .players-switcher-bar {

        .player-switch-btn {

            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .player-switch-btn:hover { border-color: var(--text-muted); color: white; }
        .player-switch-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 8px var(--glow); }

        .anime-screenshots-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }

        .crunchy-episodes-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }

        .season-tab-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: color 0.15s ease, background 0.15s ease; }
        .season-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 8px var(--glow); }

        .episodes-grid-crunchy { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
        .ep-crunchy-card {
            background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
            cursor: pointer; display: flex; flex-direction: column; position: relative; transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .ep-crunchy-card:hover, .ep-crunchy-card.active { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 12px var(--glow); }
        .ep-crunchy-thumb { width: 100%; height: 95px; object-fit: cover; background: #000; position: relative; }
        .ep-crunchy-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
        .ep-crunchy-card:hover .ep-crunchy-play-overlay { opacity: 1; }
        .ep-crunchy-play-icon { width: 28px; height: 28px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; box-shadow: 0 0 8px var(--glow); }
        .ep-crunchy-info { padding: 6px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .ep-crunchy-titles { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .ep-crunchy-title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .ep-crunchy-desc { font-size: 10px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .admin-table th, .admin-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 11px; }
        .admin-table th { color: var(--text-muted); font-weight: 600; }

        @media (max-width: 1024px) {
            .top-hero-section-grid { grid-template-columns: 1fr; }

            .modal-content { padding: 14px 10px; width: 100%; max-height: 92vh; border-radius: 12px; }
        }

        /* KOMI OBSIDIAN — visual-only redesign based on the supplied reference.
           No JavaScript, catalog, Supabase, account, or player changes. */
        :root {

            --primary-hover: #ff4b54;
            --accent: #f13b45;
            --text-main: #f6f6f7;

            --border: #252528;
            --glow: rgba(241,59,69,.17);

        .action-icon-btn, .user-pill { background: #101012; border-color: #29292d; border-radius: 22px; }

        /* Rounded navigation, profile and auth — additive, no app logic removed */
        .search-dropdown { border-radius: 18px; overflow: hidden; box-shadow: 0 24px 65px rgba(0,0,0,.75); }
        .search-dropdown-item { border-color: #242427; padding: 12px 14px; }

        .komi-auth-content {

        /* Compact fixed left rail, inspired by the reference, retaining Komi controls */
        :root { --komi-rail-width: 76px; }
        .komi-side-nav {
            position: fixed; left: 0; top: 0; bottom: 0; z-index: 101;
            width: var(--komi-rail-width); background: #0b0b0c; border-right: 1px solid #202023;
            display: flex; flex-direction: column; align-items: center; padding: 14px 8px 18px;
            gap: 28px;
        }
        .komi-side-logo { width: 48px; height: 48px; border-radius: 16px; border: 0;
            background: linear-gradient(135deg,#fa4552,#bc172c); color: white;
            font-size: 25px; font-weight: 900; cursor: pointer; }
        .komi-side-links,.komi-side-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .komi-side-bottom { margin-top: auto; }
        .komi-side-button { position: relative; width: 49px; height: 49px; display: flex; align-items: center;
            justify-content: center; background: transparent; border: 1px solid transparent; color: #9c9ca2;
            border-radius: 16px; cursor: pointer; font-size: 23px; transition: .18s ease; }
        .komi-side-button:hover,.komi-side-button.active { background: #222225; border-color: #353539; color: white; transform: translateY(-1px); }
        .komi-side-button.active { box-shadow: inset 3px 0 #fa4552; }
        .komi-side-button span { position: absolute; left: 60px; top: 50%; transform: translateY(-50%);
            background: #202023; color: #fff; border: 1px solid #38383b; border-radius: 9px;
            padding: 8px 11px; white-space: nowrap; font-size: 12px; font-weight: 700;
            opacity: 0; visibility: hidden; pointer-events: none; transition: .15s ease; }
        .komi-side-button:hover span { opacity: 1; visibility: visible; }
        .komi-side-account { background: #17171a; color: #ff4b57; }
        body > header { left: var(--komi-rail-width); width: calc(100% - var(--komi-rail-width)); }
        .app-layout { margin-left: var(--komi-rail-width); width: calc(100% - var(--komi-rail-width)); }
        #navHomeBtn,#navCatalogBtn,#headerRandomBtn,#headerPartyBtn { display: none !important; }
        @media (max-width: 680px) {

                border-right: 0; border-top: 1px solid #2b2b2f; }
            .komi-side-logo { display: none; }

            .komi-side-bottom { flex-direction: row; width: auto; margin-top: 0; margin-left: 9px; gap: 9px; }

        @media (max-width: 768px) { #notifDropdown { top: auto; bottom: 76px; left: 12px; right: 12px; } }
        /* Transparent centered header with right-aligned search. */
        header { background: transparent !important; backdrop-filter: none !important; border-bottom: 0 !important; }
        .header-inner { max-width: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; }
        .logo-area { grid-column: 2; grid-row: 1; justify-self: center; }
        .search-container { grid-column: 3; grid-row: 1; justify-self: end; width: min(100%, 480px); flex: none; }
        .search-bar input { height: 48px; border-radius: 28px; padding-left: 46px; font-size: 14px; background: rgba(23,23,27,.55); border-color: rgba(255,255,255,.12); backdrop-filter: blur(18px); }
        .search-bar svg { left: 17px; width: 18px; height: 18px; }

async function loadDataFromCloud() {
    try {
        if (!_supabase) throw new Error('Supabase не подключён');

        const settingsPromise = _supabase
            .from('animes').select('id,content').in('id', [2, 3, 4, 5, 6, 7]);
        const catalog = [];
        const pageSize = 100;
        let offset = 0;
        while (true) {
            const { data: rows, error } = await _supabase
                .from('anime_catalog').select('shikimori_id,data')
                .order('shikimori_id', { ascending: true })
                .range(offset, offset + pageSize - 1);
            if (error) throw error;
            if (!rows || rows.length === 0) break;
            for (const row of rows) {
                const anime = row.data;
                if (!anime || typeof anime !== 'object') continue;
                catalog.push({
                    ...anime,
                    id: String(row.shikimori_id),
                    shikimoriId: Number(row.shikimori_id),
                    title: anime.title || anime.originalTitle || 'Без названия',
                    poster: anime.poster || '',
                    shikiRating: anime.shikiRating || 0,
                    genres: Array.isArray(anime.genres) ? anime.genres : [],
                    episodes: Array.isArray(anime.episodes) ? anime.episodes : []
                });
            }
            offset += rows.length;
            // Make the first results visible without waiting for all pages.
            if (offset === rows.length && catalog.length > 0) {
                animeList = catalog.slice();
                render();
            }
            if (rows.length < pageSize) break;
        }
        const { data: settings, error: settingsError } = await settingsPromise;
        if (settingsError) console.warn('Ошибка настроек:', settingsError.message);
        for (const row of settings || []) {
            let value;
            try { value = JSON.parse(row.content || 'null'); } catch { continue; }
            if (row.id === 2) animeComments = value || {};
            if (row.id === 3) userAnimeStatuses = { ...userAnimeStatuses, ...(value || {}) };
            if (row.id === 4) userProfiles = { ...userProfiles, ...(value || {}) };
            if (row.id === 4 && currentUser) {
                const name = currentUser.username;
                const avatar = localStorage.getItem('komi_avatar_' + name);
                if (avatar && (!userProfiles[name]?.avatar || userProfiles[name].avatar.startsWith('https://api.dicebear.com/'))) userProfiles[name] = { ...(userProfiles[name] || {}), avatar };
            }
            if (row.id === 5) userNotifications = value || {};
            if (row.id === 6) activePartiesList = value || [];
            if (row.id === 7) userFriends = { ...userFriends, ...(value || {}) };
        }

        animeList = catalog;
        console.log(`Komi Anime Hub: загружено ${animeList.length} аниме из anime_catalog`);
    } catch (err) {
        console.error('Ошибка загрузки каталога:', err);
        // Preserve already displayed records on a network error.
    }
    render();
    updateNotificationsUI();
}

            if (!_supabase) return;

                await _supabase.from('online_users').upsert({ 
                    session_id: myUniqueKey, 
                    username: currentName, 
                    last_seen: now 
                }, { onConflict: 'session_id' });

                const expireTime = now - 10000;
                await _supabase.from('online_users').delete().lt('last_seen', expireTime);

                const { data: cloudSyncData } = await _supabase.from('animes').select('*').in('id', [5, 6, 7]);
                if (cloudSyncData) {
                    cloudSyncData.forEach(row => {
                        if (row.id === 5) userNotifications = JSON.parse(row.content || '{}');
                        if (row.id === 6) activePartiesList = JSON.parse(row.content || '[]');
                        if (row.id === 7) {

                            userFriends = { ...userFriends, ...cloudFriends };
                        }
                    });
                    updateNotificationsUI();
                }

                const { data } = await _supabase.from('online_users').select('*');
                if (data) {
                    const uniqueUsersMap = new Map();
                    data.forEach(item => uniqueUsersMap.set(item.username, item));
                    globalAllOnlineUsersList = Array.from(uniqueUsersMap.values());

                    const count = globalAllOnlineUsersList.length || 1;
                    const el = document.getElementById('onlineCountText');
                    if (el) el.innerText = `Онлайн: ${count}`;
                }
            } catch(e) {
                const el = document.getElementById('onlineCountText');
                if (el) el.innerText = `Онлайн: 1`;
            }
        }

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

                    currentSlideIndex = (currentSlideIndex + 1) % maxSlides;
                    updateHeroSlideView();
                }
            }, 6000);
        }

        function changeSlide(direction) {
            const maxSlides = Math.min(animeList.length, 5);
            currentSlideIndex = (currentSlideIndex + direction + maxSlides) % maxSlides;
            updateHeroSlideView();
            startHeroAutoSlide();
        }

        function setSlide(index) {
            currentSlideIndex = index;
            updateHeroSlideView();
            startHeroAutoSlide();

        function updateHeroSlideView() {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.hero-dot');
            slides.forEach((slide, idx) => {
                if (idx === currentSlideIndex) slide.classList.add('active');
                else slide.classList.remove('active');
            });
            dots.forEach((dot, idx) => {
                if (idx === currentSlideIndex) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

            const statsCounts = { 'Просмотрено': 0, 'В планах': 0, 'Смотрю': 0, 'Отложено': 0, 'Брошено': 0, 'Любимые': 0 };

        let uploadedAvatarBase64 = null;

        function handleAvatarFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('Выбери изображение.'); return; }
            uploadedAvatarBase64 = null;
            avatarUploadPromise = new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Не удалось открыть изображение'));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(1, 320 / Math.max(img.width, img.height));
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        uploadedAvatarBase64 = canvas.toDataURL('image/jpeg', 0.78);
                        resolve();
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
            avatarUploadPromise.catch(e => alert(e.message));
        }

        async function uploadAvatarToStorage(dataUrl, username) {
            if (!_supabase) return null;
            try {
                const blob = await (await fetch(dataUrl)).blob();
                const filename = encodeURIComponent(username) + '-' + Date.now() + '.jpg';
                const { error } = await _supabase.storage.from('avatars').upload(filename, blob, {
                    contentType: 'image/jpeg', upsert: false, cacheControl: '3600'
                });
                if (error) { console.warn('Avatar Storage:', error.message); return null; }
                const { data } = _supabase.storage.from('avatars').getPublicUrl(filename);
                return data?.publicUrl || null;
            } catch (err) { console.warn('Avatar Storage:', err); return null; }
        }

        async function updateUserProfile() {
            if (!currentUser) return;
            try {
                if (avatarUploadPromise) await avatarUploadPromise;
                const name = currentUser.username;
                const status = (document.getElementById('newStatusText')?.value || '').trim();
                if (!userProfiles[name]) userProfiles[name] = { regDate: new Date().toLocaleDateString('ru-RU') };
                if (uploadedAvatarBase64) {
                    const publicAvatar = await uploadAvatarToStorage(uploadedAvatarBase64, name);
                    userProfiles[name].avatar = publicAvatar || uploadedAvatarBase64;
                    // Keep a device-local recovery copy until public cloud storage is verified.
                    localStorage.setItem('komi_avatar_' + name, uploadedAvatarBase64);
                }
                if (status) userProfiles[name].status = status;
                const result = await saveProfilesToCloud();
                if (result?.error) {
                    // Only a device-local fallback if the shared profile write fails.
                    if (uploadedAvatarBase64) localStorage.setItem('komi_avatar_' + name, uploadedAvatarBase64);
                    alert('Не удалось сохранить аватар для всех пользователей: ' + result.error.message + '. Проверь доступ к Supabase.');
                } else {
                    alert('Профиль обновлён. Аватар сохранён; отображение другим пользователям зависит от доступности общего хранилища.');
                }
                uploadedAvatarBase64 = null;

                saveData();
                render();

        async function createWatchPartyRoom() {
            if (!currentUser) return;
            const animeId = document.getElementById('partyAnimeSelect').value;
            const roomName = document.getElementById('partyRoomName').value.trim() || ('Комната ' + currentUser.username);
            const roomType = document.getElementById('partyRoomType').value;

            activeWatchPartyRoom = {
                id: 'room_' + Date.now(),
                name: roomName,
                host: currentUser.username,
                animeId: animeId,
                type: roomType,
                currentTime: 0,
                isPlaying: false,
                season: 1,
                epIdx: 0,
                members: [currentUser.username],
                chat: [{ author: 'Система', text: `${currentUser.username} создал Watch Party.` }]
            };

            if (roomType === 'public') {
                activePartiesList.push(activeWatchPartyRoom);
            }

            await savePartiesToCloud();
            closeWatchPartyModal();
            openActiveWatchPartyRoom();
        }

        async function joinWatchPartyRoom(roomId) {
            if (!currentUser) { openAuthModal('login'); return; }
            
            if (_supabase) {
                try {
                    const { data } = await _supabase.from('animes').select('*').eq('id', 6).single();
                    if (data && data.content) {
                        activePartiesList = JSON.parse(data.content);
                    }
                } catch(e) {}
            }

            let room = activePartiesList.find(r => r.id === roomId);
            if (!room && activeWatchPartyRoom && activeWatchPartyRoom.id === roomId) {
                room = activeWatchPartyRoom;
            }
            if (!room) { alert('Комната не найдена!'); return; }

            activeWatchPartyRoom = room;
            if (!activeWatchPartyRoom.members.includes(currentUser.username)) {
                activeWatchPartyRoom.members.push(currentUser.username);
                activeWatchPartyRoom.chat.push({ author: 'Система', text: `${currentUser.username} присоединился.` });
                await savePartiesToCloud();
            }

            closeWatchPartyModal();
            openActiveWatchPartyRoom();
        }

        async function deleteActiveWatchParty() {
            if (!activeWatchPartyRoom || !currentUser) return;
            if (activeWatchPartyRoom.host !== currentUser.username) {
                alert('Только хост может удалить комнату!');
                return;
            }

            if (confirm('Удалить эту комнату?')) {
                activePartiesList = activePartiesList.filter(r => r.id !== activeWatchPartyRoom.id);
                await savePartiesToCloud();
                leaveWatchPartyRoom();
                alert('Комната удалена.');
            }
        }

        function inviteFriendToParty(friendName) {
            if (!activeWatchPartyRoom) { alert('Сначала создайте комнату!'); return; }
            addNotification(friendName, `${currentUser.username} приглашает вас в Watch Party "${activeWatchPartyRoom.name}"!`, activeWatchPartyRoom.id);
            alert(`Приглашение отправлено пользователю ${friendName}!`);
        }

        function openActiveWatchPartyRoom() {
            if (!activeWatchPartyRoom) return;
            const anime = animeList.find(a => a.id === activeWatchPartyRoom.animeId);
            if (!anime) return;

            const isHost = currentUser && currentUser.username === activeWatchPartyRoom.host;

                        <span style="font-size:10px; color:var(--text-muted);">Аниме: <b>${anime.title}</b> | Хост: <b>${activeWatchPartyRoom.host}</b> ${isHost ? '(Вы - Хост 👑)' : '(Зритель)'}</span>

        async function partyReportTime(video) {
            if (!currentUser || !activeWatchPartyRoom) return;
            if (currentUser.username === activeWatchPartyRoom.host) {
                if (Math.abs(video.currentTime - activeWatchPartyRoom.currentTime) > 1.0) {
                    activeWatchPartyRoom.currentTime = video.currentTime;
                    await savePartiesToCloud();
                }
            }
        }

        async function partyReportState(isPlaying) {
            if (!currentUser || !activeWatchPartyRoom) return;
            if (currentUser.username === activeWatchPartyRoom.host) {
                if (activeWatchPartyRoom.isPlaying !== isPlaying) {
                    activeWatchPartyRoom.isPlaying = isPlaying;
                    await savePartiesToCloud();
                }
            }
        }

        async function sendPartyMessage() {
            const input = document.getElementById('partyMessageInput');
            const text = input ? input.value.trim() : '';
            if (!text || !currentUser || !activeWatchPartyRoom) return;

            activeWatchPartyRoom.chat.push({ author: currentUser.username, text });
            input.value = '';
            await savePartiesToCloud();
            
            const chatBox = document.getElementById('partyChatBox');
            if (chatBox) {
                chatBox.innerHTML = activeWatchPartyRoom.chat.map(c => `<div class="party-chat-msg"><span class="party-chat-author">${c.author}:</span><span>${c.text}</span></div>`).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function sendPartyReaction(emoji) {
            const layer = document.getElementById('flyingEmojiLayer');
            if (!layer) return;

            const span = document.createElement('div');
            span.className = 'flying-emoji';
            span.innerText = emoji;
            span.style.left = Math.random() * 80 + 10 + '%';
            layer.appendChild(span);

            setTimeout(() => { span.remove(); }, 2000);

            if (currentUser && activeWatchPartyRoom) {
                activeWatchPartyRoom.chat.push({ author: 'Реакция', text: `${currentUser.username} отправл(а) ${emoji}` });
                await savePartiesToCloud();
                const chatBox = document.getElementById('partyChatBox');
                if (chatBox) {
                    chatBox.innerHTML = activeWatchPartyRoom.chat.map(c => `<div class="party-chat-msg"><span class="party-chat-author">${c.author}:</span><span>${c.text}</span></div>`).join('');

        function closeSearchDropdown() {
            const dd = document.getElementById('searchDropdown');

            if (!e.target.closest('.search-container')) closeSearchDropdown();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeSearchDropdown(); document.getElementById('searchInput')?.blur(); }
        });

        function showSearchDropdown() {
            const dd = document.getElementById('searchDropdown');
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                handleInstantSearch(query);
            } else {
                let html = `<div style="padding:5px 10px; font-size:10px; color:var(--text-muted);">Популярное</div>`;
                animeList.slice(0, 5).forEach(a => {
                    html += `
                        <div class="search-dropdown-item" onclick="selectAnimeFromSearch('${a.id}')">
                            <img src="${a.poster}" style="width:20px; height:28px; object-fit:cover; border-radius:3px;">
                            <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><b>${a.title}</b></div>
                            <span style="font-size:10px; color:#fbbf24;">⭐ ${a.shikiRating || '8.5'}</span>
                        </div>
                    `;
                });
                dd.innerHTML = html;
                dd.classList.add('active');
            }
        }

        function handleInstantSearch(q) {
            const dd = document.getElementById('searchDropdown');
            if (!q.trim()) {
                showSearchDropdown();
                render();
                return;
            }

            const queryLower = q.toLowerCase();
            const filtered = animeList.filter(a => 
                a.title.toLowerCase().includes(queryLower) || 
                (a.genres && a.genres.some(g => g.toLowerCase().includes(queryLower))) ||
                (a.type && a.type.toLowerCase().includes(queryLower))
            );

            if (filtered.length > 0) {
                dd.innerHTML = filtered.map(a => `
                    <div class="search-dropdown-item" onclick="selectAnimeFromSearch('${a.id}')">
                        <img src="${a.poster}" style="width:22px; height:30px; object-fit:cover; border-radius:3px;" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'">
                        <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                            <b>${a.title}</b>
                            <div style="font-size:10px; color:var(--text-muted);">${(a.genres||[]).join(', ')} • ${a.year || '2026'}</div>
                        </div>
                        <span style="font-size:10px; color:#fbbf24; font-weight:700;">⭐ ${a.shikiRating || '8.5'}</span>
                    </div>
                `).join('');
                dd.classList.add('active');
            } else {
                dd.innerHTML = `<div style="padding:8px 10px; font-size:11px; color:var(--text-muted); text-align:center;">Ничего не найдено</div>`;
                dd.classList.add('active');
            }

            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <h2 style="margin-bottom: 14px; font-size: 16px;">Результаты поиска: "${q}"</h2>
                <div class="anime-grid">${filtered.length === 0 ? '<div class="empty-state"><h3>Ничего не найдено</h3></div>' : filtered.map(a => renderCard(a)).join('')}</div>
            `;
        }

        function selectAnimeFromSearch(id) {
            document.getElementById('searchDropdown').classList.remove('active');
            openWatchModal(id);
        }

        async function searchAnimeFromAPI() {
            const query = document.getElementById('apiSearchTitle').value.trim();
            const resultsContainer = document.getElementById('apiSearchResultsList');
            
            if (!query) { alert('Введите название!'); return; }

            resultsContainer.innerHTML = '<div style="padding: 5px; font-size: 11px; color: var(--text-muted);">Поиск в базе Shikimori...</div>';
            resultsContainer.style.display = 'block';

            try {
                const targetUrl = `https://shikimori.me/api/animes?search=${encodeURIComponent(query)}&limit=6`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Ошибка');

                const data = await response.json();

                if (data && data.length > 0) {
                    resultsContainer.innerHTML = data.map(anime => {
                        const posterUrl = anime.image?.original ? `https://shikimori.me${anime.image.original}` : 'https://cdn.myanimelist.net/images/anime/1122/96435.jpg';
                        const posterPreview = anime.image?.preview ? `https://shikimori.me${anime.image.preview}` : posterUrl;
                        return `
                            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 5px;" 
                                 onmouseover="this.style.background='var(--bg-card-hover)'" onmouseout="this.style.background='transparent'"
                                 onclick="fillFormWithAnimeData(${JSON.stringify({
                                     title: anime.russian || anime.name,
                                     poster: posterUrl,
                                     score: anime.score || '8.5',
                                     year: anime.aired_on ? anime.aired_on.split('-')[0] : '2026',
                                     type: anime.kind === 'movie' ? 'Фильм' : 'Сериал',
                                     synopsis: anime.description || '',
                                     genres: [],
                                     images: [posterUrl]
                                   }).replace(/"/g, '&quot;')})">
                                <img src="${posterPreview}" style="width: 22px; height: 30px; object-fit: cover; border-radius: 3px;">
                                <div style="font-size: 11px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    ${anime.russian || anime.name} (${anime.aired_on ? anime.aired_on.split('-')[0] : 'N/A'})
                                </div>
                                <span style="font-size: 10px; color: #fbbf24;">⭐ ${anime.score || 'N/A'}</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    resultsContainer.innerHTML = '<div style="padding: 5px; font-size: 11px; color: var(--text-muted);">Ничего не найдено.</div>';
                }
            } catch(e) {
                resultsContainer.innerHTML = `<div style="padding: 5px; font-size: 11px; color: #FF454F;">Ошибка соединения с API.</div>`;
            }
        }

        async function importTopSeasonalAnime() {
            const resultsContainer = document.getElementById('apiSearchResultsList');
            resultsContainer.innerHTML = '<div style="padding: 5px; font-size: 11px; color: var(--text-muted);">Импорт из топа Shikimori...</div>';
            resultsContainer.style.display = 'block';

            try {
                const targetUrl = `https://shikimori.me/api/animes?order=popularity&limit=40`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

                const res = await fetch(proxyUrl);
                if (!res.ok) throw new Error('Ошибка');

                const data = await res.json();
                if (data && data.length > 0) {
                    const randomAnime = data[Math.floor(Math.random() * data.length)];
                    const posterUrl = randomAnime.image?.original ? `https://shikimori.me${randomAnime.image.original}` : 'https://cdn.myanimelist.net/images/anime/1122/96435.jpg';
                    fillFormWithAnimeData({
                        title: randomAnime.russian || randomAnime.name,
                        poster: posterUrl,
                        score: randomAnime.score || '8.8',
                        year: randomAnime.aired_on ? randomAnime.aired_on.split('-')[0] : '2026',
                        type: randomAnime.kind === 'movie' ? 'Фильм' : 'Сериал',
                        synopsis: randomAnime.description || 'Популярное аниме.',
                        genres: [],
                        images: [posterUrl]
                    });
                }
            } catch(e) {
                resultsContainer.innerHTML = `<div style="padding: 5px; font-size: 11px; color: #FF454F;">Ошибка загрузки.</div>`;
            }
        }
