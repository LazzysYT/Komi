<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komi Anime Hub — Платформа нового поколения</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='var(--primary)'/><text x='50%' y='55%' font-size='60' font-weight='800' fill='white' font-family='sans-serif' dominant-baseline='middle' text-anchor='middle'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #09090F;
            --bg-card: #151520;
            --bg-input: #1a1a26;
            --primary: #8B3DFF;
            --primary-hover: #722fe6;
            --accent: #B88AFF;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #232336;
            --glow: rgba(139, 61, 255, 0.45);
        }

        body.theme-red { --primary: #EF4444; --primary-hover: #DC2626; --accent: #FCA5A5; --glow: rgba(239, 68, 68, 0.45); }
        body.theme-mint { --primary: #10B981; --primary-hover: #059669; --accent: #6EE7B7; --glow: rgba(16, 185, 129, 0.45); }
        body.theme-blue { --primary: #3B82F6; --primary-hover: #2563EB; --accent: #93C5FD; --glow: rgba(59, 130, 246, 0.45); }
        body.theme-gold { --primary: #F59E0B; --primary-hover: #D97706; --accent: #FDE68A; --glow: rgba(245, 158, 11, 0.45); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-hover); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px var(--glow); }
            50% { box-shadow: 0 0 24px var(--glow); }
            100% { box-shadow: 0 0 10px var(--glow); }
        }

        header {
            background: rgba(9, 9, 15, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            gap: 15px;
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-box {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 24px; color: white;
            animation: neonGlow 3s infinite;
        }
        .logo-box:hover { transform: scale(1.08) rotate(3deg); }
        .logo-text {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .online-counter {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .online-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

        .search-container { position: relative; flex: 0 1 340px; }
        .search-bar input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 16px 12px 44px; color: white; font-size: 14px; outline: none;
        }
        .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
        .search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); fill: var(--text-muted); width: 18px; height: 18px; }

        .search-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 12px; margin-top: 5px; display: none; z-index: 200;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); max-height: 250px; overflow-y: auto;
        }
        .search-dropdown.active { display: block; animation: fadeInUp 0.15s ease; }
        .search-dropdown-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .search-dropdown-item:hover { background: var(--primary); color: white; }

        .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            font-weight: 600; font-size: 14px; cursor: pointer; padding: 8px 14px; border-radius: 10px;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: var(--primary); border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }

        .action-icon-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: white;
            padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; position: relative;
        }
        .action-icon-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); transform: translateY(-1px); }

        .notification-badge {
            position: absolute; top: -5px; right: -5px; background: #EF4444; color: white;
            font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
        }

        .notification-dropdown {
            position: absolute; top: 115%; right: 0; width: 320px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            display: none; flex-direction: column; z-index: 300; overflow: hidden;
        }
        .notification-dropdown.active { display: flex; animation: fadeInUp 0.15s ease; }
        .notif-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .notif-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; }
        .notif-item { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
        .notif-item:hover { background: rgba(255,255,255,0.03); color: white; }

        .user-pill {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .user-pill:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
        .user-avatar-small { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        .app-layout {
            display: grid; grid-template-columns: 1fr 300px; gap: 30px;
            max-width: 1600px; margin: 0 auto; padding: 30px 40px; flex: 1; width: 100%;
        }

        .right-sidebar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
            padding: 20px; height: fit-content; position: sticky; top: 90px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .sidebar-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
        .sidebar-users-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
        .sidebar-user-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 12px;
            border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .sidebar-user-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); transform: translateX(3px); }
        .sidebar-user-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        main { width: 100%; animation: fadeInUp 0.2s ease; }

        /* Кинематографичный Hero Слайдер */
        .hero-slider-container {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            background: var(--bg-card);
        }
        .hero-slide {
            display: none;
            background-size: cover;
            background-position: center;
            padding: 60px 70px;
            min-height: 480px;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .hero-slide.active {
            display: flex;
            animation: fadeInUp 0.35s ease;
        }
        .hero-slide::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(9,9,15,0.98) 35%, rgba(9,9,15,0.7) 70%, rgba(9,9,15,0.35) 100%),
                        radial-gradient(circle at top right, rgba(139, 61, 255, 0.3), transparent 60%);
            z-index: 1;
        }
        .hero-slide > * { position: relative; z-index: 2; }
        .hero-slide h1 {
            font-size: 48px; font-weight: 800; max-width: 650px; margin-bottom: 16px; line-height: 1.15;
            background: linear-gradient(to right, #FFFFFF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .hero-slide p { color: var(--text-muted); font-size: 15px; max-width: 550px; margin-bottom: 24px; line-height: 1.5; }
        .hero-meta { display: flex; gap: 12px; align-items: center; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 20px; flex-wrap: wrap; }
        .hero-meta span { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px); padding: 5px 12px; border-radius: 8px; color: white; border: 1px solid var(--border); }
        
        .hero-buttons { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

        .btn-glow {
            background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 14px;
            font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 20px var(--glow);
            display: inline-flex; align-items: center; gap: 8px; width: fit-content;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover { background: var(--primary-hover); transform: scale(1.03) translateY(-1px); box-shadow: 0 6px 28px var(--glow); }

        .btn-glow-secondary {
            background: rgba(255, 255, 255, 0.06); color: white; border: 1px solid var(--border); padding: 12px 28px; border-radius: 14px;
            font-weight: 700; font-size: 14px; cursor: pointer; backdrop-filter: blur(10px);
            display: inline-flex; align-items: center; gap: 8px; width: fit-content;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        .btn-glow-secondary:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.12); transform: scale(1.03) translateY(-1px); box-shadow: 0 0 15px var(--glow); }

        .hero-slider-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(21, 21, 32, 0.8);
            border: 1px solid var(--border); color: white; width: 46px; height: 46px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 18px;
            backdrop-filter: blur(8px); transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .hero-slider-arrow:hover { background: var(--primary); border-color: var(--accent); transform: translateY(-50%) scale(1.08); box-shadow: 0 0 15px var(--glow); }
        .hero-arrow-prev { left: 24px; }
        .hero-arrow-next { right: 24px; }

        .hero-dots {
            position: absolute; bottom: 24px; right: 40px; display: flex; gap: 8px; z-index: 10;
        }
        .hero-dot {
            width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: width 0.2s, background 0.2s;
        }
        .hero-dot.active { width: 32px; border-radius: 5px; background: var(--accent); box-shadow: 0 0 12px var(--glow); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; margin-top: 35px; }
        .section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }

        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 26px; }
        .anime-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
            cursor: pointer; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex; flex-direction: column; position: relative; animation: fadeInUp 0.3s ease;
        }
        .anime-card:hover { transform: translateY(-6px) scale(1.01); border-color: var(--accent); box-shadow: 0 16px 35px var(--glow); }
        .anime-rating-badge {
            position: absolute; top: 12px; left: 12px; background: rgba(9, 9, 15, 0.85); border: 1px solid var(--border);
            color: #fbbf24; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; z-index: 2; backdrop-filter: blur(6px);
        }
        .anime-poster-box { position: relative; width: 100%; height: 330px; overflow: hidden; background: var(--bg-input); }
        .anime-poster { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
        .anime-card:hover .anime-poster { transform: scale(1.06); }
        
        .anime-quick-view {
            position: absolute; inset: 0; background: rgba(9, 9, 15, 0.65); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; z-index: 3;
        }
        .anime-card:hover .anime-quick-view { opacity: 1; }

        .anime-info { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; background: var(--bg-card); z-index: 2; }
        .anime-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .anime-meta-card { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 18px; border: 1px dashed var(--border); }

        .profile-container { max-width: 1300px; margin: 0 auto; width: 100%; animation: fadeInUp 0.2s ease; }
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 30px;
            display: grid; grid-template-columns: 200px 1fr; gap: 30px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .profile-header-card::after {
            content: ''; position: absolute; top: 0; right: 0; width: 200px; height: 200px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%); pointer-events: none; opacity: 0.6;
        }
        .profile-avatar-box { width: 200px; height: 260px; border-radius: 16px; object-fit: cover; border: 2px solid var(--primary); background: var(--bg-input); box-shadow: 0 0 20px var(--glow); }
        .profile-info-grid { display: flex; flex-direction: column; gap: 12px; }
        .profile-name-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .profile-name-row h2 { font-size: 24px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        
        .profile-stats-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            display: flex; overflow-x: auto; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .profile-stat-tab {
            flex: 1; min-width: 110px; padding: 14px 10px; text-align: center; cursor: pointer; border-right: 1px solid var(--border);
            background: var(--bg-card); font-size: 13px; font-weight: 700; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px;
        }
        .profile-stat-tab:last-child { border-right: none; }
        .profile-stat-tab:hover { background: rgba(255,255,255,0.05); color: white; }
        .profile-stat-tab.active { background: var(--primary); color: white; box-shadow: inset 0 0 12px rgba(0,0,0,0.3); }
        .profile-stat-tab .num { font-size: 16px; font-weight: 800; }

        .profile-layout-grid { display: grid; grid-template-columns: 1fr 280px; gap: 25px; align-items: start; }
        .profile-main-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; }
        .profile-sidebar-menu { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
        .profile-menu-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px;
            font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: white;
        }
        .profile-menu-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); }

        .profile-anime-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .profile-anime-table th, .profile-anime-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        .profile-anime-table th { color: var(--text-muted); font-weight: 600; }
        .profile-anime-table tr:hover { background: rgba(255,255,255,0.03); }

        .profile-wall-section { margin-top: 25px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
        .wall-message-item { background: var(--bg-input); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .wall-message-author { font-size: 13px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .wall-message-author img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
        .wall-message-text { font-size: 13px; color: var(--text-main); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #0e0e16; border: 1px solid var(--border); border-radius: 22px;
            width: 96%; max-width: 1400px; padding: 30px; max-height: 94vh; overflow-y: auto;
            position: relative; box-shadow: 0 30px 70px rgba(0,0,0,0.95); animation: modalScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-close {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.06);
            border: 1px solid var(--border); color: white; width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .modal-close:hover { background: rgba(255,255,255,0.15); border-color: var(--accent); transform: rotate(90deg); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: white; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        .catalog-filters-box {
            background: var(--bg-card); border: 1px solid var(--border); padding: 22px; border-radius: 18px;
            margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
        }

        .watch-cinema-layout { display: flex; flex-direction: column; gap: 24px; }
        .crunchy-hero-section {
            display: flex; gap: 24px; background: linear-gradient(135deg, #151520 0%, #1a1a26 100%);
            border: 1px solid var(--border); border-radius: 20px; padding: 26px; align-items: center;
        }
        .crunchy-hero-poster { width: 160px; height: 220px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); }
        .crunchy-hero-info { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .crunchy-hero-info h1 { font-size: 28px; font-weight: 800; color: white; }
        
        .player-wrapper { position: relative; width: 100%; }
        .player-box { background: #000; border-radius: 18px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.85); }

        async function loadDataFromCloud() {
            try {
                const { data } = await _supabase.from('animes').select('*');
                if (data && data.length > 0) {
                    for(let row of data) {
                        if (row.id === 1) animeList = JSON.parse(row.content || '[]');
                        if (row.id === 2) animeComments = JSON.parse(row.content || '{}');
                        if (row.id === 3) {
                            const cloudStatuses = JSON.parse(row.content || '{}');
                            userAnimeStatuses = { ...userAnimeStatuses, ...cloudStatuses };
                        }
                        if (row.id === 4) {
                            const cloudProfiles = JSON.parse(row.content || '{}');
                            userProfiles = { ...userProfiles, ...cloudProfiles };
                        }
                    }
                }
                if (animeList.length === 0) {
                    animeList = defaultAnime;
                    await _supabase.from('animes').upsert({ id: 1, content: JSON.stringify(animeList) });
                }
            } catch(err) {
                animeList = defaultAnime;
            }
            render();
            updateNotificationsUI();
        }

            await _supabase.from('animes').upsert({ id: 1, content: JSON.stringify(animeList) });
            render();
        }

        async function saveCommentsToCloud() {
            await _supabase.from('animes').upsert({ id: 2, content: JSON.stringify(animeComments) });
        }

        async function saveStatusesToCloud() {

        async function saveProfilesToCloud() {

            } catch(e) {}
        }

        async function updateOnlinePresence() {
            if (onlineTimerRunning) return;
            onlineTimerRunning = true;
            try {
                const now = Date.now();
                const currentName = currentUser ? currentUser.username : ('Гость_' + myUniqueKey.slice(0,4));
                
                await _supabase.from('online_users').upsert({ 
                    session_id: myUniqueKey, 
                    username: currentName, 
                    last_seen: now 
                }, { onConflict: 'session_id' });

                const expireTime = now - 10000;
                await _supabase.from('online_users').delete().lt('last_seen', expireTime);

                const { data } = await _supabase.from('online_users').select('*');
                if (data) {
                    const uniqueUsersMap = new Map();
                    data.forEach(item => uniqueUsersMap.set(item.username, item));
                    const uniqueOnlineList = Array.from(uniqueUsersMap.values());

                    const count = uniqueOnlineList.length || 1;
                    const el = document.getElementById('onlineCountText');
                    if (el) el.innerText = `Онлайн: ${count}`;
                    renderSidebarLists(uniqueOnlineList);
                }
                if (currentView === 'profile') render();
            } catch(e) {
                const el = document.getElementById('onlineCountText');
                if (el) el.innerText = `Онлайн: 1`;
                renderSidebarLists([{ username: currentUser ? currentUser.username : 'Гость' }]);
            }
            setTimeout(() => { onlineTimerRunning = false; }, 3000);
        }

        setInterval(updateOnlinePresence, 3000);
        updateOnlinePresence();

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function calculateAverageRating(anime) {
            if (!anime.ratings || Object.keys(anime.ratings).length === 0) return '8.5';
            const values = Object.values(anime.ratings);
            return (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1);

        async function autoFillFromAPI() {
            const query = document.getElementById('apiSearchTitle').value.trim();
            if (!query) { alert('Введите название для поиска!'); return; }
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=1`);
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    const anime = data.data[0];
                    document.getElementById('animeTitle').value = anime.title || '';
                    document.getElementById('animePoster').value = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
                    
                    let shots = [];
                    if (anime.images?.jpg?.large_image_url) shots.push(anime.images.jpg.large_image_url);
                    if (anime.trailer?.images?.maximum_image_url) shots.push(anime.trailer.images.maximum_image_url);
                    else if (anime.trailer?.images?.large_image_url) shots.push(anime.trailer.images.large_image_url);
                    if (anime.images?.jpg?.image_url) shots.push(anime.images.jpg.image_url);

                    document.getElementById('animeScreenshots').value = shots.join(', ');

                    if (anime.genres && anime.genres.length > 0) {
                        const fetchedGenres = anime.genres.map(g => g.name.toLowerCase());
                        document.querySelectorAll('.genre-checkbox').forEach(cb => {
                            if (fetchedGenres.includes(cb.value.toLowerCase())) cb.checked = true;
                        });
                    }
                    document.getElementById('animeYear').value = anime.year || (anime.aired?.from ? new Date(anime.aired.from).getFullYear() : '2026');
                    document.getElementById('animeType').value = anime.type || 'Сериал';
                    document.getElementById('animeDesc').value = anime.synopsis || '';
                    alert('Данные успешно загружены!');
                } else {
                    alert('Ничего не найдено в базе MyAnimeList.');
                }
            } catch(e) {
                alert('Ошибка при запросе к API.');
            }
        }

        async function saveAnimeForm(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnimeId').value;
            const title = document.getElementById('animeTitle').value;
            const poster = document.getElementById('animePoster').value;
            const screenshotsInput = document.getElementById('animeScreenshots').value.trim();
            const trailer = document.getElementById('animeTrailer').value;
            const year = document.getElementById('animeYear').value || '2026';
            const type = document.getElementById('animeType').value || 'Сериал';
            const desc = document.getElementById('animeDesc').value;

            let screenshots = screenshotsInput ? screenshotsInput.split(',').map(s => s.trim()).filter(Boolean) : [poster, poster, poster, poster];
            if (screenshots.length === 0) screenshots = [poster];

            const selectedGenres = [];
            document.querySelectorAll('.genre-checkbox:checked').forEach(cb => selectedGenres.push(cb.value));
            const genres = selectedGenres.length > 0 ? selectedGenres : ['Экшен'];

            const episodes = [];
            const seasonsInputs = document.querySelectorAll('.ep-season');
            const titles = document.querySelectorAll('.ep-title');
            const voicesInputs = document.querySelectorAll('.ep-voices');
            const qualities = document.querySelectorAll('.ep-quality');
            const urls = document.querySelectorAll('.ep-url');
            
            for(let i=0; i<titles.length; i++) {
                episodes.push({ 
                    season: parseInt(seasonsInputs[i].value) || 1, 
                    title: titles[i].value, 
                    voices: voicesInputs[i].value,
                    quality: qualities[i].value,
                    url: urls[i].value 
                });
            }

            if (editId) {
                const anime = animeList.find(a => a.id === editId);
                if (anime) Object.assign(anime, { title, poster, screenshots, trailer, genres, genre: genres[0], year, type, desc, episodes });
            } else {
                animeList.push({ id: 'anime_' + Date.now(), title, poster, screenshots, trailer, genres, genre: genres[0], year, type, desc, episodes, ratings: {} });
            }

            await saveAnimeToCloud();
            closeAddModal();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value;
            if (!usernameInput || !passwordInput) return;

            const passwordHash = await hashPassword(passwordInput);
            const matchedKey = Object.keys(registeredUsers).find(k => k.toLowerCase() === usernameInput.toLowerCase());

            if (matchedKey && registeredUsers[matchedKey] === passwordHash) {
                currentUser = { username: matchedKey };
                saveData();
                closeAuthModal();
                render();
            } else {
                alert('Неверное имя пользователя или пароль!');
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('regUsername').value.trim();
            const passwordInput = document.getElementById('regPassword').value;
            if (!usernameInput || !passwordInput) return;

            const lowerInput = usernameInput.toLowerCase();
            const isTaken = Object.keys(registeredUsers).some(k => k.toLowerCase() === lowerInput);

            if (isTaken) {
                alert('Аккаунт с таким именем уже зарегистрирован!');
                return;
            }

            const passwordHash = await hashPassword(passwordInput);
            registeredUsers[usernameInput] = passwordHash;
            currentUser = { username: usernameInput };

            const nowStr = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            userProfiles[usernameInput] = { 
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${usernameInput}`, 
                status: 'Новичок на платформе ⭐',
                regDate: nowStr
            };

            await saveProfilesToCloud();
            saveData();
            closeAuthModal();
            render();
            alert('Аккаунт успешно создан!');
        }

        async function openWatchModal(id, selectedSeason = null, selectedEpIdx = 0, selectedVoice = null, selectedQuality = null) {
            siteStats.views++;
            saveData();
            
            try {
                const { data } = await _supabase.from('animes').select('*').in('id', [2, 4]);
                if (data) {
                    data.forEach(row => {
                        if (row.id === 2) animeComments = JSON.parse(row.content || '{}');
                        if (row.id === 4) userProfiles = { ...userProfiles, ...JSON.parse(row.content || '{}') };
                    });
                }
            } catch(e) {}

            const anime = animeList.find(a => a.id === id);
            if (!anime || !anime.episodes || anime.episodes.length === 0) return;

            const seasonsMap = {};
            anime.episodes.forEach((ep, idx) => {
                const s = ep.season || 1;
                if (!seasonsMap[s]) seasonsMap[s] = [];
                seasonsMap[s].push({ ...ep, originalIdx: idx });
            });

            const seasonNumbers = Object.keys(seasonsMap).map(Number).sort((a,b) => a - b);
            const activeSeason = selectedSeason !== null && seasonsMap[selectedSeason] ? selectedSeason : seasonNumbers[0];
            const currentSeasonEpisodes = seasonsMap[activeSeason];

            const currentEpForVoices = currentSeasonEpisodes[selectedEpIdx] || currentSeasonEpisodes[0];
            const rawVoicesStr = currentEpForVoices.voices || currentEpForVoices.voice || 'AniLibria';
            const availableVoices = rawVoicesStr.split(',').map(v => v.trim()).filter(Boolean);
            const activeVoice = selectedVoice && availableVoices.includes(selectedVoice) ? selectedVoice : availableVoices[0];

            const availableQualities = [...new Set(currentSeasonEpisodes.map(ep => ep.quality || '1080p'))];
            const activeQuality = selectedQuality && availableQualities.includes(selectedQuality) ? selectedQuality : availableQualities[0];

            const finalEpList = currentSeasonEpisodes.filter(ep => (ep.quality || '1080p') === activeQuality);
            const currentEp = finalEpList[selectedEpIdx] || finalEpList[0] || currentSeasonEpisodes[0];

            const comments = animeComments[anime.id] || [];
            const userHistoryKey = currentUser ? `${currentUser.username}_${anime.id}` : null;
            const savedTime = userHistoryKey ? (userWatchHistory[userHistoryKey] || 0) : 0;
            const userFavCategory = currentUser ? ((userFavorites[currentUser.username] || {})[anime.id] || '') : '';
            const avgRating = calculateAverageRating(anime);
            const myCurrentStatus = currentUser && userAnimeStatuses[currentUser.username] ? (userAnimeStatuses[currentUser.username][anime.id] || '') : '';
            const myRatingVal = currentUser && anime.ratings ? (anime.ratings[currentUser.username] || 'нет') : 'нет';
            
            const customFolders = currentUser ? (userCustomFolders[currentUser.username] || {}) : {};
            const screenshots = (anime.screenshots && anime.screenshots.length > 0) ? anime.screenshots : [anime.poster, anime.poster, anime.poster, anime.poster];

            document.getElementById('watchModalContent').innerHTML = `
                <button class="modal-close" onclick="playSound(); closeWatchModal()">&times;</button>
                <div class="watch-cinema-layout">
                    <div class="crunchy-hero-section">
                        <img src="${anime.poster}" class="crunchy-hero-poster" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'">
                        <div class="crunchy-hero-info">
                            <span style="font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;">Вы смотрите аниме</span>
                            <h1>${anime.title}</h1>
                            <p style="color:var(--text-muted); font-size:13px; line-height:1.4;">${anime.desc || ''}</p>
                            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:5px;">
                                <span style="color:#fbbf24; font-weight:700;">⭐ ${avgRating} MAL</span>
                                <span style="background:rgba(255,255,255,0.08); padding:3px 10px; border-radius:6px; font-size:12px;">${(anime.genres||[]).join(', ')}</span>
                                <span style="background:rgba(255,255,255,0.08); padding:3px 10px; border-radius:6px; font-size:12px;">${anime.year || '2026'}</span>
                                <button class="btn-secondary" style="padding:6px 14px; font-size:12px;" onclick="playSound(); toggleFavorite('${anime.id}', 'Любимые')">⭐ ${userFavCategory ? 'В избранном' : 'В избранное'}</button>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:10px 14px; border-radius:12px;">
                        <span style="font-size:12px; color:var(--text-muted);">Статус:</span>
                        ${['Смотрю', 'В планах', 'Просмотрено', 'Отложено', 'Брошено'].map(st => `
                            <button class="season-tab-btn ${myCurrentStatus === st ? 'active' : ''}" onclick="playSound(); setAnimeStatus('${anime.id}', '${st}')">${st}</button>
                        `).join('')}
                    </div>

                    ${Object.keys(customFolders).length > 0 ? `
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:10px 14px; border-radius:12px;">
                            <span style="font-size:12px; color:var(--text-muted);">Ваши папки:</span>
                            ${Object.keys(customFolders).map(fname => {
                                const inFolder = (customFolders[fname] || []).includes(anime.id);
                                return `<button class="season-tab-btn ${inFolder ? 'active' : ''}" onclick="playSound(); addToCustomFolder('${anime.id}', '${fname}')">📁 ${fname} ${inFolder ? '✓' : ''}</button>`;
                            }).join('')}
                        </div>
                    ` : ''}

                    <div class="player-wrapper">
                        <div class="player-box">
                            <video id="animeVideoPlayer" controls preload="metadata" playsinline style="width:100%; height:100%;" ontimeupdate="saveProgress('${anime.id}', this)" onended="playNextEp('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')" onerror="handleVideoError()">
                                <source src="${currentEp ? currentEp.url : ''}" type="video/mp4">
                                Ваш браузер не поддерживает видео.
                            </video>
                        </div>
                        <button class="skip-intro-btn" id="skipIntroBtn" onclick="playSound(); skipIntro()">Пропустить опенинг ⏭</button>
                    </div>

                    <div class="anime-screenshots-section">
                        <h3 style="font-size:13px; color:var(--text-main); margin-bottom:4px;">🖼️ Кадры из аниме</h3>
                        <div class="screenshots-grid">
                            ${screenshots.map(sc => `<img src="${sc}" class="screenshot-thumb" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'" onclick="playSound(); window.open('${sc}', '_blank')">`).join('')}
                        </div>
                    </div>

                    <div id="videoErrorMsg" style="display:none; color:#fca5a5; font-size:13px; background:rgba(239,68,68,0.15); padding:10px; border-radius:8px; border:1px solid rgba(239,68,68,0.3);">
                        ⚠️ Не удалось загрузить видео. Убедитесь, что ссылка является прямой ссылкой на видеофайл (.mp4).
                    </div>

                    <div style="display:flex; gap:15px; background:var(--bg-input); padding:12px 16px; border-radius:12px; align-items:center; flex-wrap:wrap;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-size:13px; color:var(--text-muted);">Озвучка:</span>
                            ${availableVoices.map(v => `<button class="season-tab-btn ${v === activeVoice ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${v}', '${activeQuality}')">${v}</button>`).join('')}
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-size:13px; color:var(--text-muted);">Качество:</span>
                            ${availableQualities.map(q => `<button class="season-tab-btn ${q === activeQuality ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${q}')">${q}</button>`).join('')}
                        </div>
                    </div>

                    <div class="crunchy-episodes-section">
                        <div class="season-tabs">
                            ${seasonNumbers.map(s => `
                                <button class="season-tab-btn ${s === activeSeason ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${s}, 0, '${activeVoice}', '${activeQuality}')">
                                    Сезон ${s}
                                </button>
                            `).join('')}
                        </div>

                        <h3 style="font-size:16px; font-weight:700; margin-bottom:14px;">Список эпизодов (${finalEpList.length})</h3>
                        <div class="episodes-grid-crunchy">
                            ${finalEpList.map((ep, i) => `
                                <div class="ep-crunchy-card ${i === (selectedEpIdx || 0) ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${i}, '${activeVoice}', '${activeQuality}')">
                                    <div class="ep-crunchy-thumb" style="background-image: url('${anime.poster}'); background-size: cover; background-position: center;">
                                        <div class="ep-crunchy-play-overlay">
                                            <div class="ep-crunchy-play-icon">▶</div>
                                        </div>
                                    </div>
                                    <div class="ep-crunchy-info">
                                        <div class="ep-crunchy-titles">
                                            <div class="ep-crunchy-title">${ep.title || ('Эпизод ' + (i+1))}</div>
                                            <div class="ep-crunchy-desc">${activeVoice} • ${activeQuality}</div>
                                        </div>
                                        <div class="ep-crunchy-time">24 мин</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div style="background:var(--bg-input); padding:12px 16px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                        <span>Реальный рейтинг: <b>⭐ ${avgRating}</b> (Ваша оценка: <span id="myRating">${myRatingVal}</span>)</span>
                        <div style="display:flex; gap:4px;">
                            ${[2,4,6,8,10].map(star => `<button style="background:none; border:none; color:#fbbf24; cursor:pointer; font-size:16px;" onclick="playSound(); rateAnime('${anime.id}', ${star})">⭐${star}</button>`).join('')}
                        </div>
                    </div>

                    <div class="comments-section">
                        <h3>💬 Комментарии (<span id="commentsCount">${comments.length}</span>)</h3>
                        <div style="display:flex; gap:10px; flex-direction:column;">
                            <div style="display:flex; gap:10px;">
                                <input type="text" id="commentInput" class="form-control" placeholder="Написать комментарий...">
                                <button class="btn-glow" onclick="playSound(); addComment('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')">Отправить</button>
                            </div>
                            <label style="font-size:12px; color:var(--text-muted); cursor:pointer;"><input type="checkbox" id="isSpoiler"> Содержит спойлер</label>
                        </div>
                        <div id="commentsListContainer" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                            ${comments.map((c, cIdx) => {
                                const cUserAvatar = (userProfiles[c.username] || {}).avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${c.username}`;
                                return `
                                <div class="comment-item">
                                    <div class="comment-author" onclick="playSound(); openProfile('${c.username}')">
                                        <img src="${cUserAvatar}" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback'">
                                        <span>${c.username}</span>
                                    </div>
                                    <div class="comment-text">${c.spoiler ? `<span class="spoiler-text" onclick="this.classList.toggle('revealed')">⚠️ Спойлер (нажмите чтобы открыть) <span style="color:transparent">${c.text}</span></span>` : c.text}</div>
                                    <div class="comment-reactions">
                                        ${['🔥', '❤️', '😂', '🤡'].map(emoji => {
                                            const count = (c.reactions && c.reactions[emoji]) ? c.reactions[emoji].length : 0;
                                            const myUser = currentUser ? currentUser.username : null;
                                            const hasMyReaction = myUser && c.reactions && c.reactions[emoji] && c.reactions[emoji].includes(myUser);
                                            return `
                                                <button class="reaction-btn ${hasMyReaction ? 'active' : ''}" onclick="playSound(); reactComment('${anime.id}', ${cIdx}, '${emoji}')">
                                                    <span>${emoji}</span> <span>${count}</span>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            `;}).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('watchModal').classList.add('active');

            const v = document.getElementById('animeVideoPlayer');
            if (v && savedTime > 0) {
                v.currentTime = savedTime;
                v.play().catch(() => {});
            }
        }

        function handleVideoError() {
            const errBox = document.getElementById('videoErrorMsg');
            if (errBox) errBox.style.display = 'block';
        }

        function skipIntro() {
            const v = document.getElementById('animeVideoPlayer');
            if (v) v.currentTime += 85;
        }

        function saveProgress(id, video) {
            if (!currentUser) return;
            const key = `${currentUser.username}_${id}`;
            userWatchHistory[key] = video.currentTime;
            saveData();
        }

        function playNextEp(id, season, currentIdx, voice, quality) {
            openWatchModal(id, season, currentIdx + 1, voice, quality);
        }

        async function rateAnime(id, score) {
            if (!currentUser) { openAuthModal('login'); return; }
            const anime = animeList.find(a => a.id === id);
            if (!anime) return;
            if (!anime.ratings) anime.ratings = {};
            anime.ratings[currentUser.username] = score;
            await saveAnimeToCloud();
            document.getElementById('myRating').innerText = score;
            openWatchModal(id);
        }

        async function addComment(id, season, epIdx, voice, quality) {
            if (!currentUser) { openAuthModal('login'); return; }
            const text = document.getElementById('commentInput').value.trim();
            const spoiler = document.getElementById('isSpoiler').checked;
            if (!text) return;
            
            if (!animeComments[id]) animeComments[id] = [];
            animeComments[id].unshift({ username: currentUser.username, text, spoiler, reactions: {} });
            
            await saveCommentsToCloud();
            openWatchModal(id, season, epIdx, voice, quality);
        }

        async function reactComment(id, cIdx, emoji) {
            if (!currentUser) { openAuthModal('login'); return; }
            const username = currentUser.username;
            if (!animeComments[id] || !animeComments[id][cIdx]) return;

            const comment = animeComments[id][cIdx];
            if (!comment.reactions) comment.reactions = {};

            Object.keys(comment.reactions).forEach(em => {
                if (comment.reactions[em]) {
                    comment.reactions[em] = comment.reactions[em].filter(u => u !== username);
                }
            });

            if (!comment.reactions[emoji]) comment.reactions[emoji] = [];
            const userIndex = comment.reactions[emoji].indexOf(username);
            
            if (userIndex > -1) {
                comment.reactions[emoji].splice(userIndex, 1);
            } else {
                comment.reactions[emoji].push(username);
            }

            await saveCommentsToCloud();
            openWatchModal(id);
        }

        loadDataFromCloud();
    </script>
</body>
</html>
