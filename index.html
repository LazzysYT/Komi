<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komi Anime Hub — Платформа нового поколения</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='var(--primary)'/><text x='50%' y='55%' font-size='60' font-weight='800' fill='white' font-family='sans-serif' dominant-baseline='middle' text-anchor='middle'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #0b0b0f;
            --bg-card: #13131a;
            --bg-input: #1a1a24;
            --primary: #EF4444;
            --primary-hover: #DC2626;
            --accent: #FCA5A5;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #232333;
            --glow: rgba(239, 68, 68, 0.4);
        }

        body.theme-purple { --primary: #8B5CF6; --primary-hover: #7c3aed; --accent: #C084FC; --glow: rgba(139, 92, 246, 0.4); }
        body.theme-mint { --primary: #10B981; --primary-hover: #059669; --accent: #6EE7B7; --glow: rgba(16, 185, 129, 0.4); }
        body.theme-blue { --primary: #3B82F6; --primary-hover: #2563EB; --accent: #93C5FD; --glow: rgba(59, 130, 246, 0.4); }
        body.theme-gold { --primary: #F59E0B; --primary-hover: #D97706; --accent: #FDE68A; --glow: rgba(245, 158, 11, 0.4); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px var(--glow); }
            50% { box-shadow: 0 0 25px var(--glow); }
            100% { box-shadow: 0 0 10px var(--glow); }
        }

        header {
            background: rgba(11, 11, 15, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            gap: 15px;
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-box {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 24px; color: white;
            animation: neonGlow 3s infinite;
        }
        .logo-box:hover { transform: scale(1.1) rotate(5deg); }
        .logo-text {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .online-counter {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .online-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

        .search-container { position: relative; flex: 0 1 340px; }
        .search-bar input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 16px 12px 44px; color: white; font-size: 14px; outline: none;
        }
        .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--glow); }
        .search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); fill: var(--text-muted); width: 18px; height: 18px; }

        .search-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 12px; margin-top: 5px; display: none; z-index: 200;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); max-height: 250px; overflow-y: auto;
        }
        .search-dropdown.active { display: block; animation: fadeInUp 0.2s ease; }
        .search-dropdown-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .search-dropdown-item:hover { background: var(--primary); color: white; }

        .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            font-weight: 600; font-size: 14px; cursor: pointer; padding: 8px 14px; border-radius: 10px;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: var(--primary); border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }

        .action-icon-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: white;
            padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .action-icon-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); transform: translateY(-2px); }

        .user-pill {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .user-pill:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
        .user-avatar-small { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        .app-layout {
            display: grid; grid-template-columns: 1fr 300px; gap: 30px;
            max-width: 1600px; margin: 0 auto; padding: 30px 40px; flex: 1; width: 100%;
        }

        .right-sidebar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; height: fit-content; position: sticky; top: 90px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .sidebar-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
        .sidebar-users-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
        .sidebar-user-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 8px 12px;
            border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .sidebar-user-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); transform: translateX(4px); }
        .sidebar-user-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--primary); }

        main { width: 100%; animation: fadeInUp 0.4s ease; }

        .hero-banner {
            border-radius: 24px; overflow: hidden; background-size: cover; background-position: center;
            border: 1px solid var(--border); padding: 50px; display: flex; flex-direction: column;
            justify-content: center; min-height: 420px; margin-bottom: 40px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .hero-banner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(11,11,15,0.95) 40%, rgba(11,11,15,0.6) 75%, rgba(11,11,15,0.3) 100%);
            z-index: 1;
        }
        .hero-banner > * { position: relative; z-index: 2; }
        .hero-banner h1 {
            font-size: 42px; font-weight: 800; max-width: 650px; margin-bottom: 16px; line-height: 1.15;
            background: linear-gradient(to right, #FFFFFF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-banner p { color: var(--text-muted); font-size: 15px; max-width: 550px; margin-bottom: 24px; line-height: 1.5; }
        .hero-meta { display: flex; gap: 12px; align-items: center; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 20px; flex-wrap: wrap; }
        .hero-meta span { background: rgba(255, 255, 255, 0.08); padding: 5px 12px; border-radius: 8px; color: white; border: 1px solid var(--border); }

        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 12px 26px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 20px var(--glow);
            display: inline-flex; align-items: center; gap: 8px; width: fit-content;
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-3px); box-shadow: 0 6px 25px var(--glow); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; margin-top: 35px; }
        .section-title { font-size: 22px; font-weight: 700; }

        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .anime-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
            cursor: pointer; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column; position: relative; animation: fadeInUp 0.5s ease;
        }
        .anime-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent); box-shadow: 0 15px 35px var(--glow); }
        .anime-rating-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--border);
            color: #fbbf24; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; z-index: 2; backdrop-filter: blur(4px);
        }
        .anime-poster { width: 100%; height: 310px; object-fit: cover; background: var(--bg-input); transition: transform 0.5s ease; }
        .anime-card:hover .anime-poster { transform: scale(1.06); }
        .anime-info { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; background: var(--bg-card); z-index: 2; }
        .anime-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .anime-meta-card { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 16px; border: 1px dashed var(--border); }

        /* Стили профиля */
        .profile-container { max-width: 1300px; margin: 0 auto; width: 100%; animation: fadeInUp 0.3s ease; }
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 25px;
            display: grid; grid-template-columns: 200px 1fr; gap: 30px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .profile-avatar-box { width: 200px; height: 260px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border); background: var(--bg-input); }
        .profile-info-grid { display: flex; flex-direction: column; gap: 12px; }
        .profile-name-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .profile-name-row h2 { font-size: 24px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        
        .profile-stats-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            display: flex; overflow: hidden; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .profile-stat-tab {
            flex: 1; padding: 14px 10px; text-align: center; cursor: pointer; border-right: 1px solid var(--border);
            background: var(--bg-card); font-size: 13px; font-weight: 700; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px;
        }
        .profile-stat-tab:last-child { border-right: none; }
        .profile-stat-tab:hover { background: rgba(255,255,255,0.05); color: white; }
        .profile-stat-tab.active { background: var(--primary); color: white; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); }
        .profile-stat-tab .num { font-size: 16px; font-weight: 800; }

        .profile-layout-grid { display: grid; grid-template-columns: 1fr 280px; gap: 25px; align-items: start; }
        .profile-main-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .profile-sidebar-menu { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        .profile-menu-item {
            background: var(--bg-input); border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: white;
        }
        .profile-menu-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); }

        .profile-anime-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .profile-anime-table th, .profile-anime-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        .profile-anime-table th { color: var(--text-muted); font-weight: 600; }
        .profile-anime-table tr:hover { background: rgba(255,255,255,0.03); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #0d0d12; border: 1px solid var(--border); border-radius: 24px;
            width: 95%; max-width: 1250px; padding: 35px; max-height: 92vh; overflow-y: auto;
            position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.95); animation: modalScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-close {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.06);
            border: 1px solid var(--border); color: white; width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .modal-close:hover { background: rgba(255,255,255,0.15); border-color: var(--accent); transform: rotate(90deg); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: white; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        .catalog-filters-box {
            background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 16px;
            margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
        }

        .watch-cinema-layout { display: grid; grid-template-columns: 1fr 380px; gap: 30px; align-items: start; }
        .watch-cinema-layout.theater { grid-template-columns: 1fr; }
        .watch-cinema-layout.theater .watch-sidebar { display: none; }
        .watch-main-col { display: flex; flex-direction: column; gap: 20px; }
        .player-wrapper { position: relative; width: 100%; }
        .player-box { background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .skip-intro-btn {
            position: absolute; bottom: 25px; right: 25px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px);
            border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; z-index: 20; display: none;
        }
        .skip-intro-btn:hover { background: var(--primary); border-color: var(--primary); }

        .watch-sidebar { background: #101015; border: 1px solid var(--border); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 20px; }
        .season-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 5px; }
        .season-tab-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .season-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 10px var(--glow); }

        .episodes-list-grid { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 6px; }
        .ep-card-side {
            background: var(--bg-input); border: 1px solid var(--border); padding: 12px 14px; border-radius: 12px;
            color: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600;
        }
        .ep-card-side:hover, .ep-card-side.active { background: var(--primary); border-color: var(--accent); color: white; }

        .comments-section { background: rgba(255,255,255,0.01); border: 1px solid var(--border); padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; }
        .comment-item { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
        .comment-author { font-weight: 700; font-size: 13px; color: var(--accent); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .comment-reactions { display: flex; gap: 6px; margin-top: 4px; }
        .reaction-btn { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: white; display: flex; align-items: center; gap: 4px; }
        .reaction-btn:hover { border-color: var(--accent); }
        .reaction-btn.active { background: var(--primary); border-color: var(--accent); color: white; }
        .spoiler-text { background: #222; color: #222; border-radius: 4px; cursor: pointer; padding: 2px 6px; user-select: none; }
        .spoiler-text.revealed { background: #333; color: #fff; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { padding: 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        .admin-table th { color: var(--text-muted); font-weight: 600; }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; padding: 20px; }
            .right-sidebar { position: static; margin-top: 20px; }
            .watch-cinema-layout { grid-template-columns: 1fr; }
            .profile-header-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
            .profile-layout-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            header { padding: 12px 16px; flex-direction: column; align-items: stretch; gap: 10px; }
            .logo-area { justify-content: space-between; }
            .search-container { flex: 1; max-width: 100%; }
            .nav-actions { justify-content: center; }
            .hero-banner { padding: 25px; min-height: 320px; }
            .hero-banner h1 { font-size: 28px; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
            .anime-poster { height: 230px; }
            .modal-content { padding: 20px 15px; width: 100%; max-height: 95vh; border-radius: 16px; }
        }
    </style>
</head>
<body class="theme-default">

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-container" onclick="playSound(); navigate('home')">
                <div class="logo-box">K</div>
                <div class="logo-text">Komi Anime</div>
            </div>
            <div class="online-counter">
                <div class="online-dot"></div>
                <span id="onlineCountText">Онлайн: 1</span>
            </div>
        </div>
        
        <div class="search-container">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Поиск аниме, жанров..." oninput="handleSearchInput(this.value)" onfocus="showSearchDropdown()">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <div class="nav-actions">
            <button class="nav-btn" id="navHomeBtn" onclick="playSound(); navigate('home')">Главная</button>
            <button class="nav-btn" id="navCatalogBtn" onclick="playSound(); navigate('catalog')">Каталог</button>
            <button class="action-icon-btn" onclick="playSound(); randomAnime()">🎲 Мне повезет</button>

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        let defaultAnime = [
            {
                id: 'anime_1',
                title: 'Форма Голоса',
                poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop',

        ];

        let animeList = [];

        let userFriends = JSON.parse(localStorage.getItem('komi_friends')) || {}; 
        let friendRequests = JSON.parse(localStorage.getItem('komi_friend_requests')) || {}; 
        let userAnimeStatuses = JSON.parse(localStorage.getItem('komi_anime_statuses')) || {}; 
        let currentUser = JSON.parse(localStorage.getItem('komi_current_user')) || null;
        let registeredUsers = JSON.parse(localStorage.getItem('komi_users_db')) || {};
        let userProfiles = JSON.parse(localStorage.getItem('komi_profiles')) || {};
        let userAchievements = JSON.parse(localStorage.getItem('komi_achievements')) || {};

        let userWatchHistory = JSON.parse(localStorage.getItem('komi_history')) || {};
        let searchHistory = JSON.parse(localStorage.getItem('komi_search_history')) || ['Экшен', 'Романтика', 'Топ-2026'];
        let siteStats = JSON.parse(localStorage.getItem('komi_stats')) || { visits: 1420, views: 8900 };

        let currentView = 'home';
        let profileTargetUser = null;
        let profileActiveTab = 'Смотрю';
        let catalogFilterGenre = 'Все';
        let catalogFilterYear = 'Все';
        let catalogFilterType = 'Все';
        let catalogSort = 'popular';
        const mySessionId = 'user_' + Math.random().toString(36).substring(2, 9);

        function changeTheme(theme) {
            document.body.className = theme === 'default' ? '' : 'theme-' + theme;
            localStorage.setItem('komi_theme', theme);
        }
        const savedTheme = localStorage.getItem('komi_theme');
        if (savedTheme) { document.body.className = savedTheme === 'default' ? '' : 'theme-' + savedTheme; document.getElementById('themeSelect').value = savedTheme; }

        function saveData() {
            localStorage.setItem('komi_current_user', JSON.stringify(currentUser));
            localStorage.setItem('komi_users_db', JSON.stringify(registeredUsers));
            localStorage.setItem('komi_profiles', JSON.stringify(userProfiles));
            localStorage.setItem('komi_achievements', JSON.stringify(userAchievements));
            localStorage.setItem('komi_favorites', JSON.stringify(userFavorites));
            localStorage.setItem('komi_history', JSON.stringify(userWatchHistory));
            localStorage.setItem('komi_search_history', JSON.stringify(searchHistory));
            localStorage.setItem('komi_stats', JSON.stringify(siteStats));
            localStorage.setItem('komi_friends', JSON.stringify(userFriends));
            localStorage.setItem('komi_friend_requests', JSON.stringify(friendRequests));
            localStorage.setItem('komi_anime_statuses', JSON.stringify(userAnimeStatuses));
        }

        async function loadDataFromCloud() {
            try {
                const { data } = await _supabase.from('animes').select('*');
                if (data && data.length > 0) {
                    for(let row of data) {
                        if (row.id === 1) animeList = JSON.parse(row.content || '[]');
                        if (row.id === 2) animeComments = JSON.parse(row.content || '{}');
                    }
                }
                if (animeList.length === 0) {
                    animeList = defaultAnime;
                    await _supabase.from('animes').upsert({ id: 1, content: JSON.stringify(animeList) });
                }
            } catch(err) {
                animeList = defaultAnime;
            }
            render();
        }

        async function saveAnimeToCloud() {
            await _supabase.from('animes').upsert({ id: 1, content: JSON.stringify(animeList) });
            render();
        }

        async function saveCommentsToCloud() {
            await _supabase.from('animes').upsert({ id: 2, content: JSON.stringify(animeComments) });
        }

        async function updateOnlinePresence() {
            try {
                const now = Date.now();
                const userNameGuest = currentUser ? currentUser.username : ('Гость_' + mySessionId.slice(0,4));
                await _supabase.from('online_users').upsert({ session_id: mySessionId, username: userNameGuest, last_seen: now });
                const expireTime = now - 15000;
                await _supabase.from('online_users').delete().lt('last_seen', expireTime);

                const { data } = await _supabase.from('online_users').select('*');
                if (data) {
                    const count = data.length || 1;
                    const el = document.getElementById('onlineCountText');
                    if (el) el.innerText = `Онлайн: ${count}`;
                    renderSidebarLists(data);
                }
            } catch(e) {}
        }
        setInterval(updateOnlinePresence, 4000);

        function renderSidebarLists(onlineRows) {
            const onlineContainer = document.getElementById('sidebarOnlineList');
            const friendsContainer = document.getElementById('sidebarFriendsList');

            if (onlineRows && onlineRows.length > 0) {
                onlineContainer.innerHTML = onlineRows.map(u => {
                    const p = userProfiles[u.username] || {};
                    const avatar = p.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop';
                    return `
                        <div class="sidebar-user-item" onclick="openProfile('${u.username}')">
                            <img src="${avatar}" class="sidebar-user-avatar">
                            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${u.username}</span>
                        </div>
                    `;
                }).join('');
            } else {
                onlineContainer.innerHTML = `<span style="color:var(--text-muted); font-size:12px;">Никого нет онлайн</span>`;
            }

            if (currentUser) {
                const myFriends = userFriends[currentUser.username] || [];
                if (myFriends.length > 0) {
                    friendsContainer.innerHTML = myFriends.map(f => {
                        const p = userProfiles[f] || {};
                        const avatar = p.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop';
                        const isOnline = onlineRows.some(row => row.username === f);

                            <div class="sidebar-user-item" onclick="openProfile('${f}')">
                                <img src="${avatar}" class="sidebar-user-avatar">

                                <span style="width:8px; height:8px; border-radius:50%; background:${isOnline ? '#34d399' : '#64748b'};" title="${isOnline ? 'В сети' : 'Не в сети'}"></span>
                            </div>
                        `;
                    }).join('');
                } else {
                    friendsContainer.innerHTML = `<span style="color:var(--text-muted); font-size:12px;">Список друзей пуст</span>`;

                friendsContainer.innerHTML = `<span style="color:var(--text-muted); font-size:12px;">Войдите, чтобы видеть друзей</span>`;
            }
        }

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function unlockAchievement(username, title) {
            if (!userAchievements[username]) userAchievements[username] = [];
            if (!userAchievements[username].includes(title)) {
                userAchievements[username].push(title);
                saveData();
            }
        }

        function navigate(view) {
            currentView = view;
            render();
            renderHeaderUser();
        }

            currentView = 'profile';
            profileTargetUser = username;
            render();
            renderHeaderUser();
        }

        function render() {
            renderHeaderUser();
            const container = document.getElementById('mainContainer');
            
            if (currentView === 'home') {

                        <button class="btn-primary" onclick="playSound(); openWatchModal('${featured.id}')">
                            ▶ Смотреть сейчас
                        </button>
                    </div>
                    ` : ''}

                    <div class="section-header"><h2 class="section-title">✨ Рекомендуем посмотреть</h2></div>

                        ${recommended.length === 0 ? `<div class="empty-state"><h3>Нет доступных аниме в базе</h3></div>` : recommended.map(a => renderCard(a)).join('')}
                    </div>

                    <div class="anime-grid">
                        ${animeList.length === 0 ? `<div class="empty-state"><h3>Каталог пуст</h3></div>` : animeList.map(a => renderCard(a)).join('')}

            } else if (currentView === 'catalog') {
                const genres = ['Все', ...availableGenresList];

                const types = ['Все', 'Сериал', 'Фильм', 'OVA'];

                let filtered = animeList.filter(a => {
                    const gList = a.genres || [a.genre];
                    if (catalogFilterGenre !== 'Все' && !gList.includes(catalogFilterGenre)) return false;

                            </select>

                        <div class="form-group" style="margin:0;">

                                <option value="alphabet" ${catalogSort==='alphabet'?'selected':''}>Алфавит</option>

                    <div class="anime-grid">

            const statsCounts = { 'Смотрю': 0, 'В планах': 0, 'Просмотрено': 0, 'Отложено': 0, 'Брошено': 0, 'Любимые': 0 };
            
            const listForTab = [];

            container.innerHTML = `

                                ${!isMe && currentUser ? `
                                    ${amIFriend ? `<button class="btn-danger" style="padding:6px 14px; font-size:12px;" onclick="removeFriend('${username}')">Удалить из друзей</button>` :

        function renderCard(anime) {
            const avg = calculateAverageRating(anime);
            const gText = (anime.genres || [anime.genre || '']).join(', ');
            return `
                <div class="anime-card" onclick="playSound(); openWatchModal('${anime.id}')">
                    <div class="anime-rating-badge">⭐ ${avg}</div>
                    <img src="${anime.poster}" class="anime-poster" onerror="this.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop'">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-meta-card"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;">${gText}</span><span>${anime.episodes.length} сер.</span></div>
                    </div>
                </div>
            `;
        }

        function calculateAverageRating(anime) {
            if (!anime.ratings || Object.keys(anime.ratings).length === 0) return '8.5';
            const values = Object.values(anime.ratings);
            return (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1);
        }

        async function autoFillFromAPI() {
            const query = document.getElementById('apiSearchTitle').value.trim();
            if (!query) { alert('Введите название для поиска!'); return; }
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=1`);
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    const anime = data.data[0];
                    document.getElementById('animeTitle').value = anime.title || '';
                    document.getElementById('animePoster').value = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
                    
                    if (anime.genres && anime.genres.length > 0) {
                        const fetchedGenres = anime.genres.map(g => g.name.toLowerCase());
                        document.querySelectorAll('.genre-checkbox').forEach(cb => {
                            if (fetchedGenres.includes(cb.value.toLowerCase())) cb.checked = true;
                        });
                    }
                    document.getElementById('animeYear').value = anime.year || (anime.aired?.from ? new Date(anime.aired.from).getFullYear() : '2026');
                    document.getElementById('animeType').value = anime.type || 'Сериал';
                    document.getElementById('animeDesc').value = anime.synopsis || '';
                    alert('Данные успешно загружены!');
                } else {
                    alert('Ничего не найдено в базе MyAnimeList.');
                }
            } catch(e) {
                alert('Ошибка при запросе к API.');
            }
        }

        async function saveAnimeForm(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnimeId').value;
            const title = document.getElementById('animeTitle').value;
            const poster = document.getElementById('animePoster').value;
            const trailer = document.getElementById('animeTrailer').value;
            const year = document.getElementById('animeYear').value || '2026';
            const type = document.getElementById('animeType').value || 'Сериал';
            const desc = document.getElementById('animeDesc').value;

            const selectedGenres = [];
            document.querySelectorAll('.genre-checkbox:checked').forEach(cb => selectedGenres.push(cb.value));
            const genres = selectedGenres.length > 0 ? selectedGenres : ['Экшен'];

            const episodes = [];
            const seasonsInputs = document.querySelectorAll('.ep-season');
            const titles = document.querySelectorAll('.ep-title');
            const voicesInputs = document.querySelectorAll('.ep-voices');
            const qualities = document.querySelectorAll('.ep-quality');
            const urls = document.querySelectorAll('.ep-url');
            
            for(let i=0; i<titles.length; i++) {
                episodes.push({ 
                    season: parseInt(seasonsInputs[i].value) || 1, 
                    title: titles[i].value, 
                    voices: voicesInputs[i].value,
                    quality: qualities[i].value,
                    url: urls[i].value 
                });
            }

            if (editId) {
                const anime = animeList.find(a => a.id === editId);
                if (anime) Object.assign(anime, { title, poster, trailer, genres, genre: genres[0], year, type, desc, episodes });
            } else {
                animeList.push({ id: 'anime_' + Date.now(), title, poster, trailer, genres, genre: genres[0], year, type, desc, episodes, ratings: {} });
            }

            await saveAnimeToCloud();
            closeAddModal();
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const passwordInput = document.getElementById('authPassword').value;
            if (!username || !passwordInput) return;

            const passwordHash = await hashPassword(passwordInput);

            if (registeredUsers[username]) {
                if (registeredUsers[username] === passwordHash) {
                    currentUser = { username };
                    saveData();
                    closeAuthModal();
                    render();
                } else {
                    alert('Неверный пароль для этого имени пользователя!');
                }
            } else {
                registeredUsers[username] = passwordHash;
                currentUser = { username };
                if (!userProfiles[username]) {
                    userProfiles[username] = { avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop', status: 'Новичок на платформе ⭐' };
                }
                saveData();
                closeAuthModal();
                render();
                alert('Аккаунт успешно создан!');
            }
        }

            if (userFavorites[currentUser.username][id] === category) {
                delete userFavorites[currentUser.username][id];
            } else {
                userFavorites[currentUser.username][id] = category;
            }
            saveData();
            openWatchModal(id);
        }

        function setAnimeStatus(animeId, status) {
            if (!currentUser) { openAuthModal(); return; }
            if (!userAnimeStatuses[currentUser.username]) userAnimeStatuses[currentUser.username] = {};
            if (userAnimeStatuses[currentUser.username][animeId] === status) {
                delete userAnimeStatuses[currentUser.username][animeId];
            } else {
                userAnimeStatuses[currentUser.username][animeId] = status;
            }
            saveData();
            openWatchModal(animeId);
        }

        function sendFriendRequest(targetUsername) {
            if (!currentUser) { openAuthModal(); return; }
            if (currentUser.username === targetUsername) return;

            if (!friendRequests[targetUsername]) friendRequests[targetUsername] = [];
            if (!friendRequests[targetUsername].includes(currentUser.username)) {
                friendRequests[targetUsername].push(currentUser.username);
                saveData();
                alert('Заявка в друзья отправлена!');
            } else {
                alert('Заявка уже отправлена ранее.');
            }
            openProfile(targetUsername);
        }

        function acceptFriendRequest(senderUsername) {
            if (!currentUser) return;
            const myName = currentUser.username;
            if (friendRequests[myName]) {
                friendRequests[myName] = friendRequests[myName].filter(u => u !== senderUsername);
            }
            if (!userFriends[myName]) userFriends[myName] = [];
            if (!userFriends[myName].includes(senderUsername)) userFriends[myName].push(senderUsername);

            if (!userFriends[senderUsername]) userFriends[senderUsername] = [];
            if (!userFriends[senderUsername].includes(myName)) userFriends[senderUsername].push(myName);

            saveData();
            openProfile(myName);
        }

        function removeFriend(friendUsername) {
            if (!currentUser) return;
            const myName = currentUser.username;
            if (userFriends[myName]) userFriends[myName] = userFriends[myName].filter(u => u !== friendUsername);
            if (userFriends[friendUsername]) userFriends[friendUsername] = userFriends[friendUsername].filter(u => u !== myName);
            saveData();
            openProfile(friendUsername);
        }

            const avatar = document.getElementById('newAvatarUrl').value.trim();

            if (avatar) userProfiles[currentUser.username].avatar = avatar;
            if (status) userProfiles[currentUser.username].status = status;
            saveData();
            render();
        }

        async function openWatchModal(id, selectedSeason = null, selectedEpIdx = 0, selectedVoice = null, selectedQuality = null) {
            siteStats.views++;
            saveData();
            
            try {
                const { data } = await _supabase.from('animes').select('*').eq('id', 2);
                if (data && data.length > 0) {
                    animeComments = JSON.parse(data[0].content || '{}');
                }

            const anime = animeList.find(a => a.id === id);
            if (!anime || !anime.episodes || anime.episodes.length === 0) return;

            const seasonsMap = {};
            anime.episodes.forEach((ep, idx) => {
                const s = ep.season || 1;
                if (!seasonsMap[s]) seasonsMap[s] = [];
                seasonsMap[s].push({ ...ep, originalIdx: idx });
            });

            const seasonNumbers = Object.keys(seasonsMap).map(Number).sort((a,b) => a - b);
            const activeSeason = selectedSeason !== null && seasonsMap[selectedSeason] ? selectedSeason : seasonNumbers[0];
            const currentSeasonEpisodes = seasonsMap[activeSeason];

            const currentEpForVoices = currentSeasonEpisodes[selectedEpIdx] || currentSeasonEpisodes[0];
            const rawVoicesStr = currentEpForVoices.voices || currentEpForVoices.voice || 'AniLibria';
            const availableVoices = rawVoicesStr.split(',').map(v => v.trim()).filter(Boolean);
            const activeVoice = selectedVoice && availableVoices.includes(selectedVoice) ? selectedVoice : availableVoices[0];

            const availableQualities = [...new Set(currentSeasonEpisodes.map(ep => ep.quality || '1080p'))];
            const activeQuality = selectedQuality && availableQualities.includes(selectedQuality) ? selectedQuality : availableQualities[0];

            const finalEpList = currentSeasonEpisodes.filter(ep => (ep.quality || '1080p') === activeQuality);
            const currentEp = finalEpList[selectedEpIdx] || finalEpList[0] || currentSeasonEpisodes[0];

            const comments = animeComments[anime.id] || [];
            const userHistoryKey = currentUser ? `${currentUser.username}_${anime.id}` : null;
            const savedTime = userHistoryKey ? (userWatchHistory[userHistoryKey] || 0) : 0;
            const userFavCategory = currentUser ? ((userFavorites[currentUser.username] || {})[anime.id] || '') : '';
            const avgRating = calculateAverageRating(anime);
            const myCurrentStatus = currentUser && userAnimeStatuses[currentUser.username] ? (userAnimeStatuses[currentUser.username][anime.id] || '') : '';

            document.getElementById('watchModalContent').innerHTML = `
                <button class="modal-close" onclick="playSound(); document.getElementById('watchModal').classList.remove('active')">&times;</button>
                <div class="watch-cinema-layout ${isTheaterMode ? 'theater' : ''}" id="cinemaLayout">

                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <button class="btn-secondary" onclick="toggleTheaterMode('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')">🎬 Кинотеатр</button>
                                <button class="btn-secondary" onclick="toggleFavorite('${anime.id}', 'Любимые')">⭐ ${userFavCategory ? 'В избранном' : 'В избранное'}</button>
                            </div>
                        </div>

                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:10px 14px; border-radius:12px;">
                            <span style="font-size:12px; color:var(--text-muted);">Статус:</span>
                            ${['Смотрю', 'В планах', 'Просмотрено', 'Отложено', 'Брошено'].map(st => `
                                <button class="season-tab-btn ${myCurrentStatus === st ? 'active' : ''}" onclick="playSound(); setAnimeStatus('${anime.id}', '${st}')">${st}</button>
                            `).join('')}
                        </div>

                        ${anime.trailer ? `
                        <div style="background:var(--bg-input); padding:12px; border-radius:12px; margin-bottom:5px;">
                            <span style="font-size:13px; color:var(--accent); font-weight:700; display:block; margin-bottom:8px;">🎬 Трейлер тайтла</span>
                            <iframe src="${anime.trailer}" style="width:100%; height:220px; border-radius:8px; border:none;" allowfullscreen></iframe>
                        </div>
                        ` : ''}

                        <div class="player-wrapper">
                            <div class="player-box">
                                <video id="animeVideoPlayer" controls preload="metadata" playsinline style="width:100%; height:100%;" ontimeupdate="saveProgress('${anime.id}', this)" onended="playNextEp('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')" onerror="handleVideoError()">
                                    <source src="${currentEp ? currentEp.url : ''}" type="video/mp4">
                                    Ваш браузер не поддерживает видео.
                                </video>
                            </div>
                            <button class="skip-intro-btn" id="skipIntroBtn" onclick="skipIntro()">Пропустить опенинг ⏭</button>
                        </div>

                        <div id="videoErrorMsg" style="display:none; color:#fca5a5; font-size:13px; background:rgba(239,68,68,0.15); padding:10px; border-radius:8px; border:1px solid rgba(239,68,68,0.3);">
                            ⚠️ Не удалось загрузить видео. Убедитесь, что ссылка является прямой ссылкой на видеофайл (.mp4).
                        </div>

                        <div style="display:flex; gap:15px; background:var(--bg-input); padding:12px 16px; border-radius:12px; align-items:center; flex-wrap:wrap;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="font-size:13px; color:var(--text-muted);">Озвучка:</span>
                                ${availableVoices.map(v => `<button class="season-tab-btn ${v === activeVoice ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${v}', '${activeQuality}')">${v}</button>`).join('')}
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="font-size:13px; color:var(--text-muted);">Качество:</span>
                                ${availableQualities.map(q => `<button class="season-tab-btn ${q === activeQuality ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${q}')">${q}</button>`).join('')}
                            </div>
                        </div>

                        <div style="background:var(--bg-input); padding:12px 16px; border-radius:12px; display:flex; align-items:center; justify-content:space-between;">
                            <span>Оценка MAL: <b>⭐ ${avgRating}</b> (Ваша оценка: <span id="myRating">нет</span>)</span>
                            <div style="display:flex; gap:4px;">
                                ${[2,4,6,8,10].map(star => `<button style="background:none; border:none; color:#fbbf24; cursor:pointer; font-size:16px;" onclick="rateAnime('${anime.id}', ${star})">⭐${star}</button>`).join('')}
                            </div>
                        </div>

                        <div class="comments-section">
                            <h3>💬 Комментарии (<span id="commentsCount">${comments.length}</span>)</h3>
                            <div style="display:flex; gap:10px; flex-direction:column;">
                                <div style="display:flex; gap:10px;">
                                    <input type="text" id="commentInput" class="form-control" placeholder="Написать комментарий...">
                                    <button class="btn-primary" onclick="addComment('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')">Отправить</button>
                                </div>
                                <label style="font-size:12px; color:var(--text-muted); cursor:pointer;"><input type="checkbox" id="isSpoiler"> Содержит спойлер</label>
                            </div>
                            <div id="commentsListContainer" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                                ${comments.map((c, cIdx) => `
                                    <div class="comment-item">
                                        <div class="comment-author" onclick="openProfile('${c.username}')">
                                            <span>👤 ${c.username}</span>
                                        </div>
                                        <div class="comment-text">${c.spoiler ? `<span class="spoiler-text" onclick="this.classList.toggle('revealed')">⚠️ Спойлер (нажмите чтобы открыть) <span style="color:transparent">${c.text}</span></span>` : c.text}</div>
                                        <div class="comment-reactions">
                                            ${['🔥', '❤️', '😂', '🤡'].map(emoji => {
                                                const count = (c.reactions && c.reactions[emoji]) ? c.reactions[emoji].length : 0;
                                                const myUser = currentUser ? currentUser.username : null;
                                                const hasMyReaction = myUser && c.reactions && c.reactions[emoji] && c.reactions[emoji].includes(myUser);
                                                return `
                                                    <button class="reaction-btn ${hasMyReaction ? 'active' : ''}" onclick="reactComment('${anime.id}', ${cIdx}, '${emoji}')">
                                                        <span>${emoji}</span> <span>${count}</span>
                                                    </button>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="watch-sidebar">
                        <h3 style="font-size:15px; margin-bottom:8px;">Сезоны</h3>
                        <div class="season-tabs">
                            ${seasonNumbers.map(s => `
                                <button class="season-tab-btn ${s === activeSeason ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${s}, 0, '${activeVoice}', '${activeQuality}')">
                                    Сезон ${s}
                                </button>
                            `).join('')}
                        </div>

                        <h3 style="font-size:15px; margin: 15px 0 8px 0;">Эпизоды (${finalEpList.length})</h3>
                        <div class="episodes-list-grid">
                            ${finalEpList.map((ep, i) => `
                                <div class="ep-card-side ${i === (selectedEpIdx || 0) ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${i}, '${activeVoice}', '${activeQuality}')">
                                    <span>${ep.title || ('Эпизод ' + (i+1))}</span>
                                    <span style="font-size:11px; opacity:0.7;">▶</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('watchModal').classList.add('active');

            const v = document.getElementById('animeVideoPlayer');
            if (v && savedTime > 0) {
                v.currentTime = savedTime;
                v.play().catch(() => {});
            }
        }

        function handleVideoError() {
            const errBox = document.getElementById('videoErrorMsg');
            if (errBox) errBox.style.display = 'block';
        }

        function toggleTheaterMode(id, season, epIdx, voice, quality) {
            isTheaterMode = !isTheaterMode;
            openWatchModal(id, season, epIdx, voice, quality);
        }

        function skipIntro() {
            const v = document.getElementById('animeVideoPlayer');
            if (v) v.currentTime += 85;
        }

        function saveProgress(id, video) {
            if (!currentUser) return;
            const key = `${currentUser.username}_${id}`;
            userWatchHistory[key] = video.currentTime;
            saveData();
        }

        function playNextEp(id, season, currentIdx, voice, quality) {
            openWatchModal(id, season, currentIdx + 1, voice, quality);
        }

        function rateAnime(id, score) {
            if (!currentUser) { openAuthModal(); return; }
            const anime = animeList.find(a => a.id === id);
            if (!anime) return;
            if (!anime.ratings) anime.ratings = {};
            anime.ratings[currentUser.username] = score;
            saveData();
            document.getElementById('myRating').innerText = score;
            openWatchModal(id);
        }

        async function addComment(id, season, epIdx, voice, quality) {
            if (!currentUser) { openAuthModal(); return; }
            const text = document.getElementById('commentInput').value.trim();
            const spoiler = document.getElementById('isSpoiler').checked;
            if (!text) return;
            
            if (!animeComments[id]) animeComments[id] = [];
            animeComments[id].unshift({ username: currentUser.username, text, spoiler, reactions: {} });
            
            await saveCommentsToCloud();
            openWatchModal(id, season, epIdx, voice, quality);
        }

        async function reactComment(id, cIdx, emoji) {
            if (!currentUser) { openAuthModal(); return; }
            const username = currentUser.username;
            if (!animeComments[id] || !animeComments[id][cIdx]) return;

            const comment = animeComments[id][cIdx];
            if (!comment.reactions) comment.reactions = {};

            Object.keys(comment.reactions).forEach(em => {
                if (comment.reactions[em]) {
                    comment.reactions[em] = comment.reactions[em].filter(u => u !== username);
                }
            });

            if (!comment.reactions[emoji]) comment.reactions[emoji] = [];
            const userIndex = comment.reactions[emoji].indexOf(username);
            
            if (userIndex > -1) {
                comment.reactions[emoji].splice(userIndex, 1);
            } else {
                comment.reactions[emoji].push(username);
            }

            await saveCommentsToCloud();
            openWatchModal(id);
        }

        loadDataFromCloud();
    </script>
</body>
</html>
