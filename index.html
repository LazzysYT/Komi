<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komi Anime Hub — Платформа нового поколения</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='var(--primary)'/><text x='50%' y='55%' font-size='60' font-weight='800' fill='white' font-family='sans-serif' dominant-baseline='middle' text-anchor='middle'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #000000;
            --bg-card: #121218;
            --bg-input: #1a1a24;
            --primary: #8B5CF6;
            --primary-hover: #7c3aed;
            --accent: #C084FC;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #1F1F2E;
        }

        body.theme-cyberpunk { --primary: #EF4444; --primary-hover: #DC2626; --accent: #FCA5A5; }
        body.theme-mint { --primary: #10B981; --primary-hover: #059669; --accent: #6EE7B7; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            color: white;
            box-shadow: 0 0 20px var(--primary);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .online-counter {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .online-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

        .search-container {
            position: relative;
            flex: 0 1 340px;
        }

        .search-bar input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px 12px 44px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .search-bar svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 5px;
            display: none;
            z-index: 200;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            max-height: 250px;
            overflow-y: auto;
        }
        .search-dropdown.active { display: block; }
        .search-dropdown-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .search-dropdown-item:hover { background: rgba(139,92,246,0.15); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
        }

        .nav-btn:hover, .nav-btn.active {
            color: white;
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--accent);
        }

        .action-icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: white;
            padding: 9px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .action-icon-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); }

        .user-pill {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .user-avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--primary);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
            flex: 1;
            width: 100%;
        }

        .hero-banner {
            border-radius: 24px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--border);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 420px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0.6) 75%, rgba(0,0,0,0.3) 100%);
            z-index: 1;
        }

        .hero-banner > * { position: relative; z-index: 2; }

        .hero-banner h1 {
            font-size: 42px;
            font-weight: 800;
            max-width: 650px;
            margin-bottom: 16px;
            line-height: 1.15;
            background: linear-gradient(to right, #FFFFFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 550px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .hero-meta span {
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 8px;
            color: white;
            border: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            margin-top: 35px;
        }

        .section-title { font-size: 22px; font-weight: 700; }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .anime-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .anime-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.25);
        }

        .anime-rating-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--border);
            color: #fbbf24;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            z-index: 2;
        }

        .anime-poster {
            width: 100%;
            height: 310px;
            object-fit: cover;
            background: var(--bg-input);
        }

        .anime-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .anime-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .anime-meta-card {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: #0d0d12;
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 95%;
            max-width: 1250px;
            padding: 35px;
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .modal-close:hover { background: rgba(255,255,255,0.15); border-color: var(--accent); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: white; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        .catalog-filters-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .watch-cinema-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            align-items: start;
            transition: all 0.3s ease;
        }
        .watch-cinema-layout.theater { grid-template-columns: 1fr; }
        .watch-cinema-layout.theater .watch-sidebar { display: none; }
        @media (max-width: 1024px) { .watch-cinema-layout { grid-template-columns: 1fr; } }

        .watch-main-col { display: flex; flex-direction: column; gap: 20px; }
        .player-wrapper { position: relative; width: 100%; }
        .player-box { background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .skip-intro-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
        .skip-intro-btn:hover { background: var(--primary); border-color: var(--primary); }

        .watch-sidebar { background: #101015; border: 1px solid var(--border); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 20px; }
        
        .season-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 5px; }
        .season-tab-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .season-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .episodes-list-grid { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 6px; }
        
        .ep-card-side {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }
        .ep-card-side:hover, .ep-card-side.active {
            background: rgba(139, 92, 246, 0.25);
            border-color: var(--accent);
        }

        .comments-section { background: rgba(255,255,255,0.01); border: 1px solid var(--border); padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; }
        .comment-item { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
        .comment-author { font-weight: 700; font-size: 13px; color: var(--accent); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .comment-reactions { display: flex; gap: 6px; margin-top: 4px; }
        .reaction-btn { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: white; display: flex; align-items: center; gap: 4px; }
        .reaction-btn:hover { border-color: var(--accent); }
        .reaction-btn.active { background: rgba(139, 92, 246, 0.3); border-color: var(--accent); }
        
        .spoiler-text { background: #222; color: #222; border-radius: 4px; cursor: pointer; padding: 2px 6px; user-select: none; }
        .spoiler-text.revealed { background: #333; color: #fff; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { padding: 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        .admin-table th { color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body class="theme-default">

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-container" onclick="playSound(); navigate('home')">
                <div class="logo-box">K</div>
                <div class="logo-text">Komi Anime</div>
            </div>
            <div class="online-counter">
                <div class="online-dot"></div>
                <span id="onlineCountText">Онлайн: 1</span>
            </div>
        </div>
        
        <div class="search-container">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Поиск аниме, жанров..." oninput="handleSearchInput(this.value)" onfocus="showSearchDropdown()">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <div class="nav-actions">
            <button class="nav-btn" id="navHomeBtn" onclick="playSound(); navigate('home')">Главная</button>
            <button class="nav-btn" id="navCatalogBtn" onclick="playSound(); navigate('catalog')">Каталог</button>
            <button class="action-icon-btn" onclick="playSound(); randomAnime()">🎲 Мне повезет</button>
            
            <button class="action-icon-btn" id="adminPanelBtn" onclick="playSound(); openAdminPanel()" style="background: rgba(139, 92, 246, 0.2); border-color: var(--primary); display: none;">⚙️ Админка</button>
            <button class="action-icon-btn" id="addAnimeBtn" onclick="playSound(); openAddModal()" style="background: var(--primary); border-color: var(--primary); display: none;">+ Добавить</button>

            <select class="action-icon-btn" id="themeSelect" onchange="changeTheme(this.value)" style="background: var(--bg-input); padding: 8px;">
                <option value="default">💜 Фиолетовая</option>
                <option value="cyberpunk">🔴 Киберпанк</option>
                <option value="mint">🟢 Мятная</option>
            </select>
            <div id="userHeaderArea"></div>
        </div>
    </header>

    <main id="mainContainer"></main>

    <!-- Modals -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content" style="max-width: 700px;">
            <button class="modal-close" onclick="playSound(); closeAddModal()">&times;</button>
            <h2 id="modalTitleText" style="margin-bottom: 15px;">Добавить / Редактировать аниме</h2>
            <div style="margin-bottom: 20px; display: flex; gap: 10px;">
                <input type="text" id="apiSearchTitle" class="form-control" placeholder="Название для авто-заполнения (например: Naruto)...">
                <button type="button" class="btn-secondary" onclick="autoFillFromAPI()">⚡ Заполнить</button>
            </div>
            <form id="animeForm" onsubmit="saveAnimeForm(event)">
                <input type="hidden" id="editAnimeId">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" class="form-control" id="animeTitle" required placeholder="Название аниме">
                </div>
                <div class="form-group">
                    <label>Постер (URL изображения)</label>
                    <input type="url" class="form-control" id="animePoster" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>YouTube Трейлер (в формате embed)</label>
                    <input type="url" class="form-control" id="animeTrailer" placeholder="https://www.youtube.com/embed/...">
                </div>
                <div class="form-group">
                    <label>Жанр</label>
                    <select class="form-control" id="animeGenre">
                        <option value="Экшен">Экшен</option>
                        <option value="Романтика">Романтика</option>
                        <option value="Фэнтези">Фэнтези</option>
                        <option value="Киберпанк">Киберпанк</option>
                        <option value="Комедия">Комедия</option>
                        <option value="Хоррор">Хоррор</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Год выпуска / Тип</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" class="form-control" id="animeYear" placeholder="2026" style="flex:1;">
                        <input type="text" class="form-control" id="animeType" placeholder="Сериал" style="flex:1;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea class="form-control" id="animeDesc" placeholder="Сюжет аниме..."></textarea>
                </div>
                <div class="form-group">
                    <label>Сезоны, Озвучка, Качество и Ссылка (.mp4)</label>
                    <div id="episodesList" style="display:flex; flex-direction:column; gap:10px; margin-bottom:10px;"></div>
                    <button type="button" class="btn-secondary" onclick="playSound(); addEpisodeField()">+ Добавить эпизод</button>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; justify-content: center;" onclick="playSound()">Сохранить аниме</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-content" style="max-width: 400px;">
            <button class="modal-close" onclick="playSound(); closeAuthModal()">&times;</button>
            <h2 id="authTitle" style="margin-bottom: 20px; text-align: center;">Авторизация / Регистрация</h2>
            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" class="form-control" id="authUsername" required placeholder="Введите имя...">
                </div>
                <div class="form-group">
                    <label>Пароль</label>

                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            const editId = document.getElementById('editAnimeId').value;
            const title = document.getElementById('animeTitle').value;
            const poster = document.getElementById('animePoster').value;
            const trailer = document.getElementById('animeTrailer').value;
            const genre = document.getElementById('animeGenre').value;
            const year = document.getElementById('animeYear').value || '2026';
            const type = document.getElementById('animeType').value || 'Сериал';
            const desc = document.getElementById('animeDesc').value;

            const episodes = [];
            const seasonsInputs = document.querySelectorAll('.ep-season');
            const titles = document.querySelectorAll('.ep-title');
            const voices = document.querySelectorAll('.ep-voice');
            const qualities = document.querySelectorAll('.ep-quality');
            const urls = document.querySelectorAll('.ep-url');
            
            for(let i=0; i<titles.length; i++) {
                episodes.push({ 
                    season: parseInt(seasonsInputs[i].value) || 1, 
                    title: titles[i].value, 
                    voice: voices[i].value,
                    quality: qualities[i].value,
                    url: urls[i].value 
                });
            }

            if (editId) {
                const anime = animeList.find(a => a.id === editId);
                if (anime) Object.assign(anime, { title, poster, trailer, genre, year, type, desc, episodes });
            } else {
                animeList.push({ id: 'anime_' + Date.now(), title, poster, trailer, genre, year, type, desc, episodes, ratings: {} });
            }

            await saveAnimeToCloud();
            closeAddModal();
        }

        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const passwordInput = document.getElementById('authPassword').value;
            if (!username || !passwordInput) return;

            const passwordHash = await hashPassword(passwordInput);

            if (registeredUsers[username]) {
                if (registeredUsers[username] === passwordHash) {
                    currentUser = { username };
                    saveData();
                    closeAuthModal();
                    render();
                } else {
                    alert('Неверный пароль для этого имени пользователя!');
                }
            } else {
                registeredUsers[username] = passwordHash;
                currentUser = { username };
                if (!userProfiles[username]) {
                    userProfiles[username] = { avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop', status: 'Новичок на платформе ⭐' };
                }
                saveData();
                closeAuthModal();
                render();
                alert('Аккаунт успешно создан!');
            }
        }

        function toggleFavorite(id, category) {
            if (!currentUser) { openAuthModal(); return; }
            if (!userFavorites[currentUser.username]) userFavorites[currentUser.username] = {};
            if (userFavorites[currentUser.username][id] === category) {
                delete userFavorites[currentUser.username][id];
            } else {
                userFavorites[currentUser.username][id] = category;
            }
            saveData();
            openWatchModal(id);
        }

        // --- СИСТЕМА ДРУЗЕЙ ---
        function toggleFriend(targetUsername) {
            if (!currentUser) { openAuthModal(); return; }
            if (currentUser.username === targetUsername) return;
            
            if (!userFriends[currentUser.username]) userFriends[currentUser.username] = [];
            const idx = userFriends[currentUser.username].indexOf(targetUsername);
            if (idx > -1) {
                userFriends[currentUser.username].splice(idx, 1);
            } else {
                userFriends[currentUser.username].push(targetUsername);
            }
            saveData();
            openProfileModal(targetUsername);
        }

        function openProfileModal(username) {
            const p = userProfiles[username] || { avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop', status: 'Участник сообщества' };
            const achs = userAchievements[username] || [];
            const myFriends = userFriends[username] || [];
            const isMe = currentUser && currentUser.username === username;
            const amIFriend = currentUser && (userFriends[currentUser.username] || []).includes(username);

            document.getElementById('profileModalContent').innerHTML = `
                <button class="modal-close" onclick="playSound(); document.getElementById('profileModal').classList.remove('active')">&times;</button>
                <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px; flex-wrap:wrap;">
                    <img src="${p.avatar}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">
                    <div style="flex:1;">
                        <h2>${username}</h2>
                        <p style="color:var(--text-muted); font-size:13px; margin-bottom:8px;">Статус: ${p.status}</p>
                        ${!isMe && currentUser ? `
                            <button class="btn-primary" style="padding:6px 14px; font-size:12px;" onclick="toggleFriend('${username}')">
                                ${amIFriend ? '✓ В друзьях (Удалить)' : '+ Добавить в друзья'}
                            </button>
                        ` : ''}
                    </div>
                </div>

                ${isMe ? `
                <div style="background:var(--bg-input); padding:15px; border-radius:12px; margin-bottom:15px;">
                    <h3 style="font-size:14px; margin-bottom:8px;">Редактировать профиль</h3>
                    <div style="display:flex; gap:10px; margin-bottom:8px;">
                        <input type="url" id="newAvatarUrl" class="form-control" placeholder="Ссылка на аватара..." value="${p.avatar}">
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="newStatusText" class="form-control" placeholder="Ваш статус..." value="${p.status}">
                        <button class="btn-primary" onclick="updateUserProfile()">Сохранить</button>
                    </div>
                </div>
                ` : ''}

                <h3>👥 Друзья (${myFriends.length})</h3>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 20px 0;">
                    ${myFriends.length === 0 ? '<span style="color:var(--text-muted); font-size:13px;">Список друзей пуст</span>' : myFriends.map(f => `<span style="background:rgba(139,92,246,0.2); border:1px solid var(--primary); padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;" onclick="openProfileModal('${f}')">👤 ${f}</span>`).join('')}
                </div>

                <h3>🏆 Достижения (${achs.length})</h3>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 10px 0;">
                    ${achs.length === 0 ? '<span style="color:var(--text-muted); font-size:13px;">Пока нет достижений</span>' : achs.map(ac => `<span style="background:rgba(255,255,255,0.05); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600;">⭐ ${ac}</span>`).join('')}
                </div>
            `;
            document.getElementById('profileModal').classList.add('active');
        }

        function updateUserProfile() {
            const avatar = document.getElementById('newAvatarUrl').value.trim();
            const status = document.getElementById('newStatusText').value.trim();
            if (!userProfiles[currentUser.username]) userProfiles[currentUser.username] = {};
            if (avatar) userProfiles[currentUser.username].avatar = avatar;
            if (status) userProfiles[currentUser.username].status = status;
            saveData();
            openProfileModal(currentUser.username);
            renderHeaderUser();
        }

        let isTheaterMode = false;

        async function openWatchModal(id, selectedSeason = null, selectedEpIdx = 0, selectedVoice = null, selectedQuality = null) {
            siteStats.views++;
            saveData();
            
            try {
                const { data } = await _supabase.from('animes').select('*').eq('id', 2);
                if (data && data.length > 0) {
                    animeComments = JSON.parse(data[0].content || '{}');
                }
            } catch(e) {}

            const anime = animeList.find(a => a.id === id);
            if (!anime || !anime.episodes || anime.episodes.length === 0) return;

            const seasonsMap = {};
            anime.episodes.forEach((ep, idx) => {
                const s = ep.season || 1;
                if (!seasonsMap[s]) seasonsMap[s] = [];
                seasonsMap[s].push({ ...ep, originalIdx: idx });
            });

            const seasonNumbers = Object.keys(seasonsMap).map(Number).sort((a,b) => a - b);
            const activeSeason = selectedSeason !== null && seasonsMap[selectedSeason] ? selectedSeason : seasonNumbers[0];
            const currentSeasonEpisodes = seasonsMap[activeSeason];

            const availableVoices = [...new Set(currentSeasonEpisodes.map(ep => ep.voice || 'AniLibria'))];
            const activeVoice = selectedVoice && availableVoices.includes(selectedVoice) ? selectedVoice : availableVoices[0];

            const voiceEpisodes = currentSeasonEpisodes.filter(ep => (ep.voice || 'AniLibria') === activeVoice);
            const availableQualities = [...new Set(voiceEpisodes.map(ep => ep.quality || '1080p'))];
            const activeQuality = selectedQuality && availableQualities.includes(selectedQuality) ? selectedQuality : availableQualities[0];

            const finalEpList = voiceEpisodes.filter(ep => (ep.quality || '1080p') === activeQuality);
            const currentEp = finalEpList[selectedEpIdx] || finalEpList[0] || voiceEpisodes[0];

            const comments = animeComments[anime.id] || [];
            const userHistoryKey = currentUser ? `${currentUser.username}_${anime.id}` : null;
            const savedTime = userHistoryKey ? (userWatchHistory[userHistoryKey] || 0) : 0;
            const userFavCategory = currentUser ? ((userFavorites[currentUser.username] || {})[anime.id] || '') : '';
            const avgRating = calculateAverageRating(anime);

            document.getElementById('watchModalContent').innerHTML = `
                <button class="modal-close" onclick="playSound(); document.getElementById('watchModal').classList.remove('active')">&times;</button>
                <div class="watch-cinema-layout ${isTheaterMode ? 'theater' : ''}" id="cinemaLayout">
                    <div class="watch-main-col">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                            <h2>${anime.title} (Сезон ${activeSeason})</h2>
                            <div style="display:flex; gap:8px;">
                                <button class="btn-secondary" onclick="toggleTheaterMode('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')">🎬 Кинотеатр</button>
                                <button class="btn-secondary" onclick="toggleFavorite('${anime.id}', 'Смотрю')">⭐ ${userFavCategory || 'В избранное'}</button>
                            </div>
                        </div>

                        ${anime.trailer ? `
                        <div style="background:var(--bg-input); padding:12px; border-radius:12px; margin-bottom:5px;">
                            <span style="font-size:13px; color:var(--accent); font-weight:700; display:block; margin-bottom:8px;">🎬 Трейлер тайтла</span>
                            <iframe src="${anime.trailer}" style="width:100%; height:220px; border-radius:8px; border:none;" allowfullscreen></iframe>
                        </div>
                        ` : ''}

                        <div class="player-wrapper">
                            <div class="player-box">
                                <video id="animeVideoPlayer" controls preload="metadata" playsinline style="width:100%; height:100%;" ontimeupdate="saveProgress('${anime.id}', this)" onended="playNextEp('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')" onerror="handleVideoError()">
                                    <source src="${currentEp ? currentEp.url : ''}" type="video/mp4">
                                    Ваш браузер не поддерживает видео.
                                </video>
                            </div>
                            <button class="skip-intro-btn" id="skipIntroBtn" onclick="skipIntro()">Пропустить опенинг ⏭</button>
                        </div>

                        <div id="videoErrorMsg" style="display:none; color:#fca5a5; font-size:13px; background:rgba(239,68,68,0.15); padding:10px; border-radius:8px; border:1px solid rgba(239,68,68,0.3);">
                            ⚠️ Не удалось загрузить видео. Проверьте правильность прямой ссылки (.mp4).
                        </div>

                        <div style="display:flex; gap:15px; background:var(--bg-input); padding:12px 16px; border-radius:12px; align-items:center; flex-wrap:wrap;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="font-size:13px; color:var(--text-muted);">Озвучка:</span>
                                ${availableVoices.map(v => `<button class="season-tab-btn ${v === activeVoice ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, 0, '${v}', '${activeQuality}')">${v}</button>`).join('')}
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="font-size:13px; color:var(--text-muted);">Качество:</span>
                                ${availableQualities.map(q => `<button class="season-tab-btn ${q === activeQuality ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, 0, '${activeVoice}', '${q}')">${q}</button>`).join('')}
                            </div>
                        </div>

                        <div style="background:var(--bg-input); padding:12px 16px; border-radius:12px; display:flex; align-items:center; justify-content:space-between;">
                            <span>Оценка MAL: <b>⭐ ${avgRating}</b> (Ваша оценка: <span id="myRating">нет</span>)</span>
                            <div style="display:flex; gap:4px;">
                                ${[2,4,6,8,10].map(star => `<button style="background:none; border:none; color:#fbbf24; cursor:pointer; font-size:16px;" onclick="rateAnime('${anime.id}', ${star})">⭐${star}</button>`).join('')}
                            </div>
                        </div>

                        <div class="comments-section">
                            <h3>💬 Комментарии (<span id="commentsCount">${comments.length}</span>)</h3>
                            <div style="display:flex; gap:10px; flex-direction:column;">
                                <div style="display:flex; gap:10px;">
                                    <input type="text" id="commentInput" class="form-control" placeholder="Написать комментарий...">
                                    <button class="btn-primary" onclick="addComment('${anime.id}', ${activeSeason}, ${selectedEpIdx || 0}, '${activeVoice}', '${activeQuality}')">Отправить</button>
                                </div>
                                <label style="font-size:12px; color:var(--text-muted); cursor:pointer;"><input type="checkbox" id="isSpoiler"> Содержит спойлер</label>
                            </div>
                            <div id="commentsListContainer" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                                ${comments.map((c, cIdx) => `
                                    <div class="comment-item">
                                        <div class="comment-author" onclick="openProfileModal('${c.username}')">
                                            <span>👤 ${c.username}</span>
                                        </div>
                                        <div class="comment-text">${c.spoiler ? `<span class="spoiler-text" onclick="this.classList.toggle('revealed')">⚠️ Спойлер (нажмите чтобы открыть) <span style="color:transparent">${c.text}</span></span>` : c.text}</div>
                                        <div class="comment-reactions">
                                            ${['🔥', '❤️', '😂', '🤡'].map(emoji => {
                                                const count = (c.reactions && c.reactions[emoji]) ? c.reactions[emoji].length : 0;
                                                const myUser = currentUser ? currentUser.username : null;
                                                const hasMyReaction = myUser && c.reactions && c.reactions[emoji] && c.reactions[emoji].includes(myUser);
                                                return `
                                                    <button class="reaction-btn ${hasMyReaction ? 'active' : ''}" onclick="reactComment('${anime.id}', ${cIdx}, '${emoji}')">
                                                        <span>${emoji}</span> <span>${count}</span>
                                                    </button>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="watch-sidebar">
                        <h3 style="font-size:15px; margin-bottom:8px;">Сезоны</h3>
                        <div class="season-tabs">
                            ${seasonNumbers.map(s => `
                                <button class="season-tab-btn ${s === activeSeason ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${s}, 0, '${activeVoice}', '${activeQuality}')">
                                    Сезон ${s}
                                </button>
                            `).join('')}
                        </div>

                        <h3 style="font-size:15px; margin: 15px 0 8px 0;">Эпизоды (${finalEpList.length})</h3>
                        <div class="episodes-list-grid">
                            ${finalEpList.map((ep, i) => `
                                <div class="ep-card-side ${i === (selectedEpIdx || 0) ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${i}, '${activeVoice}', '${activeQuality}')">
                                    <span>${ep.title || ('Эпизод ' + (i+1))}</span>
                                    <span style="font-size:11px; opacity:0.7;">▶</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('watchModal').classList.add('active');

            const v = document.getElementById('animeVideoPlayer');
            if (v && savedTime > 0) {
                v.currentTime = savedTime;
                v.play().catch(() => {});
            }

            if (v) {
                v.ontimeupdate = function() {
                    const btn = document.getElementById('skipIntroBtn');
                    if (btn) {
                        if (v.currentTime >= 3 && v.currentTime <= 25) btn.style.display = 'block';
                        else btn.style.display = 'none';
                    }
                };
            }
        }

        function handleVideoError() {
            const errBox = document.getElementById('videoErrorMsg');
            if (errBox) errBox.style.display = 'block';
        }

        function toggleTheaterMode(id, season, epIdx, voice, quality) {
            isTheaterMode = !isTheaterMode;
            openWatchModal(id, season, epIdx, voice, quality);
        }

        function skipIntro() {
            const v = document.getElementById('animeVideoPlayer');
            if (v) v.currentTime += 85;
        }

        function saveProgress(id, video) {
            if (!currentUser) return;
            const key = `${currentUser.username}_${id}`;
            userWatchHistory[key] = video.currentTime;
            unlockAchievement(currentUser.username, 'Киноман (просмотрена серия)');
            saveData();
        }

        function playNextEp(id, season, currentIdx, voice, quality) {
            openWatchModal(id, season, currentIdx + 1, voice, quality);
        }

        function rateAnime(id, score) {
            if (!currentUser) { openAuthModal(); return; }
            const anime = animeList.find(a => a.id === id);
            if (!anime) return;
            if (!anime.ratings) anime.ratings = {};
            anime.ratings[currentUser.username] = score;
            
            unlockAchievement(currentUser.username, 'Критик (оценено аниме)');
            saveData();
            document.getElementById('myRating').innerText = score;
            openWatchModal(id);
        }

        async function addComment(id, season, epIdx, voice, quality) {
            if (!currentUser) { openAuthModal(); return; }
            const text = document.getElementById('commentInput').value.trim();
            const spoiler = document.getElementById('isSpoiler').checked;
            if (!text) return;
            
            if (!animeComments[id]) animeComments[id] = [];
            animeComments[id].unshift({ username: currentUser.username, text, spoiler, reactions: {} });
            
            unlockAchievement(currentUser.username, 'Оратор (первый комментарий)');
            await saveCommentsToCloud();
            openWatchModal(id, season, epIdx, voice, quality);
        }

        async function reactComment(id, cIdx, emoji) {
            if (!currentUser) { openAuthModal(); return; }
            const username = currentUser.username;
            if (!animeComments[id] || !animeComments[id][cIdx]) return;

            const comment = animeComments[id][cIdx];
            if (!comment.reactions) comment.reactions = {};

            Object.keys(comment.reactions).forEach(em => {
                if (comment.reactions[em]) {
                    comment.reactions[em] = comment.reactions[em].filter(u => u !== username);
                }
            });

            if (!comment.reactions[emoji]) comment.reactions[emoji] = [];
            const userIndex = comment.reactions[emoji].indexOf(username);
            
            if (userIndex > -1) {
                comment.reactions[emoji].splice(userIndex, 1);
            } else {
                comment.reactions[emoji].push(username);
            }

            await saveCommentsToCloud();
            openWatchModal(id);
        }

        // Запуск загрузки базы данных из Supabase при старте
        loadDataFromCloud();
    </script>
</body>
</html>
