        }
        function komiPlayerKind(url) {
            if (!url || typeof url !== 'string') return 'missing';
            const value = url.trim();
            if (/^<iframe\b/i.test(value)) return 'iframe';
            if (!/^https:\/\//i.test(value)) return 'missing';
            if (/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(value)) return 'video';
            if (/\.m3u8(?:[?#]|$)/i.test(value)) return 'hls';
            return 'embed';
        }
        function komiSafeUrl(url) {
            try { const u = new URL(url); return u.protocol === 'https:' ? u.href.replace(/"/g,'%22') : ''; } catch { return ''; }
        }
        function komiPlayerHtml(url, animeId, season, index) {
            const kind = komiPlayerKind(url);
            if (kind === 'missing') return '<div class="komi-player-notice">⚠️ Для этой серии пока нет доступного плеера. Попробуйте другой источник или сообщите о проблеме.</div>';
            if (kind === 'iframe') {
                const match = url.match(/src\s*=\s*["']([^"']+)["']/i);
                url = match ? match[1] : '';
                if (!komiSafeUrl(url)) return '<div class="komi-player-notice">⚠️ Неверная ссылка плеера.</div>';
            }
            const safe = komiSafeUrl(url);
            if (!safe) return '<div class="komi-player-notice">⚠️ Небезопасная или неверная ссылка плеера.</div>';
            if (kind === 'video') return '<div class="player-box"><video id="animeVideoPlayer" controls preload="metadata" playsinline onloadedmetadata="restoreKomiVideo(this)" ontimeupdate="saveProgress(\''+animeId+'\',this)" onended="playNextEp(\''+animeId+'\','+season+','+index+')" onerror="showKomiPlayerError()"><source src="'+safe+'"></video></div>';
            if (kind === 'hls') return '<div class="komi-player-notice">Этот источник использует HLS. Если видео не поддерживается браузером, откройте его в совместимом плеере.</div><div class="player-box"><video id="animeVideoPlayer" controls playsinline onloadedmetadata="restoreKomiVideo(this)" ontimeupdate="saveProgress(\''+animeId+'\',this)" onerror="showKomiPlayerError()" src="'+safe+'"></video></div>';
            return '<div class="player-box"><iframe src="'+safe+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" style="width:100%;min-height:340px;border:0;border-radius:14px"></iframe></div><p class="komi-player-hint">Встроенные плееры могут не передавать прогресс просмотра. Выбранная серия сохраняется.</p>';
        }
        function showKomiPlayerError() {
            const wrapper=document.querySelector('#watchModalContent .player-wrapper');
            if (wrapper && !wrapper.querySelector('.komi-player-notice')) wrapper.insertAdjacentHTML('beforeend','<div class="komi-player-notice">Не удалось загрузить видео. Выберите другой источник.</div>');
        }
        function restoreKomiVideo(video) {
            const p = getKomiProgress(video.dataset.animeId || window.komiActiveAnimeId);
            if (p && p.season === window.komiActiveSeason && p.index === window.komiActiveEpisode && p.time > 0 && (!video.duration || p.time < video.duration-5)) {
                try { video.currentTime = p.time; } catch(e) {}
            }
        }
        function playNextEp(animeId, season, index) {
            const anime = animeList.find(a=>String(a.id)===String(animeId));
            if (!anime) return;
            const eps=anime.episodes.filter(ep=>Number(ep.season||1)===Number(season));
            if (index+1<eps.length) openWatchModal(String(animeId),season,index+1);
        }
        function komiAchievements(username) {
            const statuses=userAnimeStatuses[username]||{};
            const watched=Object.values(statuses).filter(v=>v==='Просмотрено').length;
            const watching=Object.values(statuses).filter(v=>v==='Смотрю').length;
            const friends=(userFriends[username]||[]).length;
            const xp=watched*100+watching*20+friends*15;
            return {watched,watching,friends,xp,level:Math.floor(xp/300)+1,badges:[watched>=1&&'🎬 Первый просмотр',watched>=10&&'🏆 10 аниме',watched>=50&&'👑 Знаток аниме',friends>=1&&'🤝 Первый друг',watching>=5&&'🔥 Марафон'].filter(Boolean)};
        }
        function komiRecommendations() {
            if (!currentUser) return [];
            const statuses=userAnimeStatuses[currentUser.username]||{};
            const favs=userFavorites[currentUser.username]||{};
            const tastes={};
            animeList.forEach(a=>{if(statuses[a.id]||favs[a.id]) (a.genres||[]).forEach(g=>{tastes[g]=(tastes[g]||0)+1;});});
            return animeList.filter(a=>!statuses[a.id]&&!favs[a.id]).map(a=>({anime:a,score:(a.genres||[]).reduce((n,g)=>n+(tastes[g]||0),0)*10+(Number(a.shikiRating)||0)})).sort((a,b)=>b.score-a.score).slice(0,7).map(x=>x.anime);
        }

        function komiRecentMarkup(username, limit=6) {
            if (!username || username !== currentUser?.username) return '';
            const prefix=username+'_';
            const items=Object.entries(komiEpisodeProgress).filter(([key,p])=>key.startsWith(prefix)&&p&&p.updated).sort((a,b)=>b[1].updated-a[1].updated).slice(0,limit).map(([key,p])=>({anime:animeList.find(a=>String(a.id)===key.slice(prefix.length)),p})).filter(x=>x.anime);
            if (!items.length) return '<div class="komi-recent-empty">Здесь появятся аниме, которые ты недавно открывал для просмотра.</div>';
            return '<div class="komi-recent-grid">'+items.map(({anime,p})=>'<button class="komi-recent-card" onclick="resumeKomiAnime(\''+anime.id+'\')"><img loading="lazy" src="'+escapeFriendHtml(anime.poster||'')+'" alt=""><span class="komi-recent-info"><strong>'+escapeFriendHtml(anime.title)+'</strong><small>Сезон '+p.season+' · Серия '+(p.index+1)+'</small><em>Продолжить →</em></span></button>').join('')+'</div>';
        }

        function komiAnimeYear(anime) {
            const candidates = [anime?.year, anime?.aired_on, anime?.airedOn, anime?.releaseYear];
            for (const value of candidates) {
                const found = String(value ?? '').match(/(?:^|\D)((?:19|20)\d{2})(?:\D|$)/);
                if (found) return found[1];
            }
            return '';
        }

        function showKomiYear(year) {
            catalogFilterYear = String(year);
            catalogVisibleCount = 48;
            navigate('catalog');
        }

        function komiYearSections() {
            const years = ['2026', '2025', '2024'];
            return years.map(year => {
                const items = animeList.filter(a => komiAnimeYear(a) === year);
                if (!items.length) return '';
                return '<section class="komi-feature-section"><div class="section-header"><h2 class="section-title">🎬 Аниме ' + year + '</h2><button class="section-see-all" onclick="showKomiYear(\'' + year + '\')">Все аниме ' + year + ' · ' + items.length + '</button></div><div class="anime-grid">' + items.slice(0, 7).map(a => renderCard(a)).join('') + '</div></section>';
            }).join('');
        }

        function komiReleaseCalendar() {
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const now = Date.now();
            const upcoming = animeList.map(a => ({
                anime: a, date: new Date(a.nextEpisodeAt || a.next_episode_at || a.nextEpisodeDate)
            })).filter(x => Number.isFinite(x.date.getTime()) && x.date.getTime() > now && x.date.getTime() < now + 14 * 86400000)
              .sort((a,b) => a.date - b.date).slice(0, 12);
            const newEpisodes = animeList.map(a => ({
                anime: a, date: new Date(a.lastEpisodeAddedAt)
            })).filter(x => Number.isFinite(x.date.getTime()) && now - x.date.getTime() < 3 * 86400000 && x.date.getTime() <= now)
              .sort((a,b) => b.date - a.date).slice(0, 8);
            let content = '<section class="komi-feature-section" id="komiCalendarSection"><div class="section-header"><h2 class="section-title">📅 Календарь серий</h2></div>';
            if (upcoming.length) {
                content += '<p class="komi-feature-muted">Время выхода в оригинальном эфире. Озвучка и плеер могут появиться позже.</p>';
                content += '<div class="komi-release-list">' + upcoming.map(x => '<button onclick="openWatchModal(\'' + x.anime.id + '\')" class="komi-release-row"><span>' + days[x.date.getDay()] + ' · ' + x.date.toLocaleDateString('ru-RU', {day:'numeric',month:'short'}) + '</span><strong>' + escapeFriendHtml(x.anime.title) + (x.anime.nextEpisodeNumber ? ' · серия ' + Number(x.anime.nextEpisodeNumber) : '') + '</strong><small>' + x.date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) + '</small></button>').join('') + '</div>';
            } else {
                content += '<p class="komi-feature-muted">Подтверждённое расписание пока загружается. Даты не придумываем.</p>';
            }
            if (newEpisodes.length) {
                content += '<div class="section-header" style="margin-top:16px"><h3 class="section-title" style="font-size:14px">🆕 Недавно добавленные серии</h3></div>';
                content += '<div class="komi-release-list">' + newEpisodes.map(x =>
                    '<button onclick="openWatchModal(\'' + x.anime.id + '\')" class="komi-release-row"><span>' + x.date.toLocaleDateString('ru-RU', {day:'numeric',month:'short'}) + '</span><strong>' + escapeFriendHtml(x.anime.title) + '</strong><small>' + (x.anime.lastEpisodeNumber ? 'Серия ' + Number(x.anime.lastEpisodeNumber) : 'Новые серии') + '</small></button>'
                ).join('') + '</div>';
            }
            return content + '</section>';
        }

        function toggleKomiWatchFullscreen() {
            const modal=document.getElementById('watchModal');
            modal?.classList.toggle('komi-watch-fullscreen');
            const button=modal?.querySelector('.komi-watch-expand span');
            if(button) button.textContent=modal.classList.contains('komi-watch-fullscreen')?'Обычный размер':'На весь экран';
        }
        function closeWatchModal() {
            document.getElementById('watchModal')?.classList.remove('komi-watch-fullscreen');
            const videoEl = document.getElementById('animeVideoPlayer');
            if (videoEl) {
                videoEl.pause();
                videoEl.currentTime = 0;
            }
            document.getElementById('watchModal').classList.remove('active');
        }

        function changePlayerSource(animeId, season, epIdx, sourceName) {
            activePlayerSource = sourceName;
            openWatchModal(animeId, season, epIdx);
        }

        async function openWatchModal(id, selectedSeason = null, selectedEpIdx = 0) {
            siteStats.views++;
            saveData();
            
            if (_supabase) {
                try {
                    const { data } = await _supabase.from('animes').select('*').in('id', [2, 4]);
                    if (data) {
                        data.forEach(row => {
                            if (row.id === 2) animeComments = JSON.parse(row.content || '{}');
                            if (row.id === 4) userProfiles = { ...userProfiles, ...JSON.parse(row.content || '{}') };
                        });
                    }
                } catch(e) {}
            }

            const anime = animeList.find(a => String(a.id) === String(id));
            if (!anime) return;
            if (!Array.isArray(anime.episodes) || anime.episodes.length === 0) { document.getElementById('watchModalContent').innerHTML = '<button class="modal-close" onclick="closeWatchModal()">×</button><div class="komi-player-notice" style="margin:35px">Серии для «'+escapeFriendHtml(anime.title)+'» пока не добавлены. Бот проверит источники при следующей синхронизации.</div>'; document.getElementById('watchModal').classList.add('active'); return; }

            const seasonsMap = {};
            anime.episodes.forEach((ep, idx) => {
                const s = ep.season || 1;
                if (!seasonsMap[s]) seasonsMap[s] = [];
                seasonsMap[s].push({ ...ep, originalIdx: idx });
            });

            const seasonNumbers = Object.keys(seasonsMap).map(Number).sort((a,b) => a - b);
            const activeSeason = selectedSeason !== null && seasonsMap[selectedSeason] ? Number(selectedSeason) : seasonNumbers[0];
            const currentSeasonEpisodes = seasonsMap[activeSeason];
            const currentEp = currentSeasonEpisodes[selectedEpIdx] || currentSeasonEpisodes[0];

            const sources = currentEp.sources && typeof currentEp.sources === 'object' ? currentEp.sources : { 'Default': currentEp.url || '' };
            const sourceNames = Object.keys(sources).filter(name => typeof sources[name] === 'string' && sources[name].trim());
            if (!sourceNames.length) sourceNames.push('Недоступно');
            if (!sourceNames.includes(activePlayerSource)) {
                activePlayerSource = sourceNames[0];
            }
            const activeUrl = sources[activePlayerSource] || '';

            window.komiActiveAnimeId=String(anime.id);
            window.komiActiveSeason=Number(activeSeason);
            window.komiActiveEpisode=Number(selectedEpIdx)||0;
            saveKomiEpisode(String(anime.id),activeSeason,selectedEpIdx,getKomiProgress(anime.id)?.season===Number(activeSeason)&&getKomiProgress(anime.id)?.index===Number(selectedEpIdx)?getKomiProgress(anime.id).time:0);
            let playerHtml = komiPlayerHtml(activeUrl,String(anime.id),activeSeason,selectedEpIdx);

            const comments = animeComments[anime.id] || [];
            const userHistoryKey = currentUser ? `${currentUser.username}_${anime.id}` : null;
            const savedTime = userHistoryKey ? (userWatchHistory[userHistoryKey] || 0) : 0;
            const userFavCategory = currentUser ? ((userFavorites[currentUser.username] || {})[anime.id] || '') : '';
            const shikiRating = anime.shikiRating || '8.5';
            const myCurrentStatus = currentUser && userAnimeStatuses[currentUser.username] ? (userAnimeStatuses[currentUser.username][anime.id] || '') : '';
            
            const customFolders = currentUser ? (userCustomFolders[currentUser.username] || {}) : {};
            const screenshots = (anime.screenshots && anime.screenshots.length > 0) ? anime.screenshots : [anime.poster, anime.poster, anime.poster, anime.poster];

            document.getElementById('watchModalContent').innerHTML = `
                <button class="komi-watch-expand" onclick="toggleKomiWatchFullscreen()" title="Полный экран">⛶ <span>На весь экран</span></button>
                <button class="modal-close" onclick="playSound(); closeWatchModal()">&times;</button>
                <div class="watch-cinema-layout">
                    <div class="crunchy-hero-section">
                        <img src="${anime.poster}" class="crunchy-hero-poster" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'">
                        <div class="crunchy-hero-info">
                            <span style="font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;">Просмотр</span>
                            <h1>${anime.title}</h1>
                            <p style="color:var(--text-muted); font-size:11px; line-height:1.4;">${anime.desc || ''}</p>
                            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:2px;">
                                <span style="color:#fbbf24; font-weight:700; font-size:11px;">⭐ ${shikiRating} Shikimori</span>
                                <span style="background:var(--bg-input); padding:2px 6px; border-radius:5px; font-size:10px; border:1px solid var(--border);">${(anime.genres||[]).join(', ')}</span>
                                <span style="background:var(--bg-input); padding:2px 6px; border-radius:5px; font-size:10px; border:1px solid var(--border);">${anime.year || '2026'}</span>
                                <button class="btn-secondary" style="padding:3px 8px; font-size:10px;" onclick="playSound(); toggleFavorite('${anime.id}', 'Любимые')">⭐ ${userFavCategory ? 'В избранном' : 'В избранное'}</button>
                                <button class="btn-glow-secondary" style="padding:3px 8px; font-size:10px;" onclick="playSound(); createWatchPartyFromAnime('${anime.id}')">🎉 Party</button>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:6px 10px; border-radius:8px;">
                        <span style="font-size:11px; color:var(--text-muted);">Статус:</span>
                        ${['Просмотрено', 'В планах', 'Смотрю', 'Отложено', 'Брошено'].map(st => `
                            <button class="season-tab-btn ${myCurrentStatus === st ? 'active' : ''}" onclick="playSound(); setAnimeStatus('${anime.id}', '${st}')">${st}</button>
                        `).join('')}
                    </div>

                    ${Object.keys(customFolders).length > 0 ? `
                        <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap; background:var(--bg-input); padding:6px 10px; border-radius:8px;">
                            <span style="font-size:11px; color:var(--text-muted);">Папки:</span>
                            ${Object.keys(customFolders).map(fname => {
                                const inFolder = (customFolders[fname] || []).includes(anime.id);
                                return `<button class="season-tab-btn ${inFolder ? 'active' : ''}" onclick="playSound(); addToCustomFolder('${anime.id}', '${fname}')">📁 ${fname} ${inFolder ? '✓' : ''}</button>`;
                            }).join('')}
                        </div>
                    ` : ''}

                    <div class="komi-player-heading"><div><small>СМОТРЕТЬ ОНЛАЙН</small><h2>${escapeFriendHtml(anime.title)}</h2><span>Сезон ${activeSeason} · Серия ${Number(selectedEpIdx)+1}</span></div><button class="komi-watch-next" onclick="playNextEp('${anime.id}',${activeSeason},${selectedEpIdx})">Следующая серия →</button></div>
                    <div class="players-switcher-bar">
                        <span style="font-size:11px; color:var(--text-muted); font-weight:700;">Плеер:</span>
                        ${sourceNames.map(srcName => `
                            <button class="player-switch-btn ${srcName === activePlayerSource ? 'active' : ''}" onclick="playSound(); changePlayerSource('${anime.id}', ${activeSeason}, ${selectedEpIdx}, '${srcName}')">
                                🎬 ${srcName}
                            </button>
                        `).join('')}
                    </div>

                    <div class="player-wrapper">
                        ${playerHtml}
                    </div>

                    <div class="anime-screenshots-section">
                        <h3 style="font-size:11px; color:var(--text-main); margin-bottom:4px;">🖼️ Кадры</h3>
                        <div class="screenshots-grid">
                            ${screenshots.map(sc => `<img src="${sc}" class="screenshot-thumb" onerror="this.src='https://cdn.myanimelist.net/images/anime/1122/96435.jpg'" onclick="playSound(); window.open('${sc}', '_blank')">`).join('')}
                        </div>
                    </div>

                    <div class="crunchy-episodes-section">
                        <div class="season-tabs">
                            ${seasonNumbers.map(s => `
                                <button class="season-tab-btn ${s === activeSeason ? 'active' : ''}" onclick="playSound(); openWatchModal('${anime.id}', ${s}, 0)">
                                    Сезон ${s}
                                </button>
                            `).join('')}
                        </div>

                        <h3 style="font-size:12px; font-weight:700; margin-bottom:8px;">Эпизоды (${currentSeasonEpisodes.length})</h3>
                        <div class="komi-episode-number-grid">
                            ${currentSeasonEpisodes.map((ep, i) => `
                                <button type="button" class="komi-episode-number ${i === (selectedEpIdx || 0) ? 'active' : ''}" title="Серия ${i+1}" aria-label="Серия ${i+1}" aria-current="${i === (selectedEpIdx || 0) ? 'true' : 'false'}" onclick="playSound(); openWatchModal('${anime.id}', ${activeSeason}, ${i})">
                                    ${i + 1}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('watchModal').classList.add('active');
        }

        function saveProgress(animeId, video) {
            if (!currentUser) return;
            const key = `${currentUser.username}_${animeId}`;
            saveKomiEpisode(animeId,window.komiActiveSeason,window.komiActiveEpisode,video.currentTime,video.duration);
        }


        async function refreshKomiCatalogUpdates() {
            if (!_supabase || document.hidden) return;
            try {
                const { data: rows, error } = await _supabase.from('anime_catalog')
                    .select('shikimori_id,data,updated_at')
                    .order('updated_at', { ascending: false })
                    .limit(100);
                if (error) throw error;
                let changed = false;
                const indexById = new Map(animeList.map((item, index) => [String(item.id), index]));
                for (const row of rows || []) {
                    const data = row.data;
                    if (!data || !Array.isArray(data.episodes) || !data.episodes.some(ep =>
                        ep?.sources && Object.values(ep.sources).some(src =>
                            typeof src === 'string' && src.includes('https://')))) continue;
                    const id = String(row.shikimori_id);
                    const normalized = {
                        ...data, id, shikimoriId: Number(row.shikimori_id),
                        title: data.title || data.originalTitle || 'Без названия',
                        genres: Array.isArray(data.genres) ? data.genres : [],
                        episodes: data.episodes
                    };
                    const index = indexById.get(id);
                    if (index === undefined) {
                        indexById.set(id, animeList.length);
                        animeList.push(normalized);
                        changed = true;
                    } else if (JSON.stringify(animeList[index]) !== JSON.stringify(normalized)) {
                        animeList[index] = normalized;
                        changed = true;
                    }
                }
                if (changed && (currentView === 'home' || currentView === 'catalog') &&
                    !document.getElementById('watchModal')?.classList.contains('active')) render();
            } catch (error) {
                console.warn('Обновление каталога:', error.message);
            }
        }
        setInterval(refreshKomiCatalogUpdates, 120000);

        loadDataFromCloud();
        restoreGoogleSession();
    </script>
</body>
</html>
